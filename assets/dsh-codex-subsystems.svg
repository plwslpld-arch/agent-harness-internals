      <g fill="#0f172a"><text x="195" y="202">prompt · llm · token-meter</text><text x="195" y="267">agent-loop · orchestration</text><text x="195" y="332">tools · sandbox · approval</text><text x="195" y="397">session · event-log</text><text x="195" y="462">compaction · context</text><text x="195" y="527">web · host · protocol</text><text x="195" y="592">plugin · cordis · preset</text></g>
      <g fill="#e2e8f0" stroke="#94a3b8"><rect x="450" y="170" width="300" height="50" rx="12"/><rect x="450" y="235" width="300" height="50" rx="12"/><rect x="450" y="300" width="300" height="50" rx="12"/><rect x="450" y="365" width="300" height="50" rx="12"/><rect x="450" y="430" width="300" height="50" rx="12"/><rect x="450" y="495" width="300" height="50" rx="12"/><rect x="450" y="560" width="300" height="50" rx="12"/></g>
      <g fill="#0f172a" font-weight="700"><text x="600" y="202">REQUEST CONSTRUCTION</text><text x="600" y="267">AGENT LOOP</text><text x="600" y="332">TOOLS + POLICY</text><text x="600" y="397">SESSION + TRACE</text><text x="600" y="462">CONTEXT CONTROL</text><text x="600" y="527">SURFACES</text><text x="600" y="592">EXTENSION SYSTEM</text></g>
      <g fill="#ffedd5" stroke="#fb923c"><rect x="875" y="170" width="260" height="50" rx="12"/><rect x="875" y="235" width="260" height="50" rx="12"/><rect x="875" y="300" width="260" height="50" rx="12"/><rect x="875" y="365" width="260" height="50" rx="12"/><rect x="875" y="430" width="260" height="50" rx="12"/><rect x="875" y="495" width="260" height="50" rx="12"/><rect x="875" y="560" width="260" height="50" rx="12"/></g>
      <g fill="#0f172a"><text x="1005" y="202">core · protocol</text><text x="1005" y="267">core agent turn</text><text x="1005" y="332">exec · sandboxing · policy</text><text x="1005" y="397">state · rollout · protocol</text><text x="1005" y="462">compact · truncate</text><text x="1005" y="527">cli · app-server · tui</text><text x="1005" y="592">skills · mcp · hooks</text></g>
