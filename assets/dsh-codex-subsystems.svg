<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness packages and Codex crates mapped by subsystem</title>
  <desc id="desc">Different repository structures converge on common prompt, loop, tools, policy, session, surface, and extension subsystems</desc>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="660" rx="28" fill="#f8fafc"/>
  <text x="55" y="60" fill="#0f172a" font-size="30" font-family="Arial, sans-serif" font-weight="700">Two repository shapes · one subsystem vocabulary</text>
  <text x="55" y="92" fill="#64748b" font-size="16" font-family="Arial, sans-serif">Directory names are implementation choices; arrows map responsibilities, not one-to-one APIs.</text>
  <g font-family="Arial, sans-serif">
    <text x="195" y="140" text-anchor="middle" fill="#0369a1" font-size="22" font-weight="700">DSH package groups</text>
    <text x="600" y="140" text-anchor="middle" fill="#334155" font-size="22" font-weight="700">Shared subsystem</text>
    <text x="1000" y="140" text-anchor="middle" fill="#9a3412" font-size="22" font-weight="700">Codex crates / modules</text>
    <g font-size="16" text-anchor="middle">
