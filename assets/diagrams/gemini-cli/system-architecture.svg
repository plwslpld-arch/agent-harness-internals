<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Gemini CLI 智能体运行框架系统架构</title><desc id="desc">产品表面和配置进入智能体会话，轮次解析模型流，工具调度器管理工具状态，安全、状态、扩展和评测位于相邻边界。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="920" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">Gemini CLI：表面可变，核心工具状态必须可追踪</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">课程架构投影；设置、信任、策略、扩展与平台共同决定真实能力</text>
  <rect x="55" y="120" width="1290" height="120" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="157" font-size="23" font-weight="760" fill="#285383">一　产品表面：接收目标，投影事件，不共享全部协议语义</text>
  <g font-size="18" text-anchor="middle" fill="#17324D"><rect x="90" y="180" width="210" height="42" rx="12" fill="#fff"/><text x="195" y="207">交互命令行</text><rect x="325" y="180" width="210" height="42" rx="12" fill="#fff"/><text x="430" y="207">无界面执行</text><rect x="560" y="180" width="210" height="42" rx="12" fill="#fff"/><text x="665" y="207">开发环境连接</text><rect x="795" y="180" width="210" height="42" rx="12" fill="#fff"/><text x="900" y="207">A2A 服务</text><rect x="1030" y="180" width="270" height="42" rx="12" fill="#fff"/><text x="1165" y="207">文本／JSON／流式 JSON</text></g>
  <path d="M700 240v48" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <rect x="55" y="296" width="1290" height="150" rx="24" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="84" y="334" font-size="23" font-weight="760" fill="#955A00">二　装配边界：配置与上下文先形成一次运行的有效输入</text>
  <g font-size="18" text-anchor="middle"><rect x="88" y="358" width="250" height="62" rx="14" fill="#fff" stroke="#D8A84D"/><text x="213" y="384" fill="#17324D" font-weight="720">分层设置与环境</text><text x="213" y="407" fill="#50677D">系统、用户、工作区、命令行</text><rect x="390" y="358" width="250" height="62" rx="14" fill="#fff" stroke="#D8A84D"/><text x="515" y="384" fill="#17324D" font-weight="720">信任与能力发现</text><text x="515" y="407" fill="#50677D">工具、技能、钩子、MCP</text><rect x="692" y="358" width="250" height="62" rx="14" fill="#fff" stroke="#D8A84D"/><text x="817" y="384" fill="#17324D" font-weight="720">提示与项目指令文件</text><text x="817" y="407" fill="#50677D">指令、资源与工具结构</text><rect x="994" y="358" width="300" height="62" rx="14" fill="#fff" stroke="#D8A84D"/><text x="1144" y="384" fill="#17324D" font-weight="720">有效运行配置</text><text x="1144" y="407" fill="#50677D">模型、审批模式、沙箱与服务</text></g>
  <g stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M338 389h44"/><path d="M640 389h44"/><path d="M942 389h44"/></g>
  <rect x="55" y="490" width="870" height="305" rx="26" fill="#E7F5F3" stroke="#087F7C" stroke-width="3" filter="url(#s)"/><text x="84" y="530" font-size="24" font-weight="760" fill="#076663">三　运行框架核心：一次真实任务可以包含多次模型响应</text>
  <g font-size="18" text-anchor="middle"><rect x="90" y="565" width="220" height="75" rx="15" fill="#fff" stroke="#58AFA9"/><text x="200" y="594" fill="#17324D" font-weight="720">智能体会话</text><text x="200" y="619" fill="#50677D">循环、取消、最终事件</text><rect x="370" y="565" width="220" height="75" rx="15" fill="#fff" stroke="#58AFA9"/><text x="480" y="594" fill="#17324D" font-weight="720">轮次与模型路由</text><text x="480" y="619" fill="#50677D">流事件、工具请求、结束原因</text><rect x="650" y="565" width="220" height="75" rx="15" fill="#fff" stroke="#58AFA9"/><text x="760" y="594" fill="#17324D" font-weight="720">工具调度器</text><text x="760" y="619" fill="#50677D">工具状态、确认、执行与结算</text></g>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M310 602h52"/><path d="M590 602h52"/><path d="M760 640v62H480v-54"/></g><text x="620" y="677" text-anchor="middle" font-size="17" fill="#076663">函数响应回到下一次模型请求</text>
  <rect x="90" y="720" width="780" height="48" rx="13" fill="#17324D"/><text x="480" y="750" text-anchor="middle" font-size="18" fill="#fff">有待处理工具时，模型结束事件不能结束智能体会话</text>
  <rect x="960" y="490" width="385" height="305" rx="26" fill="#F0EAF8" stroke="#76559B" stroke-width="3" filter="url(#s)"/><text x="990" y="530" font-size="23" font-weight="760" fill="#614482">四　相邻责任面</text>
  <g font-size="17" text-anchor="middle"><rect x="995" y="558" width="315" height="48" rx="13" fill="#fff"/><text x="1152" y="588" fill="#17324D">策略、确认与模型安全</text><rect x="995" y="620" width="315" height="48" rx="13" fill="#fff"/><text x="1152" y="650" fill="#17324D">平台沙箱与真实副作用</text><rect x="995" y="682" width="315" height="48" rx="13" fill="#fff"/><text x="1152" y="712" fill="#17324D">记录、历史、压缩与记忆</text><rect x="995" y="744" width="315" height="32" rx="11" fill="#fff"/><text x="1152" y="766" fill="#17324D">遥测与独立评测</text></g>
  <rect x="55" y="834" width="1290" height="48" rx="14" fill="#17324D"/><text x="700" y="864" text-anchor="middle" font-size="18" fill="#fff">证据边界：目录与事件存在不是默认能力或任务成功；独立评测必须检查目标产物和副作用</text>
  </g></svg>
