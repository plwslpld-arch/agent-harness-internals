<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 轮次、路由和工具调度生命周期</title><desc id="desc">模型路由选择一次请求的模型，轮次产生流事件，智能体会话解释待处理工具，工具调度器维护独立调用状态。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="56" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">结束原因属于模型响应，不属于整个任务</text><text x="700" y="91" text-anchor="middle" font-size="18" fill="#50677D">一次智能体会话可包含多次模型响应和多个独立工具状态迁移</text>
<rect x="55" y="130" width="1290" height="145" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="169" font-size="23" font-weight="760" fill="#285383">一　模型路由：按顺序尝试覆盖、审批模式、分类与默认策略</text><g font-size="17" text-anchor="middle"><rect x="95" y="205" width="205" height="45" rx="12" fill="#fff"/><text x="198" y="234">回退与显式覆盖</text><rect x="330" y="205" width="205" height="45" rx="12" fill="#fff"/><text x="433" y="234">审批模式策略</text><rect x="565" y="205" width="205" height="45" rx="12" fill="#fff"/><text x="668" y="234">可选分类策略</text><rect x="800" y="205" width="205" height="45" rx="12" fill="#fff"/><text x="903" y="234">数值分类策略</text><rect x="1035" y="205" width="270" height="45" rx="12" fill="#E7F5F3"/><text x="1170" y="234">本次请求的模型决定</text></g><g stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M300 228h22"/><path d="M535 228h22"/><path d="M770 228h22"/><path d="M1005 228h22"/></g>
<rect x="55" y="320" width="610" height="405" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="84" y="360" font-size="23" font-weight="760" fill="#076663">二　轮次与智能体会话：先解释事件，再判断是否结束</text><g font-size="18"><rect x="95" y="398" width="530" height="62" rx="14" fill="#fff"/><text x="120" y="426" fill="#17324D" font-weight="720">模型流事件</text><text x="120" y="450" fill="#50677D">正文、思考、工具请求、重试、引用、结束原因</text><rect x="95" y="488" width="530" height="62" rx="14" fill="#FFF2D4"/><text x="120" y="516" fill="#955A00" font-weight="720">有待处理工具</text><text x="120" y="540" fill="#50677D">保存结束原因，但不发出会话结束</text><rect x="95" y="578" width="530" height="62" rx="14" fill="#fff"/><text x="120" y="606" fill="#17324D" font-weight="720">无待处理工具</text><text x="120" y="630" fill="#50677D">映射为完成、预算耗尽、拒绝或失败</text></g><path d="M360 460v20M360 550v20" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><rect x="95" y="667" width="530" height="38" rx="11" fill="#17324D"/><text x="360" y="692" text-anchor="middle" font-size="17" fill="#fff">会话终态仍不是任务正确性判定</text>
<rect x="715" y="320" width="630" height="405" rx="25" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5" filter="url(#s)"/><text x="744" y="360" font-size="23" font-weight="760" fill="#614482">三　工具调度器：每个调用拥有自己的状态和批次边界</text><g font-size="16" text-anchor="middle"><rect x="755" y="405" width="155" height="58" rx="13" fill="#fff"/><text x="833" y="438">验证中</text><rect x="945" y="405" width="155" height="58" rx="13" fill="#fff"/><text x="1023" y="438">已排队</text><rect x="1135" y="405" width="170" height="58" rx="13" fill="#FFF2D4"/><text x="1220" y="438">等待审批</text><rect x="945" y="505" width="155" height="58" rx="13" fill="#E7F5F3"/><text x="1023" y="538">执行中</text><rect x="755" y="610" width="155" height="58" rx="13" fill="#E7F5F3"/><text x="833" y="643">成功</text><rect x="945" y="610" width="155" height="58" rx="13" fill="#FFECE5"/><text x="1023" y="643">错误</text><rect x="1135" y="610" width="170" height="58" rx="13" fill="#E9F2FF"/><text x="1220" y="643">已取消</text></g><g stroke="#087F7C" stroke-width="3.5" fill="none" marker-end="url(#a)"><path d="M910 434h27"/><path d="M1100 434h27"/><path d="M1220 463v55h-112"/><path d="M1023 563v38"/><path d="M1023 563l-170 39"/><path d="M1023 563l177 39"/></g>
<rect x="120" y="770" width="1160" height="78" rx="19" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="700" y="801" text-anchor="middle" font-size="20" font-weight="760" fill="#9A3E24">对抗核对</text><text x="700" y="830" text-anchor="middle" font-size="17" fill="#17324D">模型结束原因、工具终态、会话终态、产品退出状态和评测试次必须分别计数</text></g></svg>
