<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 确认、策略、安全与沙箱边界</title><desc id="desc">工具授权从模式和信任进入策略三态，经消息总线确认后才可能执行；平台沙箱另行限制副作用，模型安全结束位于独立事件面。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#087F7C"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#38845D"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C96138"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C57A0B"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="980" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" font-size="35" font-weight="760" fill="#17324D">确认、策略、模型安全与平台隔离不能合并成一个“安全”</text><text x="700" y="91" text-anchor="middle" font-size="18" fill="#50677D">前一层放行只代表可以进入下一层，不代表副作用受限或任务正确</text>
<rect x="55" y="125" width="1290" height="160" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="165" font-size="22" font-weight="760" fill="#285383">一　配置入口：模式、信任与运行表面先决定默认边界</text><g font-size="16" text-anchor="middle"><rect x="100" y="205" width="230" height="55" rx="13" fill="#fff"/><text x="215" y="239" font-weight="720">审批模式</text><rect x="385" y="205" width="230" height="55" rx="13" fill="#fff"/><text x="500" y="239" font-weight="720">目录是否受信</text><rect x="670" y="205" width="230" height="55" rx="13" fill="#fff"/><text x="785" y="239" font-weight="720">交互或非交互</text><rect x="955" y="205" width="330" height="55" rx="13" fill="#FFF2D4"/><text x="1120" y="239" font-weight="720">沙箱启用、平台与可用后端</text></g>
<rect x="55" y="325" width="1290" height="355" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="84" y="366" font-size="22" font-weight="760" fill="#076663">二　工具控制面：先决策，再确认，最后才取得执行资格</text><rect x="95" y="420" width="205" height="78" rx="15" fill="#fff"/><text x="198" y="451" text-anchor="middle" font-size="18" font-weight="720">工具请求</text><text x="198" y="478" text-anchor="middle" font-size="15" fill="#50677D">名称、参数、调用标识</text><rect x="355" y="420" width="220" height="78" rx="15" fill="#fff"/><text x="465" y="451" text-anchor="middle" font-size="18" font-weight="720">策略引擎</text><text x="465" y="478" text-anchor="middle" font-size="15" fill="#50677D">规则、模式、检查器</text><path d="M300 459h47" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><rect x="640" y="393" width="185" height="56" rx="13" fill="#DFF4E8" stroke="#38845D" stroke-width="2"/><text x="733" y="428" text-anchor="middle" font-size="17" font-weight="720" fill="#286747">允许</text><rect x="640" y="470" width="185" height="56" rx="13" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="733" y="505" text-anchor="middle" font-size="17" font-weight="720" fill="#9A3E24">拒绝</text><rect x="640" y="547" width="185" height="56" rx="13" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="733" y="582" text-anchor="middle" font-size="17" font-weight="720" fill="#955A00">询问用户</text><path d="M575 443h55" stroke="#38845D" stroke-width="3.2" marker-end="url(#g)"/><path d="M575 459c28 0 28 39 55 39" stroke="#C96138" stroke-width="3.2" fill="none" marker-end="url(#r)"/><path d="M575 475c28 0 28 100 55 100" stroke="#C57A0B" stroke-width="3.2" fill="none" marker-end="url(#o)"/><rect x="890" y="420" width="210" height="105" rx="16" fill="#F0EAF8" stroke="#70509A" stroke-width="2"/><text x="995" y="453" text-anchor="middle" font-size="18" font-weight="720" fill="#573D79">消息总线</text><text x="995" y="480" text-anchor="middle" font-size="15" fill="#50677D">关联请求与响应</text><text x="995" y="505" text-anchor="middle" font-size="15" fill="#50677D">无界面时不无限等待</text><path d="M825 575c45 0 35-82 57-91" stroke="#70509A" stroke-width="3.2" fill="none" marker-end="url(#a)"/><rect x="1160" y="420" width="150" height="105" rx="16" fill="#fff"/><text x="1235" y="459" text-anchor="middle" font-size="18" font-weight="720">执行器</text><text x="1235" y="486" text-anchor="middle" font-size="15" fill="#50677D">仅接收放行调用</text><path d="M825 421h310c12 0 17 9 17 24" stroke="#38845D" stroke-width="3.2" fill="none" marker-end="url(#g)"/><path d="M1100 472h52" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><rect x="890" y="560" width="420" height="80" rx="16" fill="#17324D"/><text x="1100" y="591" text-anchor="middle" font-size="17" font-weight="720" fill="#fff">拒绝或用户取消：结算调用，不进入执行器</text><text x="1100" y="618" text-anchor="middle" font-size="15" fill="#8EE1D8">确认响应是控制证据，不是安全或正确性证明</text><path d="M825 498h35c15 0 15 102 22 102" stroke="#C96138" stroke-width="3.2" fill="none" marker-end="url(#r)"/><path d="M995 525v27" stroke="#70509A" stroke-width="3.2" marker-end="url(#a)"/>
<rect x="55" y="720" width="825" height="205" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="760" font-size="21" font-weight="760" fill="#285383">三　执行隔离面：启用后按平台兑现权限边界</text><g font-size="15" text-anchor="middle"><rect x="90" y="800" width="170" height="82" rx="14" fill="#fff"/><text x="175" y="831" font-size="17" font-weight="720">未启用</text><text x="175" y="858" fill="#50677D">无操作管理器</text><rect x="285" y="800" width="170" height="82" rx="14" fill="#fff"/><text x="370" y="831" font-size="17" font-weight="720">Linux</text><text x="370" y="858" fill="#50677D">容器与调用过滤</text><rect x="480" y="800" width="170" height="82" rx="14" fill="#fff"/><text x="565" y="831" font-size="17" font-weight="720">macOS</text><text x="565" y="858" fill="#50677D">系统隔离配置</text><rect x="675" y="800" width="170" height="82" rx="14" fill="#fff"/><text x="760" y="831" font-size="17" font-weight="720">Windows</text><text x="760" y="858" fill="#50677D">受限令牌与作业对象</text></g><text x="468" y="910" text-anchor="middle" font-size="15" fill="#50677D">命令行还可选择容器或系统外层启动；它与逐工具平台管理器必须分别记录</text>
<rect x="920" y="720" width="425" height="205" rx="24" fill="#FFECE5" stroke="#C96138" stroke-width="2.5" filter="url(#s)"/><text x="1133" y="760" text-anchor="middle" font-size="18" font-weight="760" fill="#9A3E24">四　模型事件面：安全结束不授予工具权限</text><rect x="965" y="800" width="150" height="75" rx="14" fill="#fff"/><text x="1040" y="831" text-anchor="middle" font-size="17" font-weight="720">模型候选</text><text x="1040" y="857" text-anchor="middle" font-size="15" fill="#50677D">安全结束原因</text><rect x="1160" y="800" width="140" height="75" rx="14" fill="#fff"/><text x="1230" y="831" text-anchor="middle" font-size="17" font-weight="720">轮次结束</text><text x="1230" y="857" text-anchor="middle" font-size="15" fill="#50677D">记录原因</text><path d="M1115 838h37" stroke="#C96138" stroke-width="3.5" marker-end="url(#r)"/><text x="1133" y="908" text-anchor="middle" font-size="15" fill="#9A3E24">不等于策略拒绝，也不证明此前没有副作用</text></g></svg>
