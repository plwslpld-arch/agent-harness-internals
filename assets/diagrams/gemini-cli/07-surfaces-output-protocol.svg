<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 产品表面与输出协议</title><desc id="desc">同一组核心智能体事件分别投影到交互终端、三种非交互输出、IDE 与 A2A；各表面保留、合并和丢失的信息不同。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#087F7C"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C57A0B"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="1050" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">同一核心事件，在不同表面不是同一种事实</text><text x="700" y="90" text-anchor="middle" font-size="18" fill="#50677D">先保存原始事件与标识，再解释显示、序列化、任务状态和退出码</text>
<rect x="190" y="120" width="1020" height="130" rx="22" fill="#17324D" filter="url(#s)"/><text x="700" y="158" text-anchor="middle" font-size="22" font-weight="760" fill="#fff">核心智能体事件流</text><text x="700" y="193" text-anchor="middle" font-size="16" fill="#B9E9E4">开始与结束　消息与思考　工具请求、进度与结果　错误、用量、会话更新与引导</text><text x="700" y="222" text-anchor="middle" font-size="15" fill="#A9BDD1">它是上游语义集合，不等于任一输出格式</text>
<path d="M700 250v48M230 298h940" stroke="#087F7C" stroke-width="3.5" fill="none"/><path d="M230 298v39M470 298v39M700 298v39M930 298v39M1170 298v39" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/>
<rect x="50" y="340" width="350" height="260" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="225" y="378" text-anchor="middle" font-size="21" font-weight="760" fill="#076663">交互终端</text><text x="225" y="410" text-anchor="middle" font-size="15" fill="#17324D">面向人的持续渲染</text><rect x="82" y="435" width="286" height="116" rx="14" fill="#fff"/><text x="225" y="464" text-anchor="middle" font-size="15" font-weight="720">保留</text><text x="225" y="492" text-anchor="middle" font-size="14" fill="#50677D">文本安全分段、思考区</text><text x="225" y="517" text-anchor="middle" font-size="14" fill="#50677D">工具卡片、实时进度与终态</text><text x="225" y="578" text-anchor="middle" font-size="14" font-weight="720" fill="#955A00">部分会话、用量与自定义事件不渲染</text>
<rect x="430" y="340" width="540" height="260" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="700" y="378" text-anchor="middle" font-size="21" font-weight="760" fill="#285383">非交互命令</text><text x="700" y="410" text-anchor="middle" font-size="15" fill="#17324D">同一消费者再次分流成三种协议</text><g text-anchor="middle"><rect x="455" y="435" width="150" height="120" rx="14" fill="#fff"/><text x="530" y="465" font-size="17" font-weight="720">纯文本</text><text x="530" y="493" font-size="14" fill="#50677D">增量正文</text><text x="530" y="518" font-size="14" fill="#50677D">错误走另一通道</text><rect x="625" y="435" width="150" height="120" rx="14" fill="#fff"/><text x="700" y="465" font-size="17" font-weight="720">JSON</text><text x="700" y="493" font-size="14" fill="#50677D">末尾单对象</text><text x="700" y="518" font-size="14" fill="#50677D">回答与统计聚合</text><rect x="795" y="435" width="150" height="120" rx="14" fill="#fff"/><text x="870" y="465" font-size="17" font-weight="720">流式 JSON</text><text x="870" y="493" font-size="14" fill="#50677D">逐行事件</text><text x="870" y="518" font-size="14" fill="#50677D">仍非无损转储</text></g><text x="700" y="580" text-anchor="middle" font-size="14" font-weight="720" fill="#955A00">工具进度、用量、会话更新与引导事件被明确忽略</text>
<rect x="1000" y="340" width="350" height="260" rx="22" fill="#F0EAF8" stroke="#70509A" stroke-width="2.5" filter="url(#s)"/><text x="1175" y="378" text-anchor="middle" font-size="21" font-weight="760" fill="#573D79">IDE 集成</text><text x="1175" y="410" text-anchor="middle" font-size="15" fill="#17324D">独立上下文与差异审阅协议</text><rect x="1032" y="435" width="286" height="116" rx="14" fill="#fff"/><text x="1175" y="464" text-anchor="middle" font-size="15" font-weight="720">传输</text><text x="1175" y="492" text-anchor="middle" font-size="14" fill="#50677D">活动文件、选区、工作区信任</text><text x="1175" y="517" text-anchor="middle" font-size="14" fill="#50677D">差异接受、拒绝与关闭通知</text><text x="1175" y="578" text-anchor="middle" font-size="14" font-weight="720" fill="#955A00">连接状态不等于会话或任务终态</text>
<path d="M700 600v46" stroke="#C57A0B" stroke-width="3.5" marker-end="url(#o)"/><rect x="90" y="650" width="1220" height="225" rx="24" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="125" y="692" font-size="22" font-weight="760" fill="#955A00">A2A 远程任务表面</text><text x="125" y="724" font-size="15" fill="#17324D">模型与工具活动被重命名并映射成远程协议对象</text><g text-anchor="middle"><rect x="130" y="755" width="220" height="78" rx="14" fill="#fff"/><text x="240" y="784" font-size="16" font-weight="720">任务与上下文标识</text><text x="240" y="812" font-size="14" fill="#50677D">关联多条消息</text><rect x="380" y="755" width="220" height="78" rx="14" fill="#fff"/><text x="490" y="784" font-size="16" font-weight="720">消息</text><text x="490" y="812" font-size="14" fill="#50677D">文本、思考与确认</text><rect x="630" y="755" width="220" height="78" rx="14" fill="#fff"/><text x="740" y="784" font-size="16" font-weight="720">状态更新</text><text x="740" y="812" font-size="14" fill="#50677D">工作、等待、终止</text><rect x="880" y="755" width="220" height="78" rx="14" fill="#fff"/><text x="990" y="784" font-size="16" font-weight="720">工件</text><text x="990" y="812" font-size="14" fill="#50677D">工具输出与文件</text><rect x="1130" y="755" width="140" height="78" rx="14" fill="#fff"/><text x="1200" y="784" font-size="16" font-weight="720">取消</text><text x="1200" y="812" font-size="14" fill="#50677D">独立终态</text></g>
<rect x="165" y="920" width="1070" height="78" rx="18" fill="#FFECE5" stroke="#D95D39" stroke-width="2"/><text x="700" y="950" text-anchor="middle" font-size="18" font-weight="760" fill="#9A3C24">对抗结论</text><text x="700" y="980" text-anchor="middle" font-size="16" fill="#17324D">显示完成 ≠ 结果成功 ≠ 任务终态 ≠ 退出码为零 ≠ 独立评测通过</text><text x="700" y="1028" text-anchor="middle" font-size="16" font-weight="720" fill="#17324D">跨表面核对必须保留会话、任务、上下文、工具调用与运行标识</text></g></svg>
