<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 智能体编排、钩子、技能、MCP 与扩展</title><desc id="desc">扩展内容经过启用、信任、解析和运行时注册形成能力，统一智能体工具再分流到本地隔离执行器或远程流式协议。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#087F7C"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C57A0B"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="1020" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">扩展不是能力开关，子智能体也不是父轮次的别名</text><text x="700" y="90" text-anchor="middle" font-size="18" fill="#50677D">发现、有效启用、运行时注册、模型可见、授权执行与任务完成逐层分开</text>
<rect x="45" y="122" width="1310" height="315" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="76" y="163" font-size="22" font-weight="760" fill="#076663">一　扩展内容经过门禁，动态装配为当次会话能力</text><rect x="75" y="205" width="205" height="155" rx="16" fill="#fff"/><text x="178" y="238" text-anchor="middle" font-size="18" font-weight="720">已安装扩展</text><text x="178" y="269" text-anchor="middle" font-size="15" fill="#50677D">清单与约定目录</text><text x="178" y="297" text-anchor="middle" font-size="15" fill="#50677D">上下文、钩子、技能</text><text x="178" y="325" text-anchor="middle" font-size="15" fill="#50677D">智能体、服务、策略</text><rect x="330" y="195" width="235" height="175" rx="16" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="448" y="229" text-anchor="middle" font-size="18" font-weight="720" fill="#955A00">有效门禁</text><text x="448" y="260" text-anchor="middle" font-size="15" fill="#50677D">管理员开关与来源限制</text><text x="448" y="287" text-anchor="middle" font-size="15" fill="#50677D">当前路径启用规则</text><text x="448" y="314" text-anchor="middle" font-size="15" fill="#50677D">目录信任、同意与格式</text><text x="448" y="341" text-anchor="middle" font-size="15" fill="#50677D">连接、发现与禁用列表</text><path d="M280 282h42" stroke="#C57A0B" stroke-width="3.5" marker-end="url(#o)"/><rect x="620" y="185" width="690" height="205" rx="20" fill="#fff"/><text x="965" y="221" text-anchor="middle" font-size="19" font-weight="720" fill="#076663">运行时能力装配</text><g font-size="15" text-anchor="middle"><rect x="650" y="252" width="115" height="95" rx="13" fill="#E9F2FF"/><text x="708" y="282" font-weight="720">上下文</text><text x="708" y="313" fill="#50677D">提示注入</text><rect x="780" y="252" width="115" height="95" rx="13" fill="#F0EAF8"/><text x="838" y="282" font-weight="720">钩子</text><text x="838" y="313" fill="#50677D">事件计划</text><rect x="910" y="252" width="115" height="95" rx="13" fill="#E7F5F3"/><text x="968" y="282" font-weight="720">技能</text><text x="968" y="313" fill="#50677D">按需激活</text><rect x="1040" y="252" width="115" height="95" rx="13" fill="#FFECE5"/><text x="1098" y="282" font-weight="720">智能体</text><text x="1098" y="313" fill="#50677D">统一入口</text><rect x="1170" y="252" width="115" height="95" rx="13" fill="#FFF2D4"/><text x="1228" y="282" font-weight="720">外部服务</text><text x="1228" y="313" fill="#50677D">工具与资源</text></g><path d="M565 282h47" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><text x="700" y="417" text-anchor="middle" font-size="16" font-weight="720" fill="#076663">停用或重载会重新刷新工具、提示、钩子、技能、智能体和策略；目录存在不代表已经注册</text>
<rect x="45" y="475" width="1310" height="465" rx="25" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="76" y="516" font-size="22" font-weight="760" fill="#285383">二　统一智能体工具分流到两套独立生命周期</text><rect x="85" y="570" width="205" height="105" rx="16" fill="#fff"/><text x="188" y="605" text-anchor="middle" font-size="18" font-weight="720">父模型请求</text><text x="188" y="634" text-anchor="middle" font-size="15" fill="#50677D">目标名 + 完整任务</text><text x="188" y="658" text-anchor="middle" font-size="15" fill="#50677D">父调用标识</text><rect x="350" y="570" width="215" height="105" rx="16" fill="#fff"/><text x="458" y="605" text-anchor="middle" font-size="18" font-weight="720">统一智能体工具</text><text x="458" y="634" text-anchor="middle" font-size="15" fill="#50677D">活动定义查找</text><text x="458" y="658" text-anchor="middle" font-size="15" fill="#50677D">输入映射与授权</text><path d="M290 622h52" stroke="#3569A8" stroke-width="3.5" marker-end="url(#a)"/><rect x="625" y="545" width="310" height="300" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="780" y="582" text-anchor="middle" font-size="20" font-weight="760" fill="#076663">本地子智能体</text><text x="780" y="618" text-anchor="middle" font-size="15" fill="#17324D">派生消息总线 + 隔离注册表</text><rect x="660" y="647" width="240" height="62" rx="13" fill="#fff"/><text x="780" y="674" text-anchor="middle" font-size="15" font-weight="720">克隆允许工具，禁止递归调用智能体</text><text x="780" y="697" text-anchor="middle" font-size="14" fill="#50677D">可装入自身外部服务</text><rect x="660" y="730" width="240" height="82" rx="13" fill="#fff"/><text x="780" y="758" text-anchor="middle" font-size="15" font-weight="720">独立模型轮次与调度器</text><text x="780" y="783" text-anchor="middle" font-size="14" fill="#50677D">完成工具、轮数、超时、取消</text><path d="M565 607c30 0 30 60 52 60" stroke="#087F7C" stroke-width="3.5" fill="none" marker-end="url(#a)"/><rect x="980" y="545" width="330" height="300" rx="20" fill="#F0EAF8" stroke="#70509A" stroke-width="2"/><text x="1145" y="582" text-anchor="middle" font-size="20" font-weight="760" fill="#573D79">远程流式智能体</text><text x="1145" y="618" text-anchor="middle" font-size="15" fill="#17324D">智能体卡片 + 认证 + 远程会话</text><rect x="1015" y="647" width="260" height="62" rx="13" fill="#fff"/><text x="1145" y="674" text-anchor="middle" font-size="15" font-weight="720">上下文标识与任务标识</text><text x="1145" y="697" text-anchor="middle" font-size="14" fill="#50677D">同一会话实例内延续</text><rect x="1015" y="730" width="260" height="82" rx="13" fill="#fff"/><text x="1145" y="758" text-anchor="middle" font-size="15" font-weight="720">开始、增量消息、唯一结束</text><text x="1145" y="783" text-anchor="middle" font-size="14" fill="#50677D">完成、错误、取消分别结算</text><path d="M565 637c190 0 260-7 407 30" stroke="#70509A" stroke-width="3.5" fill="none" marker-end="url(#a)"/><rect x="350" y="755" width="215" height="90" rx="16" fill="#17324D"/><text x="458" y="788" text-anchor="middle" font-size="17" font-weight="720" fill="#fff">回到父工具结算</text><text x="458" y="817" text-anchor="middle" font-size="14" fill="#8EE1D8">结果与活动保持来源</text><path d="M625 820h-52" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><path d="M980 820H573" stroke="#70509A" stroke-width="3.5" marker-end="url(#a)"/><text x="700" y="895" text-anchor="middle" font-size="16" font-weight="720" fill="#285383">父轮次完成不等于全部子任务成功　｜　子智能体活动不增加评测试次数　｜　完成事件仍需核对目标工件</text><text x="700" y="977" text-anchor="middle" font-size="17" font-weight="720" fill="#17324D">发现 ≠ 启用　｜　注册 ≠ 可见　｜　可见 ≠ 授权　｜　授权 ≠ 正确执行　｜　结束 ≠ 任务通过</text></g></svg>
