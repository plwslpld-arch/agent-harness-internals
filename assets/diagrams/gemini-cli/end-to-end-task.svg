<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Gemini CLI 端到端工具任务流程</title><desc id="desc">用户输入经过两次模型流、一次工具调度和结果回送，最终产生唯一智能体会话结束事件。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="860" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">一次真实工具闭环：中间停止原因不能提前结束任务</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">上游测试夹具：模型与工具调度器为模拟对象，真实的是智能体会话控制逻辑</text>
  <rect x="65" y="126" width="1270" height="102" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="94" y="164" font-size="22" font-weight="760" fill="#285383">输入</text><text x="180" y="164" font-size="21" fill="#17324D">读取一个文件（原夹具为英文）</text><text x="94" y="199" font-size="17" fill="#50677D">固定夹具只证明事件与结果回送；没有读取真实文件，也没有连接线上模型</text>
  <g font-size="18" text-anchor="middle"><rect x="70" y="290" width="180" height="84" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="160" y="323" fill="#17324D" font-weight="720">一　智能体会话</text><text x="160" y="350" fill="#50677D">建立活动流</text><rect x="290" y="290" width="190" height="84" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="385" y="323" fill="#17324D" font-weight="720">二　首次模型流</text><text x="385" y="350" fill="#50677D">请求 read_file</text><rect x="520" y="290" width="190" height="84" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="615" y="323" fill="#17324D" font-weight="720">三　中间停止</text><text x="615" y="350" fill="#955A00">仍有待处理工具</text><rect x="750" y="290" width="190" height="84" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2"/><text x="845" y="323" fill="#17324D" font-weight="720">四　工具调度器</text><text x="845" y="350" fill="#614482">结算 call-1</text><rect x="980" y="290" width="190" height="84" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="1075" y="323" fill="#17324D" font-weight="720">五　二次模型流</text><text x="1075" y="350" fill="#50677D">输入文件内容</text><rect x="1210" y="290" width="130" height="84" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="1275" y="323" fill="#17324D" font-weight="720">六　结束</text><text x="1275" y="350" fill="#9A3E24">唯一 agent_end</text></g>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M250 332h32"/><path d="M480 332h32"/><path d="M710 332h32"/><path d="M940 332h32"/><path d="M1170 332h32"/></g>
  <rect x="165" y="446" width="1070" height="118" rx="22" fill="#17324D" filter="url(#s)"/><text x="205" y="484" font-size="21" font-weight="760" fill="#fff">关键数据</text><text x="205" y="518" font-size="18" fill="#DCE8F2">调用标识 call-1　工具 read_file　调度结果为文件内容　最终模型文本为完成</text><text x="205" y="548" font-size="18" fill="#8EE1D8">工具响应既对外形成 tool_response，也作为 responseParts 进入第二次模型请求</text>
  <rect x="165" y="614" width="510" height="118" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="195" y="654" font-size="21" font-weight="760" fill="#955A00">不能提前结束</text><text x="195" y="687" font-size="18" fill="#17324D">第一次停止结束模型生成，不结束智能体会话</text><text x="195" y="716" font-size="17" fill="#50677D">测试断言：有工具待处理时不发出 agent_end</text>
  <rect x="725" y="614" width="510" height="118" rx="22" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="755" y="654" font-size="21" font-weight="760" fill="#9A3E24">不能冒充评测通过</text><text x="755" y="687" font-size="18" fill="#17324D">最终完成状态只说明控制流收敛</text><text x="755" y="716" font-size="17" fill="#50677D">独立评分器仍须检查目标产物、错误和副作用</text>
  <rect x="65" y="780" width="1270" height="44" rx="13" fill="#17324D"/><text x="700" y="808" text-anchor="middle" font-size="18" fill="#fff">统计边界：两次模型响应 + 一次工具批次 = 一次智能体会话；是否等于一个评测试次由任务契约决定</text></g></svg>
