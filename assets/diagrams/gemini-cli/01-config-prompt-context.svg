<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 配置与上下文装配</title><desc id="desc">从分层设置和信任过滤形成有效运行配置，再将分层项目指令、当前工具和会话输入装配成模型可见请求。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="880" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="56" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">配置不是文件名，上下文也不是无限拼接</text><text x="700" y="91" text-anchor="middle" font-size="18" fill="#50677D">先解析优先级与信任，再区分系统指令、首轮上下文和动态工具结构</text>
<rect x="55" y="130" width="1290" height="185" rx="25" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="84" y="168" font-size="23" font-weight="760" fill="#955A00">一　分层设置：字段合并策略与信任共同决定有效值</text><g font-size="17" text-anchor="middle"><rect x="86" y="205" width="190" height="70" rx="14" fill="#fff"/><text x="181" y="235" fill="#17324D" font-weight="720">结构默认值</text><text x="181" y="260" fill="#50677D">内建基线</text><rect x="296" y="205" width="190" height="70" rx="14" fill="#fff"/><text x="391" y="235" fill="#17324D" font-weight="720">系统默认</text><text x="391" y="260" fill="#50677D">管理员基线</text><rect x="506" y="205" width="190" height="70" rx="14" fill="#fff"/><text x="601" y="235" fill="#17324D" font-weight="720">用户设置</text><text x="601" y="260" fill="#50677D">个人偏好</text><rect x="716" y="205" width="190" height="70" rx="14" fill="#fff"/><text x="811" y="235" fill="#17324D" font-weight="720">工作区设置</text><text x="811" y="260" fill="#50677D">仅受信时生效</text><rect x="926" y="205" width="190" height="70" rx="14" fill="#fff"/><text x="1021" y="235" fill="#17324D" font-weight="720">系统覆盖</text><text x="1021" y="260" fill="#50677D">单值最高优先</text><rect x="1136" y="205" width="170" height="70" rx="14" fill="#E7F5F3" stroke="#087F7C"/><text x="1221" y="235" fill="#17324D" font-weight="720">有效设置</text><text x="1221" y="260" fill="#50677D">按字段合并</text></g><g stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M276 240h12"/><path d="M486 240h12"/><path d="M696 240h12"/><path d="M906 240h12"/><path d="M1116 240h12"/></g>
<rect x="55" y="355" width="620" height="350" rx="25" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="394" font-size="23" font-weight="760" fill="#285383">二　分层项目指令：不同来源进入不同位置</text><g font-size="18"><rect x="90" y="430" width="550" height="72" rx="15" fill="#fff"/><text x="115" y="459" fill="#17324D" font-weight="720">一级：全局与用户项目记忆</text><text x="115" y="485" fill="#50677D">进入系统指令，可在会话中刷新</text><rect x="90" y="522" width="550" height="72" rx="15" fill="#fff"/><text x="115" y="551" fill="#17324D" font-weight="720">二级：扩展与当前项目上下文</text><text x="115" y="577" fill="#50677D">带边界标记进入首条用户消息</text><rect x="90" y="614" width="550" height="62" rx="15" fill="#fff"/><text x="115" y="643" fill="#17324D" font-weight="720">约束：发现、导入、信任、窗口与压缩</text><text x="115" y="667" fill="#50677D">文件存在不等于内容已加载</text></g>
<rect x="725" y="355" width="620" height="350" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="754" y="394" font-size="23" font-weight="760" fill="#076663">三　请求装配：当前能力决定模型真正看见什么</text><g font-size="18" text-anchor="middle"><rect x="765" y="430" width="250" height="72" rx="15" fill="#fff"/><text x="890" y="459" fill="#17324D" font-weight="720">核心提示</text><text x="890" y="485" fill="#50677D">模式与行为约束</text><rect x="1055" y="430" width="250" height="72" rx="15" fill="#fff"/><text x="1180" y="459" fill="#17324D" font-weight="720">当前工具结构</text><text x="1180" y="485" fill="#50677D">注册、过滤与模式</text><rect x="765" y="542" width="250" height="72" rx="15" fill="#fff"/><text x="890" y="571" fill="#17324D" font-weight="720">分层上下文</text><text x="890" y="597" fill="#50677D">系统指令与首轮片段</text><rect x="1055" y="542" width="250" height="72" rx="15" fill="#fff"/><text x="1180" y="571" fill="#17324D" font-weight="720">用户输入与历史</text><text x="1180" y="597" fill="#50677D">有界模型视图</text></g><path d="M890 502v32M1180 502v32M1015 578h32" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><rect x="765" y="640" width="540" height="40" rx="12" fill="#17324D"/><text x="1035" y="666" text-anchor="middle" font-size="17" fill="#fff">模型可见不等于获准执行</text>
<rect x="120" y="754" width="1160" height="70" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="700" y="784" text-anchor="middle" font-size="20" font-weight="760" fill="#9A3E24">核对边界</text><text x="700" y="812" text-anchor="middle" font-size="17" fill="#17324D">原始文件 → 已加载设置 → 有效配置 → 模型请求 → 真实执行，五层必须分别留证</text></g></svg>
