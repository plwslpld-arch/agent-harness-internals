<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 工具生命周期</title><desc id="desc">工具从已知定义经过活动过滤、模型请求、查找构建、策略确认、执行和结果归约，最终以关联调用标识回送模型。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="56" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">工具登记、模型可见与真实执行是三个不同动作</text><text x="700" y="91" text-anchor="middle" font-size="18" fill="#50677D">每一层都可能拒绝或改变调用，最终结果仍只属于一个调用标识</text>
<rect x="55" y="130" width="1290" height="175" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="84" y="169" font-size="23" font-weight="760" fill="#285383">一　能力目录：已知工具不等于当前活动工具</text><g font-size="17" text-anchor="middle"><rect x="95" y="210" width="220" height="64" rx="14" fill="#fff"/><text x="205" y="236" font-weight="720">内建工具</text><text x="205" y="260" fill="#50677D">随核心注册</text><rect x="355" y="210" width="220" height="64" rx="14" fill="#fff"/><text x="465" y="236" font-weight="720">发现命令工具</text><text x="465" y="260" fill="#50677D">外部结构声明</text><rect x="615" y="210" width="220" height="64" rx="14" fill="#fff"/><text x="725" y="236" font-weight="720">MCP 工具</text><text x="725" y="260" fill="#50677D">按服务动态加入</text><rect x="875" y="210" width="190" height="64" rx="14" fill="#FFF2D4"/><text x="970" y="236" font-weight="720">排除与别名</text><text x="970" y="260" fill="#50677D">保留定义，过滤活动</text><rect x="1105" y="210" width="200" height="64" rx="14" fill="#E7F5F3"/><text x="1205" y="236" font-weight="720">当前工具声明</text><text x="1205" y="260" fill="#50677D">模型可见结构</text></g><g stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M315 242h32"/><path d="M575 242h32"/><path d="M835 242h32"/><path d="M1065 242h32"/></g>
<rect x="55" y="350" width="1290" height="330" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="84" y="390" font-size="23" font-weight="760" fill="#076663">二　调用链：请求必须逐层取得真实执行资格</text><g font-size="16" text-anchor="middle"><rect x="80" y="440" width="165" height="68" rx="14" fill="#fff"/><text x="163" y="468" font-weight="720">模型请求</text><text x="163" y="492" fill="#50677D">名称与参数</text><rect x="275" y="440" width="165" height="68" rx="14" fill="#fff"/><text x="358" y="468" font-weight="720">活动查找</text><text x="358" y="492" fill="#50677D">不存在即错误</text><rect x="470" y="440" width="165" height="68" rx="14" fill="#fff"/><text x="553" y="468" font-weight="720">构建调用</text><text x="553" y="492" fill="#50677D">参数无效即错误</text><rect x="665" y="440" width="165" height="68" rx="14" fill="#FFF2D4"/><text x="748" y="468" font-weight="720">策略与确认</text><text x="748" y="492" fill="#50677D">允许、拒绝、等待</text><rect x="860" y="440" width="165" height="68" rx="14" fill="#F0EAF8"/><text x="943" y="468" font-weight="720">执行与钩子</text><text x="943" y="492" fill="#50677D">输出与副作用</text><rect x="1055" y="440" width="265" height="68" rx="14" fill="#fff"/><text x="1188" y="468" font-weight="720">结果归约</text><text x="1188" y="492" fill="#50677D">成功、错误或取消</text></g><g stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M245 474h22"/><path d="M440 474h22"/><path d="M635 474h22"/><path d="M830 474h22"/><path d="M1025 474h22"/></g><rect x="175" y="565" width="1050" height="72" rx="17" fill="#17324D"/><text x="700" y="594" text-anchor="middle" font-size="19" font-weight="720" fill="#fff">带相同调用标识的函数响应进入下一次模型请求</text><text x="700" y="622" text-anchor="middle" font-size="17" fill="#8EE1D8">完整输出可能被截断、蒸馏或保存为旁路文件；界面展示和模型内容也可不同</text>
<rect x="90" y="730" width="365" height="105" rx="19" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="273" y="768" text-anchor="middle" font-size="20" font-weight="760" fill="#955A00">登记不是启用</text><text x="273" y="799" text-anchor="middle" font-size="17" fill="#17324D">被排除工具仍可留在已知目录</text><text x="273" y="824" text-anchor="middle" font-size="16" fill="#50677D">活动视图才进入模型声明</text><rect x="518" y="730" width="365" height="105" rx="19" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="700" y="768" text-anchor="middle" font-size="20" font-weight="760" fill="#9A3E24">取消不是回滚</text><text x="700" y="799" text-anchor="middle" font-size="17" fill="#17324D">工具可能已产生部分输出或副作用</text><text x="700" y="824" text-anchor="middle" font-size="16" fill="#50677D">必须检查目标环境</text><rect x="945" y="730" width="365" height="105" rx="19" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="1128" y="768" text-anchor="middle" font-size="20" font-weight="760" fill="#076663">成功不是评测通过</text><text x="1128" y="799" text-anchor="middle" font-size="17" fill="#17324D">只说明工具契约未返回错误</text><text x="1128" y="824" text-anchor="middle" font-size="16" fill="#50677D">用户目标仍需独立评分</text></g></svg>
