<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 会话记录、历史、压缩与长期记忆</title><desc id="desc">会话追加记录、运行时历史、模型可见投影、压缩替代、检查点和长期记忆拥有不同权威范围。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#087F7C"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C57A0B"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C96138"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="980" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="56" text-anchor="middle" font-size="35" font-weight="760" fill="#17324D">会话记录、运行历史、模型上下文与长期记忆不是同一份数据</text><text x="700" y="92" text-anchor="middle" font-size="18" fill="#50677D">先确定谁拥有哪部分真相，再谈恢复、压缩和评测</text>
<rect x="55" y="125" width="1290" height="250" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="84" y="166" font-size="22" font-weight="760" fill="#076663">一　消息进入两条相关但不同的状态路径</text><rect x="90" y="215" width="190" height="90" rx="15" fill="#fff"/><text x="185" y="248" text-anchor="middle" font-size="18" font-weight="720">消息与工具结算</text><text x="185" y="277" text-anchor="middle" font-size="15" fill="#50677D">带稳定标识</text><rect x="355" y="198" width="240" height="120" rx="16" fill="#fff"/><text x="475" y="234" text-anchor="middle" font-size="19" font-weight="720">运行时回合历史</text><text x="475" y="263" text-anchor="middle" font-size="15" fill="#50677D">强所有者：追加、覆盖、回滚</text><text x="475" y="291" text-anchor="middle" font-size="15" fill="#50677D">保留稳定标识</text><rect x="700" y="198" width="245" height="120" rx="16" fill="#fff"/><text x="823" y="234" text-anchor="middle" font-size="19" font-weight="720">追加会话记录</text><text x="823" y="263" text-anchor="middle" font-size="15" fill="#50677D">逐行写入与逻辑回放</text><text x="823" y="291" text-anchor="middle" font-size="15" fill="#50677D">回退和消息集合控制</text><rect x="1045" y="198" width="250" height="120" rx="16" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="1170" y="234" text-anchor="middle" font-size="19" font-weight="720" fill="#285383">模型可见投影</text><text x="1170" y="263" text-anchor="middle" font-size="15" fill="#50677D">移除标识与控制记录</text><text x="1170" y="291" text-anchor="middle" font-size="15" fill="#50677D">只含当前有界内容</text><path d="M280 260h66" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><path d="M595 235h96" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><path d="M475 318v12h540v-30h22" stroke="#087F7C" stroke-width="3.5" fill="none" marker-end="url(#a)"/><path d="M945 258h92" stroke="#3569A8" stroke-width="3.2" marker-end="url(#a)"/><text x="649" y="222" text-anchor="middle" font-size="14" fill="#076663">同步记录</text><text x="821" y="358" text-anchor="middle" font-size="15" fill="#50677D">恢复优先级：显式内存历史优先；否则只投影用户与模型消息</text>
<rect x="55" y="415" width="1290" height="275" rx="25" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="84" y="456" font-size="22" font-weight="760" fill="#955A00">二　压缩是有损重建，不是把原记录变短</text><rect x="90" y="505" width="190" height="105" rx="15" fill="#fff"/><text x="185" y="539" text-anchor="middle" font-size="18" font-weight="720">当前历史</text><text x="185" y="568" text-anchor="middle" font-size="15" fill="#50677D">达到阈值或强制</text><text x="185" y="594" text-anchor="middle" font-size="15" fill="#50677D">整理消息</text><rect x="335" y="505" width="215" height="105" rx="15" fill="#fff"/><text x="443" y="539" text-anchor="middle" font-size="18" font-weight="720">预算截断</text><text x="443" y="568" text-anchor="middle" font-size="15" fill="#50677D">大工具输出可旁路</text><text x="443" y="594" text-anchor="middle" font-size="15" fill="#50677D">分出保留尾部</text><rect x="605" y="505" width="190" height="105" rx="15" fill="#fff"/><text x="700" y="539" text-anchor="middle" font-size="18" font-weight="720">生成摘要</text><text x="700" y="568" text-anchor="middle" font-size="15" fill="#50677D">较旧历史</text><text x="700" y="594" text-anchor="middle" font-size="15" fill="#50677D">第一次模型调用</text><rect x="850" y="505" width="190" height="105" rx="15" fill="#fff"/><text x="945" y="539" text-anchor="middle" font-size="18" font-weight="720">探针复核</text><text x="945" y="568" text-anchor="middle" font-size="15" fill="#50677D">第二次模型调用</text><text x="945" y="594" text-anchor="middle" font-size="15" fill="#C96138">为空则回退首版</text><rect x="1095" y="488" width="205" height="140" rx="16" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="1198" y="526" text-anchor="middle" font-size="18" font-weight="720" fill="#9A3E24">替代活动历史</text><text x="1198" y="556" text-anchor="middle" font-size="15" fill="#50677D">最终摘要</text><text x="1198" y="582" text-anchor="middle" font-size="15" fill="#50677D">固定确认消息</text><text x="1198" y="608" text-anchor="middle" font-size="15" fill="#50677D">截断后的保留尾部</text><path d="M280 558h47" stroke="#C57A0B" stroke-width="3.5" marker-end="url(#o)"/><path d="M550 558h47" stroke="#C57A0B" stroke-width="3.5" marker-end="url(#o)"/><path d="M795 558h47" stroke="#C57A0B" stroke-width="3.5" marker-end="url(#o)"/><path d="M1040 558h47" stroke="#C96138" stroke-width="3.5" marker-end="url(#r)"/><text x="700" y="660" text-anchor="middle" font-size="16" font-weight="720" fill="#955A00">压缩成功只说明新上下文已结算，不证明事实完整、工具输出完整或没有幻觉</text>
<rect x="55" y="730" width="390" height="175" rx="23" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="250" y="770" text-anchor="middle" font-size="20" font-weight="760" fill="#285383">检查点</text><text x="250" y="807" text-anchor="middle" font-size="16" fill="#17324D">历史 + 可选认证类型</text><text x="250" y="837" text-anchor="middle" font-size="15" fill="#50677D">标签式文件恢复</text><text x="250" y="872" text-anchor="middle" font-size="15" fill="#9A3E24">不含文件、进程与远端副作用</text><rect x="505" y="730" width="390" height="175" rx="23" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="700" y="770" text-anchor="middle" font-size="20" font-weight="760" fill="#076663">分层长期记忆</text><text x="700" y="807" text-anchor="middle" font-size="16" fill="#17324D">项目指令、私有项目、全局个人</text><text x="700" y="837" text-anchor="middle" font-size="15" fill="#50677D">直接用文件工具维护，一次事实只选一层</text><text x="700" y="872" text-anchor="middle" font-size="15" fill="#9A3E24">不保存瞬态进度与当前任务发现</text><rect x="955" y="730" width="390" height="175" rx="23" fill="#F0EAF8" stroke="#70509A" stroke-width="2.5" filter="url(#s)"/><text x="1150" y="770" text-anchor="middle" font-size="20" font-weight="760" fill="#573D79">实验性自动记忆</text><text x="1150" y="807" text-anchor="middle" font-size="16" fill="#17324D">加锁、节流、扫描过去会话</text><text x="1150" y="837" text-anchor="middle" font-size="15" fill="#50677D">生成候选技能或收件箱补丁</text><text x="1150" y="872" text-anchor="middle" font-size="15" fill="#9A3E24">候选不等于已审阅、已启用的记忆</text><text x="700" y="951" text-anchor="middle" font-size="17" font-weight="720" fill="#17324D">记录不等于上下文　｜　复核不等于无损　｜　检查点不等于环境快照　｜　记忆不等于会话真相</text></g></svg>
