<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc"><title id="title">Gemini CLI 遥测、错误与独立评测</title><desc id="desc">执行链产生回答和工件，错误与遥测链提供可观测证据；固定任务经独立评分器判定，训练奖励适配器与隔离发布评测保持分离。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#087F7C"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#C57A0B"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs><rect width="1400" height="1080" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">观察帮助解释，独立评分才负责裁决</text><text x="700" y="90" text-anchor="middle" font-size="18" fill="#50677D">工具决定、成功状态、停止原因和遥测事件都不是任务分数</text>
<rect x="55" y="125" width="1290" height="235" rx="24" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="90" y="165" font-size="22" font-weight="760" fill="#076663">一　产品执行链拥有真实结果</text><g text-anchor="middle"><rect x="95" y="205" width="205" height="105" rx="15" fill="#fff"/><text x="198" y="240" font-size="17" font-weight="720">固定任务输入</text><text x="198" y="270" font-size="14" fill="#50677D">目标、环境与约束</text><rect x="355" y="205" width="205" height="105" rx="15" fill="#fff"/><text x="458" y="240" font-size="17" font-weight="720">智能体会话</text><text x="458" y="270" font-size="14" fill="#50677D">模型与工具循环</text><rect x="615" y="205" width="205" height="105" rx="15" fill="#fff"/><text x="718" y="240" font-size="17" font-weight="720">分层执行边界</text><text x="718" y="270" font-size="14" fill="#50677D">钩子、策略、确认、沙箱</text><rect x="875" y="205" width="205" height="105" rx="15" fill="#fff"/><text x="978" y="240" font-size="17" font-weight="720">产品输出</text><text x="978" y="270" font-size="14" fill="#50677D">消息、错误与退出状态</text><rect x="1135" y="205" width="170" height="105" rx="15" fill="#fff"/><text x="1220" y="240" font-size="17" font-weight="720">外部工件</text><text x="1220" y="270" font-size="14" fill="#50677D">文件与副作用</text></g><path d="M300 257h47M560 257h47M820 257h47M1080 257h47" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"/><text x="700" y="337" text-anchor="middle" font-size="15" font-weight="720" fill="#076663">回答和工件是待评分事实；后续记录只能引用，不能反向改写</text>
<path d="M458 360v58M978 360v58M1220 360v58" stroke="#3569A8" stroke-width="3.5" marker-end="url(#a)"/><rect x="55" y="420" width="610" height="260" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="90" y="460" font-size="22" font-weight="760" fill="#285383">二　错误与遥测证据链</text><text x="90" y="492" font-size="15" fill="#17324D">解释发生了什么，但可能关闭、聚合、脱敏或丢失</text><g text-anchor="middle"><rect x="90" y="525" width="165" height="105" rx="14" fill="#fff"/><text x="173" y="557" font-size="16" font-weight="720">请求与响应</text><text x="173" y="584" font-size="14" fill="#50677D">停止原因、用量</text><text x="173" y="607" font-size="14" fill="#50677D">状态码、延迟</text><rect x="275" y="525" width="165" height="105" rx="14" fill="#fff"/><text x="358" y="557" font-size="16" font-weight="720">工具与钩子</text><text x="358" y="584" font-size="14" fill="#50677D">决定、成功、耗时</text><text x="358" y="607" font-size="14" fill="#50677D">压缩、重试、回退</text><rect x="460" y="525" width="165" height="105" rx="14" fill="#fff"/><text x="543" y="557" font-size="16" font-weight="720">可选导出</text><text x="543" y="584" font-size="14" fill="#50677D">本地、云端、采集器</text><text x="543" y="607" font-size="14" fill="#50677D">日志、指标、链路</text></g><text x="360" y="658" text-anchor="middle" font-size="14" font-weight="720" fill="#955A00">没有错误事件，不等于没有错误</text>
<rect x="735" y="420" width="610" height="260" rx="24" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="770" y="460" font-size="22" font-weight="760" fill="#955A00">三　独立评测链</text><text x="770" y="492" font-size="15" fill="#17324D">固定分母、保存工件、预先登记评分规则</text><g text-anchor="middle"><rect x="770" y="525" width="125" height="105" rx="14" fill="#fff"/><text x="833" y="557" font-size="16" font-weight="720">数据集</text><text x="833" y="589" font-size="14" fill="#50677D">固定任务</text><rect x="915" y="525" width="125" height="105" rx="14" fill="#fff"/><text x="978" y="557" font-size="16" font-weight="720">试次</text><text x="978" y="589" font-size="14" fill="#50677D">稳定分母</text><rect x="1060" y="525" width="125" height="105" rx="14" fill="#fff"/><text x="1123" y="557" font-size="16" font-weight="720">工件</text><text x="1123" y="589" font-size="14" fill="#50677D">回答与副作用</text><rect x="1205" y="525" width="105" height="105" rx="14" fill="#fff"/><text x="1258" y="557" font-size="16" font-weight="720">评分器</text><text x="1258" y="589" font-size="14" fill="#50677D">独立裁决</text></g><path d="M895 578h12M1040 578h12M1185 578h12" stroke="#C57A0B" stroke-width="3" marker-end="url(#o)"/><text x="1040" y="658" text-anchor="middle" font-size="14" font-weight="720" fill="#955A00">协议完整门禁与任务正确评分分别输出</text>
<path d="M360 680v78M1040 680v78" stroke="#70509A" stroke-width="3.5" marker-end="url(#a)"/><rect x="85" y="760" width="560" height="220" rx="24" fill="#F0EAF8" stroke="#70509A" stroke-width="2.5" filter="url(#s)"/><text x="365" y="801" text-anchor="middle" font-size="22" font-weight="760" fill="#573D79">训练适配路径</text><rect x="125" y="835" width="200" height="95" rx="14" fill="#fff"/><text x="225" y="866" text-anchor="middle" font-size="16" font-weight="720">奖励适配器</text><text x="225" y="894" text-anchor="middle" font-size="14" fill="#50677D">归因、聚合、标定、版本</text><rect x="405" y="835" width="200" height="95" rx="14" fill="#fff"/><text x="505" y="866" text-anchor="middle" font-size="16" font-weight="720">训练与选择</text><text x="505" y="894" text-anchor="middle" font-size="14" fill="#50677D">偏好、组奖励、强化微调</text><path d="M325 882h72" stroke="#70509A" stroke-width="3.5" marker-end="url(#a)"/>
<rect x="755" y="760" width="560" height="220" rx="24" fill="#FFECE5" stroke="#D95D39" stroke-width="2.5" filter="url(#s)"/><text x="1035" y="801" text-anchor="middle" font-size="22" font-weight="760" fill="#9A3C24">独立发布路径</text><rect x="795" y="835" width="200" height="95" rx="14" fill="#fff"/><text x="895" y="866" text-anchor="middle" font-size="16" font-weight="720">隔离留出集</text><text x="895" y="894" text-anchor="middle" font-size="14" fill="#50677D">不参与训练与调参</text><rect x="1075" y="835" width="200" height="95" rx="14" fill="#fff"/><text x="1175" y="866" text-anchor="middle" font-size="16" font-weight="720">发布门禁</text><text x="1175" y="894" text-anchor="middle" font-size="14" fill="#50677D">质量、安全、成本、稳定性</text><path d="M995 882h72" stroke="#D95D39" stroke-width="3.5" marker-end="url(#a)"/>
<text x="700" y="1025" text-anchor="middle" font-size="18" font-weight="760" fill="#17324D">工具接受 ≠ 工具正确　｜　自然停止 ≠ 任务完成　｜　训练奖励 ≠ 发布评测</text><text x="700" y="1057" text-anchor="middle" font-size="15" fill="#50677D">缺失观测降低可诊断性；缺失评分必需工件才使试次无法裁决，绝不默认为通过</text></g></svg>
