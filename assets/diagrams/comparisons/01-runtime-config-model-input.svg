<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">六类 Harness 的运行边界、配置与模型输入</title>
  <desc id="desc">六条主线从不同产品入口和组合方式进入项目上下文、有效配置、模型输入与真实请求条件的中文对照图。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53627a"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17233b}.t{font-size:34px;font-weight:700}.s{font-size:17px;fill:#5c6b82}.h{font-size:20px;font-weight:700}.b{font-size:16px}.l{stroke:#53627a;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="920" rx="28" fill="#f7f9fc"/>
  <text x="70" y="68" class="t">六类 Harness：从入口与配置走到真实模型请求</text><text x="70" y="100" class="s">同名资产不等于同一实现；目录命中也不等于运行可用</text>
  <rect x="60" y="140" width="1320" height="112" rx="22" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="90" y="180" class="h">共同控制问题</text><text x="90" y="216" class="b">产品表面是谁 · 项目目录在哪里解释 · 配置如何合并 · 哪些资产进入模型输入 · 模型服务与真实请求还缺什么条件</text>
  <g>
    <rect x="60" y="292" width="206" height="300" rx="18" fill="#f0eaff" stroke="#8b5cf6" stroke-width="2"/><text x="82" y="330" class="h">DSH</text><text x="82" y="369" class="b">启动配置档案</text><text x="82" y="398" class="b">预设组合</text><text x="82" y="427" class="b">插件贡献资产</text><rect x="82" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="97" y="500" class="s">核最终实例</text><text x="97" y="526" class="s">不只看包名</text>
    <rect x="283" y="292" width="206" height="300" rx="18" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="305" y="330" class="h">Codex</text><text x="305" y="369" class="b">分层配置</text><text x="305" y="398" class="b">线程上下文</text><text x="305" y="427" class="b">请求片段</text><rect x="305" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="320" y="500" class="s">本地核心</text><text x="320" y="526" class="s">不代替云策略</text>
    <rect x="506" y="292" width="206" height="300" rx="18" fill="#edf9f2" stroke="#22a06b" stroke-width="2"/><text x="528" y="330" class="h">Gemini CLI</text><text x="528" y="369" class="b">有效设置</text><text x="528" y="398" class="b">项目说明</text><text x="528" y="427" class="b">策略与工具</text><rect x="528" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="543" y="500" class="s">目录、认证</text><text x="543" y="526" class="s">与请求分层</text>
    <rect x="729" y="292" width="206" height="300" rx="18" fill="#fff0f0" stroke="#e25555" stroke-width="2"/><text x="751" y="330" class="h">Claude</text><text x="751" y="369" class="b">产品公开契约</text><text x="751" y="398" class="b">Python 开发包</text><text x="751" y="427" class="b">TypeScript 材料</text><rect x="751" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="766" y="500" class="s">证据面分开</text><text x="766" y="526" class="s">不反推闭源</text>
    <rect x="952" y="292" width="206" height="300" rx="18" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="974" y="330" class="h">pi</text><text x="974" y="369" class="b">模型接入层</text><text x="974" y="398" class="b">智能体核心</text><text x="974" y="427" class="b">编码产品层</text><rect x="974" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="989" y="500" class="s">现行源码</text><text x="989" y="526" class="s">不等于设计稿</text>
    <rect x="1175" y="292" width="206" height="300" rx="18" fill="#e8f7f7" stroke="#159b9b" stroke-width="2"/><text x="1197" y="330" class="h">OpenCode</text><text x="1197" y="369" class="b">项目实例</text><text x="1197" y="398" class="b">有效配置</text><text x="1197" y="427" class="b">模型服务</text><rect x="1197" y="470" width="162" height="76" rx="12" fill="#fff"/><text x="1212" y="500" class="s">服务端路径</text><text x="1212" y="526" class="s">与客户端分开</text>
  </g>
  <path d="M164 592V650H1260" class="l"/><path d="M386 592V650" class="l"/><path d="M609 592V650" class="l"/><path d="M832 592V650" class="l"/><path d="M1055 592V650" class="l"/><path d="M1278 592V650" class="l"/>
  <rect x="150" y="672" width="1140" height="90" rx="20" fill="#17233b"/><text x="190" y="710" style="font:700 21px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">统一产物：有效输入与来源血缘</text><text x="190" y="742" style="font:17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#c8d6ef">运行表面 · 项目目录 · 配置摘要 · 指令与工具摘要 · 模型服务与模型 · 时间 · 请求关联标识 · 敏感值受控引用</text>
  <path d="M720 762V817" class="l"/><rect x="365" y="817" width="710" height="58" rx="16" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="405" y="853" class="b">真实请求仍取决于认证、SDK、端点、区域、网络、配额与服务状态；无法固定时标为不可直接比较</text>
</svg>
