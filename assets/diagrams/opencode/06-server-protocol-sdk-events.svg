<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 服务协议与事件时序</title><desc id="desc">协议层声明接口分组和数据形状，服务层注入定位、授权与处理器；客户端以请求响应取得基线并通过事件流续接增量，任务结论仍由独立评测给出。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">响应说明服务处理，评测判断任务结果</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">契约、处理器、事件续接和独立验收各守一层</text><g font-size="21" text-anchor="middle"><text x="170" y="155" font-weight="760" fill="#244F81">客户端开发包</text><text x="510" y="155" font-weight="760" fill="#5B3D7D">协议契约</text><text x="850" y="155" font-weight="760" fill="#955A00">服务处理器</text><text x="1190" y="155" font-weight="760" fill="#076663">会话服务</text><text x="1390" y="155" font-weight="760" fill="#9A3E24">独立评测</text></g><g stroke="#B7C7D8" stroke-width="3" stroke-dasharray="9 8"><path d="M170 175v560"/><path d="M510 175v560"/><path d="M850 175v560"/><path d="M1190 175v560"/><path d="M1390 175v560"/></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M170 235h330"/><path d="M510 300h330"/><path d="M850 365h330"/><path d="M1190 430H860"/><path d="M850 495H180"/><path d="M170 575h1010"/><path d="M1190 640H180"/><path d="M170 705h1210"/></g><g font-size="18" fill="#17324D"><text x="310" y="220" text-anchor="middle">类型化请求</text><text x="680" y="285" text-anchor="middle">数据形状与中间件</text><text x="1020" y="350" text-anchor="middle">定位、授权、业务调用</text><text x="1020" y="415" text-anchor="middle">会话或消息结果</text><text x="510" y="480" text-anchor="middle">响应基线</text><text x="680" y="560" text-anchor="middle">按游标订阅事件</text><text x="680" y="625" text-anchor="middle">增量事件、重连与重放</text><text x="850" y="690" text-anchor="middle">轨迹与真实产物</text></g><rect x="165" y="760" width="1170" height="55" rx="17" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="750" y="796" text-anchor="middle" font-size="19" font-weight="760" fill="#955A00">接口成功、连接健康、会话空闲与任务通过是四个不同结论</text></g></svg>

