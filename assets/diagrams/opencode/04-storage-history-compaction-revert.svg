<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 历史投影、压缩与恢复</title><desc id="desc">持久消息与部件经压缩选择分成较老头部和近期尾部，摘要加尾部重建模型上下文；恢复流程另用快照和补丁处理工作树，外部副作用不在保证范围。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">模型上下文是历史投影，不是原样重放</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">原始记录、摘要、保留尾部与工作树恢复必须分别观察</text><rect x="70" y="155" width="1360" height="115" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="3"/><text x="750" y="198" text-anchor="middle" font-size="24" font-weight="760" fill="#244F81">持久会话事实</text><text x="750" y="237" text-anchor="middle" font-size="19" fill="#17324D">会话元信息　用户与助手消息　文本与工具部件　补丁　错误　压缩标记</text><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M750 270v75"/><path d="M750 565v70"/></g><rect x="110" y="355" width="1280" height="210" rx="24" fill="#FFFFFF" stroke="#B7C7D8" stroke-width="2.5"/><text x="750" y="398" text-anchor="middle" font-size="24" font-weight="760" fill="#17324D">压缩选择与模型投影</text><g font-size="19" text-anchor="middle"><rect x="160" y="445" width="270" height="82" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="295" y="478" font-weight="760" fill="#9A3E24">较老头部</text><text x="295" y="506" fill="#17324D">交给摘要智能体</text><rect x="490" y="445" width="270" height="82" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="625" y="478" font-weight="760" fill="#5B3D7D">有损摘要</text><text x="625" y="506" fill="#17324D">可锚定上一摘要</text><rect x="820" y="445" width="270" height="82" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="955" y="478" font-weight="760" fill="#076663">近期尾部</text><text x="955" y="506" fill="#17324D">按预算逐轮保留</text><rect x="1150" y="445" width="190" height="82" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="1245" y="478" font-weight="760" fill="#955A00">模型消息</text><text x="1245" y="506" fill="#17324D">重排后转换</text></g><g font-size="20" text-anchor="middle"><rect x="85" y="650" width="390" height="125" rx="22" fill="#EDF5FF" stroke="#3569A8" stroke-width="3"/><text x="280" y="692" font-weight="760" fill="#244F81">完整历史仍供审计</text><text x="280" y="731" fill="#17324D">原始消息与产物引用</text><rect x="555" y="650" width="390" height="125" rx="22" fill="#F2ECF9" stroke="#76559B" stroke-width="3"/><text x="750" y="692" font-weight="760" fill="#5B3D7D">快照与补丁恢复</text><text x="750" y="731" fill="#17324D">工作树和会话后缀</text><rect x="1025" y="650" width="390" height="125" rx="22" fill="#FFEDE7" stroke="#C96138" stroke-width="3"/><text x="1220" y="692" font-weight="760" fill="#9A3E24">外部副作用仍存在</text><text x="1220" y="731" fill="#17324D">网络　数据库　外部目录</text></g></g></svg>

