<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 多层扩展架构</title><desc id="desc">项目实例与会话核心连接智能体、子智能体、技能、插件、模型上下文协议和语言服务器协议；它们分别改变权限会话、提示资源、宿主运行表面、远端能力和代码智能。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">扩展进入不同层，不共享一个信任边界</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">提示、宿主代码、远端协议与语言服务分别审计</text><rect x="485" y="330" width="530" height="190" rx="28" fill="#E9F2FF" stroke="#3569A8" stroke-width="4"/><text x="750" y="392" text-anchor="middle" font-size="28" font-weight="760" fill="#244F81">项目实例与会话核心</text><text x="750" y="438" text-anchor="middle" font-size="20" fill="#17324D">配置　模型　消息　工具　权限　事件</text><text x="750" y="478" text-anchor="middle" font-size="18" fill="#50677D">每种扩展只在明确入口进入主链</text><g font-size="20" text-anchor="middle"><rect x="70" y="150" width="330" height="130" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="3"/><text x="235" y="192" font-weight="760" fill="#5B3D7D">智能体与子智能体</text><text x="235" y="228" fill="#17324D">模型　提示　子会话</text><text x="235" y="257" fill="#17324D">派生权限与深度</text><rect x="585" y="125" width="330" height="130" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="750" y="167" font-weight="760" fill="#955A00">技能</text><text x="750" y="203" fill="#17324D">发现与权限过滤</text><text x="750" y="232" fill="#17324D">进入提示资源</text><rect x="1100" y="150" width="330" height="130" rx="22" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1265" y="192" font-weight="760" fill="#9A3E24">插件</text><text x="1265" y="228" fill="#17324D">工具　认证　服务</text><text x="1265" y="257" fill="#17324D">宿主钩子改写</text><rect x="230" y="650" width="390" height="130" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="425" y="692" font-weight="760" fill="#076663">模型上下文协议</text><text x="425" y="728" fill="#17324D">工具　提示　资源　模板</text><text x="425" y="757" fill="#17324D">外部协议与认证</text><rect x="880" y="650" width="390" height="130" rx="22" fill="#EDF5FF" stroke="#3569A8" stroke-width="3"/><text x="1075" y="692" font-weight="760" fill="#244F81">语言服务器协议</text><text x="1075" y="728" fill="#17324D">诊断　定义　引用　符号</text><text x="1075" y="757" fill="#17324D">独立语言服务进程</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M380 280l150 70"/><path d="M750 255v66"/><path d="M1120 280l-150 70"/><path d="M570 520l-100 120"/><path d="M930 520l100 120"/></g></g></svg>
