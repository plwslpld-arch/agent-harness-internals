<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 多客户端表面</title><desc id="desc">同一项目、会话和事件服务向单次终端、交互终端、网页、桌面和编辑器协议投影；各客户端保持自己的视图、连接与传输状态。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">共享会话核心，不等于共享客户端状态</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">每个表面都有自己的呈现、连接与恢复语义</text><rect x="350" y="305" width="800" height="230" rx="30" fill="#E9F2FF" stroke="#3569A8" stroke-width="4"/><text x="750" y="365" text-anchor="middle" font-size="30" font-weight="760" fill="#244F81">共享服务核心</text><text x="750" y="415" text-anchor="middle" font-size="21" fill="#17324D">项目　配置　会话　消息　工具　权限　事件</text><text x="750" y="460" text-anchor="middle" font-size="19" fill="#50677D">进程内或远端服务提供权威持久事实</text><text x="750" y="500" text-anchor="middle" font-size="18" fill="#50677D">客户端通过开发包、请求和事件流同步</text><g font-size="20" text-anchor="middle"><rect x="45" y="145" width="260" height="115" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="3"/><text x="175" y="188" font-weight="760" fill="#5B3D7D">单次终端</text><text x="175" y="226" fill="#17324D">格式化或事件输出</text><rect x="330" y="120" width="260" height="115" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="460" y="163" font-weight="760" fill="#955A00">交互终端</text><text x="460" y="201" fill="#17324D">输入　选择　历史回放</text><rect x="620" y="110" width="260" height="115" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="750" y="153" font-weight="760" fill="#076663">网页应用</text><text x="750" y="191" fill="#17324D">标签　草稿　评论</text><rect x="910" y="120" width="260" height="115" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1040" y="163" font-weight="760" fill="#9A3E24">桌面应用</text><text x="1040" y="201" fill="#17324D">窗口　本地与子系统</text><rect x="1195" y="145" width="260" height="115" rx="20" fill="#EDF5FF" stroke="#3569A8" stroke-width="3"/><text x="1325" y="188" font-weight="760" fill="#244F81">编辑器协议</text><text x="1325" y="226" fill="#17324D">模式　用量　会话更新</text></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M305 230l95 95"/><path d="M500 235l70 65"/><path d="M750 225v70"/><path d="M1000 235l-70 65"/><path d="M1195 230l-95 95"/></g><g font-size="19" text-anchor="middle"><rect x="80" y="660" width="390" height="115" rx="21" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="275" y="702" font-weight="760" fill="#076663">共享事实</text><text x="275" y="740" fill="#17324D">会话、消息、事件、文件产物</text><rect x="555" y="660" width="390" height="115" rx="21" fill="#F0EAF8" stroke="#76559B" stroke-width="3"/><text x="750" y="702" font-weight="760" fill="#5B3D7D">局部状态</text><text x="750" y="740" fill="#17324D">视图、路由、窗口、乐观缓存</text><rect x="1030" y="660" width="390" height="115" rx="21" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1225" y="702" font-weight="760" fill="#9A3E24">独立验收</text><text x="1225" y="740" fill="#17324D">显示完成不代替任务评分</text></g><path d="M750 535v115" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/></g></svg>

