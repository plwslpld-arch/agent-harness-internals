<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 工具权限与副作用决策</title><desc id="desc">工具目录经模型表面筛选后，由参数校验和应用层权限规则决定允许、询问或拒绝；用户批准不等于操作系统沙箱，快照也只覆盖部分文件副作用。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">用户批准是调用决策，不是操作系统沙箱</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">目录、模型可见、规则判断、真实执行与副作用恢复逐层分开</text><g font-size="19" text-anchor="middle"><rect x="55" y="155" width="250" height="105" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="3"/><text x="180" y="196" font-weight="760" fill="#244F81">一　工具目录</text><text x="180" y="230" fill="#17324D">内建　项目　插件　MCP</text><rect x="355" y="155" width="250" height="105" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="3"/><text x="480" y="196" font-weight="760" fill="#5B3D7D">二　模型表面</text><text x="480" y="230" fill="#17324D">运行条件与规则筛选</text><rect x="655" y="155" width="250" height="105" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="780" y="196" font-weight="760" fill="#955A00">三　工具调用</text><text x="780" y="230" fill="#17324D">名称与参数校验</text><rect x="955" y="155" width="250" height="105" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="1080" y="196" font-weight="760" fill="#076663">四　权限求值</text><text x="1080" y="230" fill="#17324D">最后匹配规则生效</text><rect x="1255" y="155" width="190" height="105" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1350" y="196" font-weight="760" fill="#9A3E24">五　副作用</text><text x="1350" y="230" fill="#17324D">宿主真实执行</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M305 207h42"/><path d="M605 207h42"/><path d="M905 207h42"/><path d="M1205 207h42"/></g><rect x="140" y="355" width="1220" height="200" rx="24" fill="#FFFFFF" stroke="#B7C7D8" stroke-width="2.5"/><text x="750" y="397" text-anchor="middle" font-size="24" font-weight="760" fill="#17324D">应用层权限分支</text><g font-size="20" text-anchor="middle"><rect x="205" y="445" width="280" height="78" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="345" y="478" font-weight="760" fill="#076663">允许</text><text x="345" y="505" fill="#17324D">当前检查继续</text><rect x="610" y="445" width="280" height="78" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="750" y="478" font-weight="760" fill="#955A00">询问</text><text x="750" y="505" fill="#17324D">一次　持续　拒绝</text><rect x="1015" y="445" width="280" height="78" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1155" y="478" font-weight="760" fill="#9A3E24">拒绝</text><text x="1155" y="505" fill="#17324D">不调用工具</text></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M1080 267v80"/><path d="M750 555v75"/></g><g font-size="20" text-anchor="middle"><rect x="90" y="645" width="390" height="120" rx="22" fill="#EDF5FF" stroke="#3569A8" stroke-width="3"/><text x="285" y="686" font-weight="760" fill="#244F81">工具结果与轨迹</text><text x="285" y="722" fill="#17324D">消息部件　事件　错误　附件</text><rect x="555" y="645" width="390" height="120" rx="22" fill="#F2ECF9" stroke="#76559B" stroke-width="3"/><text x="750" y="686" font-weight="760" fill="#5B3D7D">快照与补丁</text><text x="750" y="722" fill="#17324D">工作树变化可部分恢复</text><rect x="1020" y="645" width="390" height="120" rx="22" fill="#FFEDE7" stroke="#C96138" stroke-width="3"/><text x="1215" y="686" font-weight="760" fill="#9A3E24">强隔离仍在外部</text><text x="1215" y="722" fill="#17324D">进程　文件系统　网络</text></g></g></svg>

