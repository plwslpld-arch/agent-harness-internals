<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 运行实例与模型可用链</title><desc id="desc">命令目录形成项目实例，全局、显式、项目、托管和环境配置合并后筛选模型服务；目录命中、模型取得、运行对象解析和真实请求是不同阶段。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">模型在目录中，只代表请求链刚刚开始</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">项目作用域、配置来源、服务筛选、认证和真实流请求必须逐层核对</text><rect x="55" y="145" width="1390" height="105" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="750" y="183" text-anchor="middle" font-size="23" font-weight="760" fill="#244F81">项目实例</text><text x="750" y="218" text-anchor="middle" font-size="18" fill="#17324D">命令目录　工作树　项目身份　数据库与服务作用域　外部路径边界</text>
<g font-size="18" text-anchor="middle"><rect x="55" y="325" width="230" height="102" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="170" y="365" font-weight="760" fill="#5B3D7D">全局与认证远端</text><text x="170" y="398" fill="#17324D">用户基础配置</text><rect x="345" y="325" width="230" height="102" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="460" y="365" font-weight="760" fill="#5B3D7D">显式配置</text><text x="460" y="398" fill="#17324D">运行参数指定</text><rect x="635" y="325" width="230" height="102" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="750" y="365" font-weight="760" fill="#5B3D7D">项目与资源目录</text><text x="750" y="398" fill="#17324D">本地智能体与命令</text><rect x="925" y="325" width="230" height="102" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="1040" y="365" font-weight="760" fill="#5B3D7D">托管配置</text><text x="1040" y="398" fill="#17324D">组织策略覆盖</text><rect x="1215" y="325" width="230" height="102" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="1330" y="365" font-weight="760" fill="#5B3D7D">环境权限覆盖</text><text x="1330" y="398" fill="#17324D">最终运行调整</text></g><g fill="none" stroke="#087F7C" stroke-width="3" marker-end="url(#a)"><path d="M170 435v65h580v42"/><path d="M460 435v65h290v42"/><path d="M750 435v107"/><path d="M1040 435v65H750v42"/><path d="M1330 435v65H750v42"/></g><rect x="565" y="550" width="370" height="92" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="750" y="588" text-anchor="middle" font-size="22" font-weight="760" fill="#076663">实例有效配置</text><text x="750" y="618" text-anchor="middle" font-size="17" fill="#17324D">模型　智能体　权限　插件　指令</text>
<g font-size="17" text-anchor="middle"><rect x="55" y="720" width="240" height="78" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="175" y="750" font-weight="760" fill="#955A00">一　模型目录</text><text x="175" y="778" fill="#17324D">只有元数据</text><rect x="345" y="720" width="240" height="78" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="465" y="750" font-weight="760" fill="#955A00">二　服务筛选</text><text x="465" y="778" fill="#17324D">启用与禁用</text><rect x="635" y="720" width="240" height="78" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="755" y="750" font-weight="760" fill="#955A00">三　取得模型</text><text x="755" y="778" fill="#17324D">验证当前实例</text><rect x="925" y="720" width="240" height="78" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="1045" y="750" font-weight="760" fill="#955A00">四　解析运行对象</text><text x="1045" y="778" fill="#17324D">开发包与认证</text><rect x="1215" y="720" width="230" height="78" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1330" y="750" font-weight="760" fill="#9A3E24">五　真实请求</text><text x="1330" y="778" fill="#17324D">仍可能失败</text></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M295 759h42"/><path d="M585 759h42"/><path d="M875 759h42"/><path d="M1165 759h42"/></g></g></svg>

