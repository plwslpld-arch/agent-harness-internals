<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">OpenCode 会话循环与模型流处理</title><desc id="desc">用户消息进入会话主循环，组装上下文与工具后发起模型流；事件处理器写入消息部件、工具状态、快照和用量，再返回继续、压缩或停止。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">一次自然停止，不等于任务正确</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">循环控制、流事件归约与独立验收承担不同职责</text><g font-size="20" text-anchor="middle"><rect x="55" y="160" width="250" height="105" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="3"/><text x="180" y="202" font-weight="760" fill="#244F81">一　会话主循环</text><text x="180" y="235" fill="#17324D">历史与结束条件</text><rect x="355" y="160" width="250" height="105" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="3"/><text x="480" y="202" font-weight="760" fill="#5B3D7D">二　上下文装配</text><text x="480" y="235" fill="#17324D">指令、权限、工具</text><rect x="655" y="160" width="250" height="105" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="780" y="202" font-weight="760" fill="#955A00">三　模型运行时</text><text x="780" y="235" fill="#17324D">原生或开发包</text><rect x="955" y="160" width="250" height="105" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="1080" y="202" font-weight="760" fill="#076663">四　事件处理器</text><text x="1080" y="235" fill="#17324D">归一、写入、清理</text><rect x="1255" y="160" width="190" height="105" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1350" y="202" font-weight="760" fill="#9A3E24">五　控制信号</text><text x="1350" y="235" fill="#17324D">三种结果</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M305 212h42"/><path d="M605 212h42"/><path d="M905 212h42"/><path d="M1205 212h42"/></g><rect x="80" y="350" width="1340" height="250" rx="24" fill="#FFFFFF" stroke="#B7C7D8" stroke-width="2.5"/><text x="750" y="393" text-anchor="middle" font-size="24" font-weight="760" fill="#17324D">统一流事件进入状态归约</text><g font-size="18" text-anchor="middle"><rect x="125" y="440" width="210" height="90" rx="17" fill="#EDF5FF"/><text x="230" y="476" font-weight="760" fill="#244F81">推理与文本</text><text x="230" y="506" fill="#17324D">开始　增量　结束</text><rect x="385" y="440" width="210" height="90" rx="17" fill="#F2ECF9"/><text x="490" y="476" font-weight="760" fill="#5B3D7D">工具状态</text><text x="490" y="506" fill="#17324D">等待　运行　结果</text><rect x="645" y="440" width="210" height="90" rx="17" fill="#FFF4DA"/><text x="750" y="476" font-weight="760" fill="#955A00">步骤与快照</text><text x="750" y="506" fill="#17324D">补丁　用量　成本</text><rect x="905" y="440" width="210" height="90" rx="17" fill="#E8F6F4"/><text x="1010" y="476" font-weight="760" fill="#076663">错误与重试</text><text x="1010" y="506" fill="#17324D">分类　等待　清理</text><rect x="1165" y="440" width="210" height="90" rx="17" fill="#FFEDE7"/><text x="1270" y="476" font-weight="760" fill="#9A3E24">消息持久化</text><text x="1270" y="506" fill="#17324D">事件与最终部件</text></g><g font-size="20" text-anchor="middle"><rect x="180" y="690" width="310" height="95" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="335" y="728" font-weight="760" fill="#076663">继续</text><text x="335" y="760" fill="#17324D">下一次模型步骤</text><rect x="595" y="690" width="310" height="95" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="750" y="728" font-weight="760" fill="#955A00">压缩</text><text x="750" y="760" fill="#17324D">创建摘要请求</text><rect x="1010" y="690" width="310" height="95" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="3"/><text x="1165" y="728" font-weight="760" fill="#9A3E24">停止</text><text x="1165" y="760" fill="#17324D">仍需独立验收</text></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M1080 273v70"/><path d="M750 600v82"/></g></g></svg>

