<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="state-title state-desc">
  <title id="state-title">会话记录、单次上下文、压缩与外部记忆的生命周期</title>
  <desc id="state-desc">持久会话保存身份、事件和恢复记录；上下文构造器为一次模型请求选择条目、摘要和运行时信息；外部记忆只提供候选材料，不能替代权威会话记录；恢复不得重放已完成副作用。</desc>
  <defs>
    <marker id="state-arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0 0l14 7-14 7z" fill="#0B8F8C"/>
    </marker>
    <marker id="state-warn" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0 0l14 7-14 7z" fill="#B34A3C"/>
    </marker>
  </defs>
  <rect width="1200" height="900" rx="32" fill="#F7FAFC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="600" y="55" text-anchor="middle" fill="#17324D" font-size="34" font-weight="760">持久会话不等于单次模型上下文</text>
    <text x="600" y="88" text-anchor="middle" fill="#496179" font-size="18">恢复会话是在重建状态，不是在重放已经发生的副作用</text>

    <rect x="42" y="126" width="350" height="590" rx="26" fill="#E8F1FF" stroke="#3569A8" stroke-width="3"/>
    <text x="217" y="166" text-anchor="middle" fill="#285383" font-size="25" font-weight="760">持久会话层</text>
    <text x="217" y="193" text-anchor="middle" fill="#496179" font-size="16">权威记录；保存方式因项目而异</text>
    <g fill="#FFFFFF" stroke="#6F91BB" stroke-width="2">
      <rect x="72" y="224" width="290" height="78" rx="15"/>
      <rect x="72" y="322" width="290" height="94" rx="15"/>
      <rect x="72" y="436" width="290" height="112" rx="15"/>
      <rect x="72" y="568" width="290" height="112" rx="15"/>
    </g>
    <text x="217" y="257" text-anchor="middle" fill="#17324D" font-size="20" font-weight="700">会话身份与父子关系</text>
    <text x="217" y="282" text-anchor="middle" fill="#496179" font-size="15">会话编号、创建时间、工作目录</text>
    <text x="217" y="357" text-anchor="middle" fill="#17324D" font-size="20" font-weight="700">追加事件</text>
    <text x="217" y="383" text-anchor="middle" fill="#496179" font-size="15">用户、模型、工具调用与结果</text>
    <text x="217" y="474" text-anchor="middle" fill="#17324D" font-size="20" font-weight="700">派生摘要记录</text>
    <text x="217" y="500" text-anchor="middle" fill="#496179" font-size="15">可重建上下文的压缩检查点</text>
    <text x="217" y="526" text-anchor="middle" fill="#8A3D2F" font-size="14">不能假设所有实现保留全部原文</text>
    <text x="217" y="606" text-anchor="middle" fill="#17324D" font-size="20" font-weight="700">副作用提交账本</text>
    <text x="217" y="632" text-anchor="middle" fill="#496179" font-size="15">调用标识、状态、结果、去重键</text>
    <text x="217" y="658" text-anchor="middle" fill="#8A3D2F" font-size="14">恢复时查询，不重新执行已完成操作</text>

    <rect x="448" y="126" width="380" height="590" rx="26" fill="#E8F6F5" stroke="#0B8F8C" stroke-width="3"/>
    <text x="638" y="166" text-anchor="middle" fill="#0B7775" font-size="25" font-weight="760">单次上下文构造</text>
    <text x="638" y="193" text-anchor="middle" fill="#496179" font-size="16">每次请求都可重新派生</text>
    <g fill="#FFFFFF" stroke="#55A5A2" stroke-width="2">
      <rect x="482" y="224" width="312" height="74" rx="15"/>
      <rect x="482" y="320" width="312" height="74" rx="15"/>
      <rect x="482" y="416" width="312" height="104" rx="15"/>
      <rect x="482" y="542" width="312" height="104" rx="15"/>
    </g>
    <text x="638" y="257" text-anchor="middle" fill="#17324D" font-size="19" font-weight="700">选择相关路径与事件</text>
    <text x="638" y="281" text-anchor="middle" fill="#496179" font-size="15">过滤分支、状态与不可见条目</text>
    <text x="638" y="353" text-anchor="middle" fill="#17324D" font-size="19" font-weight="700">注入本次运行时信息</text>
    <text x="638" y="377" text-anchor="middle" fill="#496179" font-size="15">指令、工具、环境与检索结果</text>
    <text x="638" y="449" text-anchor="middle" fill="#17324D" font-size="19" font-weight="700">压缩或截断旧历史</text>
    <text x="638" y="475" text-anchor="middle" fill="#496179" font-size="15">摘要加近期尾部组成有限视图</text>
    <text x="638" y="500" text-anchor="middle" fill="#8A3D2F" font-size="14">摘要可能遗漏，前缀也会改变</text>
    <text x="638" y="575" text-anchor="middle" fill="#17324D" font-size="19" font-weight="700">发出一次模型请求</text>
    <text x="638" y="601" text-anchor="middle" fill="#496179" font-size="15">上下文有窗口、顺序和协议限制</text>
    <text x="638" y="626" text-anchor="middle" fill="#8A3D2F" font-size="14">用完即可丢弃，下次重新构造</text>

    <rect x="884" y="126" width="274" height="322" rx="26" fill="#FFF3D3" stroke="#C97A00" stroke-width="3"/>
    <text x="1021" y="166" text-anchor="middle" fill="#9B5C00" font-size="24" font-weight="760">外部记忆</text>
    <text x="1021" y="193" text-anchor="middle" fill="#496179" font-size="15">可选、扩展或外部能力</text>
    <rect x="914" y="224" width="214" height="76" rx="15" fill="#FFFFFF" stroke="#D7A94A" stroke-width="2"/>
    <text x="1021" y="255" text-anchor="middle" fill="#17324D" font-size="18" font-weight="700">检索候选材料</text>
    <text x="1021" y="280" text-anchor="middle" fill="#496179" font-size="14">相关性、时效与权限不确定</text>
    <rect x="914" y="322" width="214" height="82" rx="15" fill="#FFFFFF" stroke="#D7A94A" stroke-width="2"/>
    <text x="1021" y="354" text-anchor="middle" fill="#17324D" font-size="18" font-weight="700">经筛选后注入</text>
    <text x="1021" y="380" text-anchor="middle" fill="#8A3D2F" font-size="14">不能替代会话权威记录</text>

    <rect x="884" y="490" width="274" height="226" rx="26" fill="#FDEDE8" stroke="#B34A3C" stroke-width="3"/>
    <text x="1021" y="532" text-anchor="middle" fill="#8A3D2F" font-size="23" font-weight="760">恢复检查</text>
    <text x="1021" y="571" text-anchor="middle" fill="#17324D" font-size="17">一　重建已提交状态</text>
    <text x="1021" y="605" text-anchor="middle" fill="#17324D" font-size="17">二　识别未决调用</text>
    <text x="1021" y="639" text-anchor="middle" fill="#17324D" font-size="17">三　按去重键处置</text>
    <text x="1021" y="678" text-anchor="middle" fill="#8A3D2F" font-size="15" font-weight="700">历史回放不等于命令重放</text>

    <path d="M392 374H448" fill="none" stroke="#0B8F8C" stroke-width="4" marker-end="url(#state-arrow)"/>
    <path d="M884 363H828" fill="none" stroke="#C97A00" stroke-width="4" marker-end="url(#state-arrow)"/>
    <path d="M828 595H884" fill="none" stroke="#B34A3C" stroke-width="4" marker-end="url(#state-warn)"/>
    <path d="M884 661C825 776 334 785 217 681" fill="none" stroke="#B34A3C" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#state-warn)"/>

    <rect x="42" y="760" width="1116" height="102" rx="20" fill="#17324D"/>
    <text x="600" y="802" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">推荐不变量：压缩只改变模型可见视图；恢复只重建状态；已提交副作用不得因会话恢复而重复执行</text>
    <text x="600" y="834" text-anchor="middle" fill="#BFD5E8" font-size="16">上游是否满足这些条件，必须用存储、构造、提交和故障恢复证据逐项核对</text>
  </g>
</svg>
