<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">goose 配方与扩展装配链</title><desc id="desc">配方解析出指令、参数和扩展，扩展按会话连接并发现工具，之后才可能进入模型和执行链。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526179"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17233b}.t{font-size:34px;font-weight:700}.s{font-size:16px;fill:#596981}.h{font-size:21px;font-weight:700}.b{font-size:17px}.l{stroke:#526179;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="760" rx="28" fill="#f7f9fc"/><text x="70" y="68" class="t">配方是装配描述，扩展要逐级兑现</text><text x="70" y="101" class="s">配置存在、连接成功、工具可见、获得批准和真实执行是五个阶段</text>
  <rect x="70" y="160" width="250" height="145" rx="22" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="105" y="207" class="h">一　配方解析</text><text x="105" y="247" class="b">指令 · 提示 · 参数</text><text x="105" y="278" class="s">扩展与设置只是声明</text>
  <rect x="355" y="160" width="250" height="145" rx="22" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="390" y="207" class="h">二　会话装配</text><text x="390" y="247" class="b">模型服务与工作目录</text><text x="390" y="278" class="s">解析有效扩展列表</text>
  <rect x="640" y="160" width="250" height="145" rx="22" fill="#f0eaff" stroke="#8b5cf6" stroke-width="2"/><text x="675" y="207" class="h">三　扩展连接</text><text x="675" y="247" class="b">进程、远端或前端</text><text x="675" y="278" class="s">失败不会产生可用工具</text>
  <rect x="925" y="160" width="250" height="145" rx="22" fill="#edf9f2" stroke="#22a06b" stroke-width="2"/><text x="960" y="207" class="h">四　工具发现</text><text x="960" y="247" class="b">前缀化并合并清单</text><text x="960" y="278" class="s">对模型形成候选表面</text>
  <rect x="1210" y="160" width="160" height="145" rx="22" fill="#fff0f0" stroke="#e25555" stroke-width="2"/><text x="1238" y="207" class="h">五　执行</text><text x="1238" y="247" class="b">选择与批准</text><text x="1238" y="278" class="s">产生结果</text>
  <path d="M320 232H355" class="l"/><path d="M605 232H640" class="l"/><path d="M890 232H925" class="l"/><path d="M1175 232H1210" class="l"/>
  <rect x="70" y="430" width="400" height="155" rx="22" fill="#17233b"/><text x="108" y="478" style="font:700 21px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">配方负责可复用输入</text><text x="108" y="518" style="font:18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d5e0f2">固定指令、参数需求、扩展和设置</text><text x="108" y="550" style="font:16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#aebed8">仍需记录渲染后的有效值</text>
  <rect x="520" y="430" width="400" height="155" rx="22" fill="#fff" stroke="#526179" stroke-width="2"/><text x="558" y="478" class="h">扩展负责能力接入</text><text x="558" y="518" class="b">按会话连接、列工具并路由调用</text><text x="558" y="550" class="s">持久化状态不保证下次可达</text>
  <rect x="970" y="430" width="400" height="155" rx="22" fill="#fff0f0" stroke="#e25555" stroke-width="2"/><text x="1008" y="478" class="h">评测负责结果判定</text><text x="1008" y="518" class="b">冻结配方、轨迹、产物和评分器</text><text x="1008" y="550" class="s">不能用工具清单替代运行证据</text>
  <text x="70" y="704" class="s">关键边界：声明不是连接，连接不是可见，可见不是调用，调用也不是任务通过。</text>
</svg>
