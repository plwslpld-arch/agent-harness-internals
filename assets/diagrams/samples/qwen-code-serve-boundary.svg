<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Qwen Code 服务回放与批准边界</title><desc id="desc">Agent 事件经 ACP 桥接器按轮次压缩后供多个客户端回放，服务桥接器对危险批准模式实施显式作用域门禁。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526179"/></marker><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#17233b}.t{font-size:34px;font-weight:700}.s{font-size:16px;fill:#596981}.h{font-size:21px;font-weight:700}.b{font-size:17px}.l{stroke:#526179;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="760" rx="28" fill="#f7f9fc"/><text x="70" y="68" class="t">服务模式把单进程循环扩成多客户端会话表面</text><text x="70" y="101" class="s">事件回放与批准模式控制显示了相对 Gemini CLI 的独立演进边界</text>
  <rect x="70" y="160" width="270" height="145" rx="22" fill="#e8f1ff" stroke="#3b82f6" stroke-width="2"/><text x="105" y="207" class="h">Agent 运行事件</text><text x="105" y="247" class="b">文本、思考、工具与终止</text><text x="105" y="278" class="s">流式事件数量可能很大</text>
  <rect x="400" y="160" width="300" height="145" rx="22" fill="#fff4df" stroke="#f59e0b" stroke-width="2"/><text x="435" y="207" class="h">轮次边界压缩</text><text x="435" y="247" class="b">合并片段并归约工具状态</text><text x="435" y="278" class="s">保留不同事件相对顺序</text>
  <rect x="760" y="160" width="270" height="145" rx="22" fill="#f0eaff" stroke="#8b5cf6" stroke-width="2"/><text x="795" y="207" class="h">会话回放日志</text><text x="795" y="247" class="b">快照、窗口与截断锚点</text><text x="795" y="278" class="s">不等同原始逐事件日志</text>
  <rect x="1090" y="160" width="280" height="145" rx="22" fill="#edf9f2" stroke="#22a06b" stroke-width="2"/><text x="1125" y="207" class="h">客户端表面</text><text x="1125" y="247" class="b">终端、网页、协议与 SDK</text><text x="1125" y="278" class="s">按会话订阅和恢复</text>
  <path d="M340 232H400" class="l"/><path d="M700 232H760" class="l"/><path d="M1030 232H1090" class="l"/>
  <rect x="70" y="430" width="400" height="155" rx="22" fill="#fff0f0" stroke="#e25555" stroke-width="2"/><text x="108" y="478" class="h">危险批准模式</text><text x="108" y="518" class="b">自动编辑、自动执行与跳过确认</text><text x="108" y="550" class="s">持久化会扩大后续影响范围</text>
  <rect x="520" y="430" width="400" height="155" rx="22" fill="#17233b"/><text x="558" y="478" style="font:700 21px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#fff">服务桥接器门禁</text><text x="558" y="518" style="font:18px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#d5e0f2">默认拒绝危险模式与持久化变更</text><text x="558" y="550" style="font:16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#aebed8">必须显式开放全局作用域</text>
  <rect x="970" y="430" width="400" height="155" rx="22" fill="#fff" stroke="#526179" stroke-width="2"/><text x="1008" y="478" class="h">仍需叠加</text><text x="1008" y="518" class="b">工具权限、沙箱、认证与独立评测</text><text x="1008" y="550" class="s">目录相似不能推出行为等价</text>
  <text x="70" y="704" class="s">关键边界：本专题验证当前锁定实现；共同结构只用于导航，不作为与 Gemini CLI 等价的证据。</text>
</svg>
