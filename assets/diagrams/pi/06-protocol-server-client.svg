<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc"><title id="title">pi 远程协议与会话控制时序</title><desc id="desc">客户端会话租约把命令编码为长度帧与二进制消息，服务端验证并交给会话运行时；响应、事件和快照分别回流，命令成功不代表任务通过。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1400" height="820" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="35" font-weight="760" fill="#17324D">远程命令成功，只到达控制边界</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">消息边界、结构验证、会话所有权与任务正确性分层处理</text>
<g font-size="19" text-anchor="middle" font-weight="760"><rect x="55" y="140" width="240" height="70" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="175" y="183" fill="#244F81">客户端与会话租约</text><rect x="385" y="140" width="240" height="70" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="505" y="183" fill="#5B3D7D">帧、编码与结构</text><rect x="715" y="140" width="240" height="70" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="835" y="183" fill="#076663">服务端连接</text><rect x="1045" y="140" width="300" height="70" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="1195" y="183" fill="#955A00">会话运行时</text></g>
<g stroke="#A9B8C6" stroke-width="2" stroke-dasharray="7 7"><path d="M175 220v470"/><path d="M505 220v470"/><path d="M835 220v470"/><path d="M1195 220v470"/></g>
<g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M175 270h315"/><path d="M505 330h315"/><path d="M835 390h345"/></g><g font-size="17" fill="#17324D"><text x="310" y="258">一　命令与请求标识</text><text x="610" y="318">二　长度帧＋二进制编码＋严格结构</text><text x="950" y="378">三　验证附着并执行</text></g>
<g fill="none" stroke="#76559B" stroke-width="4" marker-end="url(#a)"><path d="M1195 480H850"/><path d="M835 540H520"/><path d="M505 600H190"/></g><g font-size="17" fill="#17324D"><text x="950" y="468">四　结果快照与运行事件</text><text x="615" y="528">五　响应匹配与状态合并</text><text x="275" y="588">六　租约监听与释放</text></g>
<rect x="55" y="710" width="1290" height="65" rx="18" fill="#17324D"/><text x="700" y="739" text-anchor="middle" font-size="19" fill="#fff">帧完整 ≠ 结构合法 ≠ 命令成功 ≠ 智能体成功 ≠ 独立评测通过</text><text x="700" y="763" text-anchor="middle" font-size="16" fill="#8EE1D8">每一层保留自己的错误、标识、时间与最终状态</text></g></svg>

