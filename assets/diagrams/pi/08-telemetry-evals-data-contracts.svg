<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc"><title id="title">pi 遥测、评测、训练与发布的数据边界</title><desc id="desc">固定数据集和试验进入智能体目标，遥测记录运行，轨迹与产物交给外部评分器；统计、训练适配、模型选择和独立发布留出集保持分离，会话分享是显式外发支路。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><marker id="b" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#C96138"/></marker></defs><rect width="1500" height="920" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">记录、评分、训练和发布是四种不同责任</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">有轨迹不等于有分数，有分数不等于可训练，更不等于允许发布</text>
<g font-size="19" text-anchor="middle"><rect x="55" y="145" width="210" height="106" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="160" y="185" font-weight="760" fill="#244F81">固定数据集</text><text x="160" y="219" fill="#17324D">样本与版本</text><rect x="315" y="145" width="210" height="106" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="420" y="185" font-weight="760" fill="#244F81">固定试验</text><text x="420" y="219" fill="#17324D">配置与重复编号</text><rect x="575" y="145" width="250" height="106" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="700" y="185" font-weight="760" fill="#076663">智能体目标</text><text x="700" y="219" fill="#17324D">模型、工具与会话</text><rect x="875" y="145" width="250" height="106" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="1000" y="185" font-weight="760" fill="#955A00">轨迹与产物</text><text x="1000" y="219" fill="#17324D">消息、工具、用量、文件</text><rect x="1175" y="145" width="270" height="106" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="1310" y="185" font-weight="760" fill="#5B3D7D">外部评分器</text><text x="1310" y="219" fill="#17324D">版本化标准与分数</text></g>
<g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M265 198h42"/><path d="M525 198h42"/><path d="M825 198h42"/><path d="M1125 198h42"/></g>
<rect x="575" y="310" width="550" height="116" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="850" y="350" text-anchor="middle" font-size="23" font-weight="760" fill="#076663">遥测契约：只记录运行事实</text><text x="850" y="384" text-anchor="middle" font-size="18" fill="#17324D">跨度　事件　属性　状态　父子关系</text><text x="850" y="410" text-anchor="middle" font-size="16" fill="#50677D">空适配器不记录；内存适配器用于隔离测试</text><path d="M700 251v51" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
<g font-size="19" text-anchor="middle"><rect x="120" y="515" width="300" height="112" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="270" y="556" font-weight="760" fill="#5B3D7D">配对统计</text><text x="270" y="591" fill="#17324D">通过率、用量、耗时、成本</text><rect x="505" y="515" width="300" height="112" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="655" y="556" font-weight="760" fill="#955A00">训练奖励适配</text><text x="655" y="591" fill="#17324D">评分映射与优化算法</text><rect x="890" y="515" width="300" height="112" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="1040" y="556" font-weight="760" fill="#244F81">模型检查点选择</text><text x="1040" y="591" fill="#17324D">选择集与版本证据</text><rect x="1275" y="515" width="170" height="112" rx="22" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1360" y="550" font-weight="760" fill="#9A3E24">独立发布</text><text x="1360" y="580" fill="#17324D">留出集门禁</text><text x="1360" y="607" fill="#50677D">另行授权</text></g>
<g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M1310 251v170H270v86"/><path d="M420 571h77"/><path d="M805 571h77"/></g><path d="M1190 571h77" fill="none" stroke="#C96138" stroke-width="4" marker-end="url(#b)"/>
<rect x="120" y="720" width="1325" height="125" rx="24" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="782" y="760" text-anchor="middle" font-size="22" font-weight="760" fill="#9A3E24">显式会话分享：独立的数据外发支路</text><text x="782" y="795" text-anchor="middle" font-size="18" fill="#17324D">用户执行分享命令 → 导出会话 → 组织制品或非公开代码片段 → 分享地址</text><text x="782" y="825" text-anchor="middle" font-size="16" fill="#50677D">必须授权、脱敏并核对可见性；不属于默认遥测，也不产生评测分数</text><path d="M1000 251v456" fill="none" stroke="#C96138" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#b)"/>
</g></svg>

