<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">pi 产品表面与隔离边界</title><desc id="desc">同一编码智能体会话投影到交互终端、单次文本、事件流和远程命令；默认使用宿主权限，沙箱扩展、虚拟机、容器和策略沙箱需要显式部署。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1400" height="850" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="35" font-weight="760" fill="#17324D">表面可以不同，运行时与安全边界必须单独核对</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">界面状态不是任务结果，项目信任也不是操作系统隔离</text>
<rect x="430" y="140" width="540" height="120" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="700" y="185" text-anchor="middle" font-size="24" font-weight="760" fill="#076663">编码智能体会话</text><text x="700" y="222" text-anchor="middle" font-size="18" fill="#17324D">模型　消息　工具　扩展　会话事件</text>
<g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M500 265v70H170v35"/><path d="M630 265v70H510v35"/><path d="M770 265v70H850v35"/><path d="M900 265v70h330v35"/></g>
<g font-size="19" text-anchor="middle"><rect x="55" y="380" width="230" height="115" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="170" y="420" font-weight="760" fill="#244F81">交互终端</text><text x="170" y="452" fill="#17324D">组件树与差分渲染</text><text x="170" y="478" fill="#50677D">编辑器、覆盖层、状态栏</text><rect x="395" y="380" width="230" height="115" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="510" y="420" font-weight="760" fill="#955A00">单次文本</text><text x="510" y="452" fill="#17324D">最终回答后退出</text><rect x="735" y="380" width="230" height="115" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="850" y="420" font-weight="760" fill="#5B3D7D">事件流</text><text x="850" y="452" fill="#17324D">逐行输出会话事件</text><rect x="1075" y="380" width="270" height="115" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1210" y="420" font-weight="760" fill="#9A3E24">远程命令</text><text x="1210" y="452" fill="#17324D">命令、响应与事件</text></g>
<rect x="55" y="565" width="1290" height="80" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="700" y="598" text-anchor="middle" font-size="22" font-weight="760" fill="#9A3E24">默认边界：启动用户与宿主进程权限</text><text x="700" y="627" text-anchor="middle" font-size="17" fill="#17324D">文件　进程　网络　凭据　自定义扩展</text>
<g font-size="17" text-anchor="middle"><rect x="55" y="710" width="280" height="75" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="195" y="741" fill="#17324D">沙箱扩展示例</text><text x="195" y="768" fill="#50677D">主要包装命令工具，可回退</text><rect x="380" y="710" width="280" height="75" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="520" y="741" fill="#17324D">本地微型虚拟机</text><text x="520" y="768" fill="#50677D">工具在虚拟机内执行</text><rect x="705" y="710" width="280" height="75" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="845" y="741" fill="#17324D">普通容器</text><text x="845" y="768" fill="#50677D">挂载与密钥仍需收紧</text><rect x="1030" y="710" width="315" height="75" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="1187" y="741" fill="#17324D">策略控制沙箱</text><text x="1187" y="768" fill="#50677D">外部网关与策略需验证</text></g></g></svg>

