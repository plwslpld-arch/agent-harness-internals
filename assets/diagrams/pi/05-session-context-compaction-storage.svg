<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">pi 会话树、上下文投影与存储边界</title><desc id="desc">追加式会话树经活动叶节点和压缩规则派生模型上下文；原始历史继续保留，锁定版本实现内存与逐行记录存储，没有数据库存储后端。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="820" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
  <text x="700" y="54" text-anchor="middle" font-size="35" font-weight="760" fill="#17324D">完整历史、活动分支与模型上下文不是同一个对象</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">压缩改变投影，不把摘要变成无损审计记录</text>
  <rect x="55" y="140" width="430" height="485" rx="25" fill="#E9F2FF" stroke="#3569A8" stroke-width="3" filter="url(#s)"/><text x="85" y="180" font-size="23" font-weight="760" fill="#244F81">追加式会话树</text>
  <g font-size="17" text-anchor="middle" fill="#17324D"><rect x="180" y="215" width="180" height="55" rx="14" fill="#fff"/><text x="270" y="248">根消息</text><rect x="90" y="330" width="165" height="55" rx="14" fill="#fff"/><text x="172" y="363">主分支消息</text><rect x="285" y="330" width="165" height="55" rx="14" fill="#fff"/><text x="367" y="363">另一分支消息</text><rect x="90" y="445" width="165" height="55" rx="14" fill="#FFF2D4"/><text x="172" y="478">压缩摘要</text><rect x="90" y="555" width="165" height="45" rx="14" fill="#fff"/><text x="172" y="584">活动叶节点</text></g>
  <g fill="none" stroke="#3569A8" stroke-width="3"><path d="M270 270v35l-98 25"/><path d="M270 305l97 25"/><path d="M172 385v60"/><path d="M172 500v55"/></g>
  <path d="M500 370h115" stroke="#087F7C" stroke-width="5" marker-end="url(#a)"/><text x="557" y="350" text-anchor="middle" font-size="17" fill="#50677D">选择与投影</text>
  <rect x="630" y="180" width="330" height="375" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="3" filter="url(#s)"/><text x="795" y="222" text-anchor="middle" font-size="23" font-weight="760" fill="#076663">模型上下文</text>
  <g font-size="17" text-anchor="middle" fill="#17324D"><rect x="680" y="260" width="230" height="65" rx="15" fill="#fff"/><text x="795" y="300">最新压缩摘要</text><rect x="680" y="350" width="230" height="65" rx="15" fill="#fff"/><text x="795" y="390">明确保留的消息</text><rect x="680" y="440" width="230" height="65" rx="15" fill="#fff"/><text x="795" y="480">压缩后的新消息</text></g>
  <path d="M975 370h95" stroke="#087F7C" stroke-width="5" marker-end="url(#a)"/>
  <rect x="1085" y="140" width="260" height="485" rx="25" fill="#F0EAF8" stroke="#76559B" stroke-width="3" filter="url(#s)"/><text x="1215" y="180" text-anchor="middle" font-size="23" font-weight="760" fill="#5B3D7D">存储后端</text>
  <g font-size="18" text-anchor="middle"><rect x="1125" y="225" width="180" height="75" rx="16" fill="#fff"/><text x="1215" y="258" fill="#17324D">内存</text><text x="1215" y="285" fill="#087F7C">已实现</text><rect x="1125" y="335" width="180" height="75" rx="16" fill="#fff"/><text x="1215" y="368" fill="#17324D">逐行记录</text><text x="1215" y="395" fill="#087F7C">已实现并测试</text><rect x="1125" y="445" width="180" height="75" rx="16" fill="#FFECE5"/><text x="1215" y="478" fill="#17324D">数据库</text><text x="1215" y="505" fill="#C96138">锁定版本不可用</text></g>
  <rect x="55" y="690" width="1290" height="70" rx="19" fill="#17324D"/><text x="700" y="720" text-anchor="middle" font-size="19" fill="#fff">写入协调 ≠ 摘要无损　　上下文可重建 ≠ 外部副作用可重放</text><text x="700" y="747" text-anchor="middle" font-size="16" fill="#8EE1D8">独立评测应读取原始记录、工具产物与最终目标状态</text>
  </g></svg>

