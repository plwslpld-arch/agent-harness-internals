<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc"><title id="title">Codex 产品表面与证据流</title><desc id="desc">多个产品表面共享智能体核心，同时把运行记录、遥测和反馈交给独立评测与可选训练适配。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity=".12"/></filter></defs><rect width="1400" height="980" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">共享核心不等于共享协议，运行证据不等于发布评测</text><text x="700" y="91" text-anchor="middle" fill="#50677D" font-size="19">先分开产品投影，再分开观察、反馈、训练与裁决</text><g text-anchor="middle" filter="url(#s)"><rect x="55" y="140" width="230" height="100" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="170" y="182" fill="#285383" font-size="22" font-weight="760">CLI 与交互终端</text><text x="170" y="215" fill="#50677D" font-size="17">文本流与退出状态</text><rect x="320" y="140" width="230" height="100" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="435" y="182" fill="#086E6B" font-size="22" font-weight="760">无界面执行</text><text x="435" y="215" fill="#50677D" font-size="17">结构化输出与自动化</text><rect x="585" y="140" width="230" height="100" rx="18" fill="#F0ECF8" stroke="#76559B" stroke-width="2"/><text x="700" y="182" fill="#60458C" font-size="22" font-weight="760">App Server</text><text x="700" y="215" fill="#50677D" font-size="17">多传输协议通知</text><rect x="850" y="140" width="230" height="100" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="965" y="182" fill="#955A00" font-size="22" font-weight="760">MCP Server</text><text x="965" y="215" fill="#50677D" font-size="17">服务端工具协议</text><rect x="1115" y="140" width="230" height="100" rx="18" fill="#FFF0E8" stroke="#D2673A" stroke-width="2"/><text x="1230" y="182" fill="#8A3D2F" font-size="22" font-weight="760">Cloud 与 SDK</text><text x="1230" y="215" fill="#50677D" font-size="17">远程任务与调用封装</text></g><rect x="170" y="305" width="1060" height="120" rx="22" fill="#17324D" filter="url(#s)"/><text x="700" y="351" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="760">共享 Agent Harness 核心</text><text x="700" y="391" text-anchor="middle" fill="#D3E1EA" font-size="18">Thread　Turn　模型循环　工具路由　审批与沙箱　记录恢复</text><g fill="none" stroke="#087F7C" stroke-width="4"><path d="M170 240v53"/><path d="M435 240v53"/><path d="M700 240v53"/><path d="M965 240v53"/><path d="M1230 240v53"/></g><g filter="url(#s)"><rect x="70" y="500" width="370" height="150" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="255" y="544" text-anchor="middle" fill="#285383" font-size="23" font-weight="760">Rollout Trace</text><text x="255" y="580" text-anchor="middle" fill="#50677D" font-size="17">追加事件、关联与状态归约</text><text x="255" y="618" text-anchor="middle" fill="#8A3D2F" font-size="17">记录不是评分</text><rect x="515" y="500" width="370" height="150" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="700" y="544" text-anchor="middle" fill="#086E6B" font-size="23" font-weight="760">OTel 遥测</text><text x="700" y="580" text-anchor="middle" fill="#50677D" font-size="17">事件、指标、跨度与传播</text><text x="700" y="618" text-anchor="middle" fill="#8A3D2F" font-size="17">没有错误不等于通过</text><rect x="960" y="500" width="370" height="150" rx="20" fill="#FFF0E8" stroke="#D2673A" stroke-width="2"/><text x="1145" y="544" text-anchor="middle" fill="#8A3D2F" font-size="23" font-weight="760">Feedback</text><text x="1145" y="580" text-anchor="middle" fill="#50677D" font-size="17">诊断、标签、附件与同意</text><text x="1145" y="618" text-anchor="middle" fill="#8A3D2F" font-size="17">反馈不是 Reward</text></g><path d="M700 425v50H255v13" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><path d="M700 425v63" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><path d="M700 475h445v13" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><rect x="110" y="730" width="520" height="130" rx="20" fill="#F0ECF8" stroke="#76559B" stroke-width="2" filter="url(#s)"/><text x="370" y="775" text-anchor="middle" fill="#60458C" font-size="24" font-weight="760">独立发布 Eval</text><text x="370" y="813" text-anchor="middle" fill="#50677D" font-size="18">固定 Trial、Artifact、Scorer 与隔离 holdout</text><rect x="770" y="730" width="520" height="130" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2" filter="url(#s)"/><text x="1030" y="775" text-anchor="middle" fill="#955A00" font-size="24" font-weight="760">可选 RewardAdapter</text><text x="1030" y="813" text-anchor="middle" fill="#50677D" font-size="18">经审计评分 → DPO、GRPO 或 RFT</text><path d="M700 650v45H370v23" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><path d="M700 695h330v23" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><rect x="55" y="900" width="1290" height="48" rx="16" fill="#17324D"/><text x="700" y="932" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="760">训练信号参与优化，发布评测保持独立；同一证据可复用，裁决职责不可复用</text></g></svg>
