<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
  <title id="title">DSH 编排与扩展分层架构</title><desc id="desc">当前会话指导、持久状态、子代理编排、能力入口和运行时修改都汇入共同的智能体循环、会话与工具安全边界。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".12"/></filter></defs>
  <rect width="1400" height="1080" rx="34" fill="#F7FAFC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">DSH 编排：跨度不同，核心边界相同</text><text x="700" y="92" text-anchor="middle" fill="#50677D" font-size="19">从指导当前步骤到修改运行时，风险与验证成本逐层上升</text>
  <g filter="url(#s)"><rect x="55" y="140" width="400" height="190" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><rect x="500" y="140" width="400" height="190" rx="24" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><rect x="945" y="140" width="400" height="190" rx="24" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/></g>
  <text x="85" y="182" fill="#295887" font-size="23" font-weight="760">一　当前会话控制</text><text x="85" y="226" fill="#17324D" font-size="18">计划模式：改变指导</text><text x="85" y="262" fill="#17324D" font-size="18">待办清单：替换工作视图</text><text x="85" y="298" fill="#17324D" font-size="18">目标状态：跨轮次继续</text>
  <text x="530" y="182" fill="#086E6B" font-size="23" font-weight="760">二　建立新智能体</text><text x="530" y="226" fill="#17324D" font-size="18">一次性子代理：等待结果</text><text x="530" y="262" fill="#17324D" font-size="18">可继续子代理：保留子会话</text><text x="530" y="298" fill="#17324D" font-size="18">新建或分叉：上下文边界不同</text>
  <text x="975" y="182" fill="#8A5908" font-size="23" font-weight="760">三　批量编排</text><text x="975" y="226" fill="#17324D" font-size="18">工作流：受限脚本与并发</text><text x="975" y="262" fill="#17324D" font-size="18">新智能体迭代：逐轮交接</text><text x="975" y="298" fill="#17324D" font-size="18">完成报告不等于独立评测</text>
  <rect x="140" y="405" width="1120" height="205" rx="28" fill="#17324D"/><text x="700" y="452" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="760">共同核心：智能体循环＋会话事件＋工具注册表＋安全链</text>
  <g text-anchor="middle" font-size="17"><rect x="185" y="500" width="205" height="70" rx="16" fill="#E9F2FF"/><text x="287" y="542" fill="#17324D" font-weight="700">构造模型请求</text><rect x="460" y="500" width="205" height="70" rx="16" fill="#E7F5F3"/><text x="562" y="542" fill="#17324D" font-weight="700">执行工具与记录</text><rect x="735" y="500" width="205" height="70" rx="16" fill="#FFF2D4"/><text x="837" y="542" fill="#17324D" font-weight="700">继续或终止</text><rect x="1010" y="500" width="205" height="70" rx="16" fill="#FCE9E5"/><text x="1112" y="542" fill="#17324D" font-weight="700">核对真实产物</text></g>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M255 330v66"/><path d="M700 330v66"/><path d="M1145 330v66"/></g>
  <g filter="url(#s)"><rect x="55" y="690" width="400" height="215" rx="24" fill="#F0ECF8" stroke="#795DA7" stroke-width="2.5"/><rect x="500" y="690" width="400" height="215" rx="24" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><rect x="945" y="690" width="400" height="215" rx="24" fill="#FCE9E5" stroke="#B34A3C" stroke-width="2.5"/></g>
  <text x="85" y="735" fill="#60488A" font-size="23" font-weight="760">四　能力入口</text><text x="85" y="780" fill="#17324D" font-size="18">技能：按需说明与资源</text><text x="85" y="818" fill="#17324D" font-size="18">模型上下文协议：外部工具与资源</text><text x="85" y="856" fill="#50677D" font-size="17">入口不自动扩大权限</text>
  <text x="530" y="735" fill="#086E6B" font-size="23" font-weight="760">五　代码编排</text><text x="530" y="780" fill="#17324D" font-size="18">一次运行编排已有工具</text><text x="530" y="818" fill="#17324D" font-size="18">内部调用仍走注册表</text><text x="530" y="856" fill="#50677D" font-size="17">不保留跨调用解释器状态</text>
  <text x="975" y="735" fill="#8A3D2F" font-size="23" font-weight="760">六　运行时修改</text><text x="975" y="780" fill="#17324D" font-size="18">定义、运行、停止、撤销动态包</text><text x="975" y="818" fill="#17324D" font-size="18">改变服务与工具表</text><text x="975" y="856" fill="#B34A3C" font-size="17">最高风险，必须显式启用</text>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M255 690v-70"/><path d="M700 690v-70"/><path d="M1145 690v-70"/></g>
  <rect x="140" y="965" width="1120" height="65" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="700" y="1006" text-anchor="middle" fill="#8A5908" font-size="19" font-weight="700">统一验收：停止原因、子树事件、权限继承、工具结果与外部产物必须分别核对</text><text x="700" y="1060" text-anchor="middle" fill="#50677D" font-size="16">仓库包含某个包，只证明存在实现；最终组合、产品表面与运行模式决定实际可用能力</text></g>
</svg>
