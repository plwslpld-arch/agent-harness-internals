<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
  <title id="title">DSH 会话、压缩与冷恢复状态图</title><desc id="desc">追加事件日志派生当前模型表面；压缩通过替换节点遮蔽旧范围而不删除日志；持久化冷恢复只追加缺失闭合事件，外部大文本另由外溢存储保存。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".12"/></filter></defs>
  <rect width="1400" height="1080" rx="34" fill="#F7FAFC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">DSH 状态权威：日志保留事实，表面控制可见性</text><text x="700" y="92" text-anchor="middle" fill="#50677D" font-size="19">压缩、恢复和外溢解决不同问题，不能互相冒充</text>
  <rect x="55" y="135" width="1290" height="255" rx="26" fill="#E9F2FF" stroke="#3569A8" stroke-width="3"/><text x="85" y="178" fill="#295887" font-size="24" font-weight="760">一　追加事件日志：会话内事实源</text>
  <g font-size="16" text-anchor="middle" filter="url(#s)"><rect x="90" y="220" width="170" height="95" rx="16" fill="#FFFFFF"/><text x="175" y="255" fill="#17324D" font-weight="700">用户消息</text><text x="175" y="286" fill="#50677D">序列一</text><rect x="290" y="220" width="170" height="95" rx="16" fill="#FFFFFF"/><text x="375" y="255" fill="#17324D" font-weight="700">助手消息</text><text x="375" y="286" fill="#50677D">序列二</text><rect x="490" y="220" width="170" height="95" rx="16" fill="#FFFFFF"/><text x="575" y="255" fill="#17324D" font-weight="700">工具调用</text><text x="575" y="286" fill="#50677D">序列三</text><rect x="690" y="220" width="170" height="95" rx="16" fill="#FFFFFF"/><text x="775" y="255" fill="#17324D" font-weight="700">工具结果</text><text x="775" y="286" fill="#50677D">序列四</text><rect x="890" y="220" width="170" height="95" rx="16" fill="#FFFFFF"/><text x="975" y="255" fill="#17324D" font-weight="700">步骤边界</text><text x="975" y="286" fill="#50677D">序列五</text><rect x="1090" y="220" width="210" height="95" rx="16" fill="#FFFFFF"/><text x="1195" y="255" fill="#17324D" font-weight="700">压缩摘要与替换</text><text x="1195" y="286" fill="#50677D">继续追加</text></g>
  <text x="700" y="355" text-anchor="middle" fill="#295887" font-size="17">旧事件不原地删除；每个来源和边界仍可审计</text>
  <rect x="55" y="445" width="830" height="270" rx="26" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="85" y="488" fill="#086E6B" font-size="24" font-weight="760">二　当前模型表面：从日志折叠</text>
  <g text-anchor="middle" font-size="17" filter="url(#s)"><rect x="95" y="535" width="200" height="95" rx="17" fill="#FFFFFF"/><text x="195" y="571" fill="#17324D" font-weight="700">原可见节点</text><text x="195" y="602" fill="#50677D">消息与工具结果</text><rect x="370" y="535" width="200" height="95" rx="17" fill="#FFF2D4"/><text x="470" y="571" fill="#17324D" font-weight="700">压缩替换</text><text x="470" y="602" fill="#50677D">遮蔽平衡范围</text><rect x="645" y="535" width="200" height="95" rx="17" fill="#17324D"/><text x="745" y="571" fill="#FFFFFF" font-weight="700">本次模型历史</text><text x="745" y="602" fill="#D3E1EA">摘要＋新消息</text></g>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M295 583h67"/><path d="M570 583h67"/><path d="M470 445V403"/></g><text x="470" y="675" text-anchor="middle" fill="#50677D" font-size="17">替换改变可见性，不改写事实源</text>
  <rect x="925" y="445" width="420" height="270" rx="26" fill="#FFF2D4" stroke="#C57A0B" stroke-width="3"/><text x="955" y="488" fill="#8A5908" font-size="24" font-weight="760">三　外部大文本存储</text><text x="955" y="536" fill="#17324D" font-size="18" font-weight="700">会话内</text><text x="1050" y="536" fill="#50677D" font-size="17">预览＋定位符＋取回提示</text><text x="955" y="582" fill="#17324D" font-size="18" font-weight="700">会话外</text><text x="1050" y="582" fill="#50677D" font-size="17">完整格式化工具文本</text><path d="M955 610h350" stroke="#D5A34B" stroke-width="2"/><text x="955" y="650" fill="#B34A3C" font-size="17">路径存在 ≠ 文件仍在 ≠ 内容已核验</text><path d="M885 583h32" fill="none" stroke="#C57A0B" stroke-width="4" marker-end="url(#a)"/>
  <rect x="55" y="770" width="1290" height="230" rx="26" fill="#F0ECF8" stroke="#795DA7" stroke-width="3"/><text x="85" y="813" fill="#60488A" font-size="24" font-weight="760">四　冷恢复：只闭合日志，不重放副作用</text>
  <g text-anchor="middle" font-size="17"><text x="235" y="866" fill="#17324D" font-weight="700">尚未记录工具调用</text><text x="235" y="902" fill="#50677D">合成「未开始」结果</text><text x="700" y="866" fill="#17324D" font-weight="700">已记录调用但没有结果</text><text x="700" y="902" fill="#B34A3C">合成「结果未知」，先查外部状态</text><text x="1165" y="866" fill="#17324D" font-weight="700">已有工具结果</text><text x="1165" y="902" fill="#086E6B">不补第二个结果，只闭合边界</text></g><path d="M470 930h460" stroke="#795DA7" stroke-width="3"/><text x="700" y="970" text-anchor="middle" fill="#60488A" font-size="17">恢复准备会话；新的用户决定或新轮次重试属于后续执行</text>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M700 390v47"/><path d="M700 715v47"/></g><text x="700" y="1045" text-anchor="middle" fill="#17324D" font-size="17" font-weight="700">验证必须同时检查：日志序列、当前表面、闭合原因、外部产物与工具退出状态</text></g>
</svg>
