<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">DSH 工具调用的分层安全边界</title><desc id="desc">工具调用依次经过注册与参数、扩展策略、单调防护、一次性审批和平台隔离，拒绝在副作用前闭合；各平台证据强度分开标注。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><marker id="r" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#B34A3C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".12"/></filter></defs>
  <rect width="1400" height="1040" rx="34" fill="#F7FAFC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">DSH 工具安全：批准请求不等于隔离副作用</text><text x="700" y="91" text-anchor="middle" fill="#50677D" font-size="19">每层回答不同问题；只有平台后端真正承接进程与文件边界</text>
  <g font-size="17" text-anchor="middle" filter="url(#s)">
    <rect x="55" y="145" width="190" height="108" rx="18" fill="#E9F2FF" stroke="#3569A8"/><text x="150" y="178" fill="#17324D" font-weight="760">一　注册与参数</text><text x="150" y="207" fill="#50677D">工具可达？</text><text x="150" y="233" fill="#50677D">输入可物化？</text>
    <rect x="280" y="145" width="190" height="108" rx="18" fill="#F0ECF8" stroke="#795DA7"/><text x="375" y="178" fill="#17324D" font-weight="760">二　扩展策略</text><text x="375" y="207" fill="#50677D">前置策略瀑布</text><text x="375" y="233" fill="#50677D">允许或拒绝</text>
    <rect x="505" y="145" width="190" height="108" rx="18" fill="#FFF2D4" stroke="#C57A0B"/><text x="600" y="178" fill="#17324D" font-weight="760">三　单调防护</text><text x="600" y="207" fill="#50677D">拒绝不可被</text><text x="600" y="233" fill="#50677D">后来允许覆盖</text>
    <rect x="730" y="145" width="210" height="108" rx="18" fill="#FCE9E5" stroke="#B34A3C"/><text x="835" y="178" fill="#17324D" font-weight="760">四　一次性审批</text><text x="835" y="207" fill="#50677D">严格变宽才询问</text><text x="835" y="233" fill="#50677D">仅当前调用有效</text>
    <rect x="975" y="145" width="210" height="108" rx="18" fill="#E7F5F3" stroke="#087F7C"/><text x="1080" y="178" fill="#17324D" font-weight="760">五　平台隔离</text><text x="1080" y="207" fill="#50677D">选择真实运行器</text><text x="1080" y="233" fill="#50677D">报告执行强度</text>
    <rect x="1220" y="145" width="130" height="108" rx="18" fill="#17324D"/><text x="1285" y="178" fill="#FFFFFF" font-weight="760">工具结果</text><text x="1285" y="207" fill="#D3E1EA">退出状态</text><text x="1285" y="233" fill="#D3E1EA">副作用</text>
  </g>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M245 199h27"/><path d="M470 199h27"/><path d="M695 199h27"/><path d="M940 199h27"/><path d="M1185 199h27"/></g>
  <rect x="55" y="305" width="885" height="230" rx="24" fill="#FFFFFF" stroke="#B34A3C" stroke-width="2.5"/><text x="85" y="347" fill="#8A3D2F" font-size="23" font-weight="760">副作用之前的失败关闭</text>
  <g font-size="17" fill="#17324D"><text x="85" y="394">注册层：未知工具、不可直调、参数或输入物化失败</text><text x="85" y="433">策略层：前置策略拒绝；单调防护否决后工具主体不运行</text><text x="85" y="472">审批层：非严格升级不询问；拒绝、取消、无通道保持不同语义</text><text x="85" y="511">依赖层：审批服务或智能体缺失时默认失败，不静默放行</text></g>
  <g fill="none" stroke="#B34A3C" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"><path d="M150 253v35q0 15 15 15h35"/><path d="M375 253v35q0 15 15 15h35"/><path d="M600 253v35q0 15 15 15h35"/><path d="M835 253v35q0 15-15 15h-35"/></g>
  <rect x="975" y="305" width="375" height="230" rx="24" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="1005" y="347" fill="#8A5908" font-size="23" font-weight="760">审批审计对</text><text x="1005" y="394" fill="#17324D" font-size="18" font-weight="700">询问事件</text><text x="1005" y="426" fill="#50677D" font-size="17">工具、调用标识、理由</text><path d="M1005 447h305" stroke="#D5A34B" stroke-width="2"/><text x="1005" y="482" fill="#17324D" font-size="18" font-weight="700">决定事件</text><text x="1005" y="514" fill="#50677D" font-size="17">一次性允许／拒绝／取消／不可用</text>
  <rect x="55" y="590" width="1295" height="330" rx="26" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="85" y="635" fill="#086E6B" font-size="24" font-weight="760">平台执行证据必须分别登记</text>
  <g filter="url(#s)"><rect x="95" y="680" width="365" height="175" rx="20" fill="#FFFFFF"/><rect x="518" y="680" width="365" height="175" rx="20" fill="#FFFFFF"/><rect x="941" y="680" width="365" height="175" rx="20" fill="#FFFFFF"/></g>
  <g text-anchor="middle"><text x="277" y="720" fill="#17324D" font-size="22" font-weight="760">开源内核系统</text><text x="277" y="755" fill="#086E6B" font-size="18" font-weight="700">真实隔离实验</text><text x="277" y="787" fill="#50677D" font-size="16">可用时验证内外写入</text><text x="277" y="817" fill="#8A5908" font-size="16">探针失败则跳过</text>
  <text x="700" y="720" fill="#17324D" font-size="22" font-weight="760">苹果桌面系统</text><text x="700" y="755" fill="#086E6B" font-size="18" font-weight="700">真实隔离实验</text><text x="700" y="787" fill="#50677D" font-size="16">可用时验证内外写入</text><text x="700" y="817" fill="#8A5908" font-size="16">探针失败则跳过</text>
  <text x="1123" y="720" fill="#17324D" font-size="22" font-weight="760">微软视窗系统</text><text x="1123" y="755" fill="#8A5908" font-size="18" font-weight="700">提供器链契约</text><text x="1123" y="787" fill="#50677D" font-size="16">参数、模式、拒绝特征</text><text x="1123" y="817" fill="#B34A3C" font-size="16">执行强度：部分</text></g>
  <path d="M835 253v18q0 22 22 22h240q18 0 18 12" fill="none" stroke="#C57A0B" stroke-width="4" marker-end="url(#a)"/><path d="M1080 253h290v305q0 25-25 25h-80" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><text x="700" y="966" text-anchor="middle" fill="#17324D" font-size="18" font-weight="700">证据链：调用记录＋有效策略＋审批决定＋所选运行器＋执行强度＋产物检查</text><text x="700" y="1000" text-anchor="middle" fill="#50677D" font-size="16">缺少目标平台真实实验时，只保留源码或契约结论，不升级为部署安全证明</text></g>
</svg>
