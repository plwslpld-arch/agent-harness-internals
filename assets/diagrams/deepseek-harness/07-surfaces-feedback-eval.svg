<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">DSH 多产品表面、反馈与评测接入</title><desc id="desc">网页、一次性运行、自动化协议和开发工具包共享智能体核心但采用不同投影；消息反馈、会话反馈和遥测经过适配后才可进入训练或独立评测。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".12"/></filter></defs><rect width="1400" height="1100" rx="34" fill="#F7FAFC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="55" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">DSH 产品表面共享核心，不共享全部语义</text><text x="700" y="92" text-anchor="middle" fill="#50677D" font-size="19">先保存原始会话，再解释协议投影；先定义适配器，再谈奖励与评测</text>
  <g filter="url(#s)" text-anchor="middle"><rect x="55" y="145" width="270" height="150" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="190" y="188" fill="#17324D" font-size="22" font-weight="760">网页与宿主</text><text x="190" y="228" fill="#50677D" font-size="17">交互、工具卡、审批</text><text x="190" y="260" fill="#50677D" font-size="17">历史与子智能体</text><rect x="395" y="145" width="270" height="150" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="530" y="188" fill="#17324D" font-size="22" font-weight="760">一次性运行</text><text x="530" y="228" fill="#50677D" font-size="17">打印最终文本</text><text x="530" y="260" fill="#50677D" font-size="17">按内部原因退出</text><rect x="735" y="145" width="270" height="150" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="870" y="188" fill="#17324D" font-size="22" font-weight="760">自动化协议</text><text x="870" y="228" fill="#50677D" font-size="17">已提交文本</text><text x="870" y="260" fill="#50677D" font-size="17">停止原因映射</text><rect x="1075" y="145" width="270" height="150" rx="22" fill="#F0ECF8" stroke="#795DA7" stroke-width="2.5"/><text x="1210" y="188" fill="#17324D" font-size="22" font-weight="760">开发工具包</text><text x="1210" y="228" fill="#50677D" font-size="17">请求、响应、通知</text><text x="1210" y="260" fill="#50677D" font-size="17">关联会话子树</text></g>
  <rect x="205" y="380" width="990" height="180" rx="30" fill="#17324D"/><text x="700" y="430" text-anchor="middle" fill="#FFFFFF" font-size="27" font-weight="760">共同智能体核心</text><text x="700" y="475" text-anchor="middle" fill="#D3E1EA" font-size="19">会话事件　模型请求　工具安全　停止原因　外部产物</text><text x="700" y="520" text-anchor="middle" fill="#FFFFFF" font-size="17">权威证据留在会话与产物；表面只做选择性投影</text><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M190 295v45q0 30 30 30h360"/><path d="M530 295v65"/><path d="M870 295v65"/><path d="M1210 295v45q0 30-30 30h-360"/></g>
  <rect x="55" y="650" width="1290" height="290" rx="28" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="85" y="695" fill="#086E6B" font-size="24" font-weight="760">横切数据：记录不等于结论</text>
  <g text-anchor="middle" font-size="17" filter="url(#s)"><rect x="90" y="745" width="235" height="125" rx="18" fill="#FFFFFF"/><text x="207" y="783" fill="#17324D" font-weight="760">消息反馈</text><text x="207" y="817" fill="#50677D">正负评价、备注、版本</text><text x="207" y="848" fill="#50677D">独立持久侧车</text><rect x="365" y="745" width="235" height="125" rx="18" fill="#FFFFFF"/><text x="482" y="783" fill="#17324D" font-weight="760">会话反馈</text><text x="482" y="817" fill="#50677D">自由文本事件</text><text x="482" y="848" fill="#50677D">不启动模型轮次</text><rect x="640" y="745" width="235" height="125" rx="18" fill="#FFFFFF"/><text x="757" y="783" fill="#17324D" font-weight="760">遥测</text><text x="757" y="817" fill="#50677D">采样、脱敏、传输</text><text x="757" y="848" fill="#50677D">可能不可达</text><rect x="915" y="745" width="180" height="125" rx="18" fill="#FFF2D4"/><text x="1005" y="783" fill="#8A5908" font-weight="760">奖励适配</text><text x="1005" y="817" fill="#50677D">需显式语义</text><text x="1005" y="848" fill="#50677D">可缺失</text><rect x="1135" y="745" width="175" height="125" rx="18" fill="#FCE9E5"/><text x="1222" y="783" fill="#8A3D2F" font-weight="760">独立评测</text><text x="1222" y="817" fill="#50677D">固定试验</text><text x="1222" y="848" fill="#50677D">评分与门禁</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M325 807h32"/><path d="M600 807h32"/><path d="M875 807h32"/><path d="M1095 807h32"/></g><path d="M700 560v80" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><text x="700" y="910" text-anchor="middle" fill="#086E6B" font-size="17">训练奖励、检查点选择和发布评测必须保持数据与决策隔离</text>
  <rect x="155" y="990" width="1090" height="62" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="700" y="1029" text-anchor="middle" fill="#8A5908" font-size="18" font-weight="700">统一运行记录：目标表面＋原始停止原因＋协议响应＋退出码＋会话＋产物哈希</text><text x="700" y="1080" text-anchor="middle" fill="#50677D" font-size="16">只看最终文本、点赞或遥测到达状态，都不足以判定任务通过</text></g></svg>
