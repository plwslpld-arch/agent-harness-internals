<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 端到端工具任务流程</title>
  <desc id="desc">用户目标经产品表面进入 Session，模型提出工具调用，Harness 经过安全决策产生真实副作用，将结果送回模型后终止并输出证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker>
    <marker id="risk" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0l14 7-14 7z" fill="#B34A3C"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324D" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="1010" rx="34" fill="#F7FAFC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif">
    <text x="700" y="53" text-anchor="middle" fill="#17324D" font-size="36" font-weight="760">一项含工具调用任务：谁触发、谁决策、哪里产生副作用</text>
    <text x="700" y="88" text-anchor="middle" fill="#50677D" font-size="19">来自锁定 ACP 工具调用夹具；事件值是上游事实，分区是课程解释</text>

    <rect x="42" y="120" width="260" height="800" rx="25" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/>
    <rect x="326" y="120" width="748" height="800" rx="25" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/>
    <rect x="1098" y="120" width="260" height="800" rx="25" fill="#F1EDF8" stroke="#795DA7" stroke-width="2.5"/>
    <text x="172" y="160" text-anchor="middle" fill="#285383" font-size="23" font-weight="760">外部触发与展示</text>
    <text x="700" y="160" text-anchor="middle" fill="#086E6B" font-size="23" font-weight="760">Agent Harness 决策与持久状态</text>
    <text x="1228" y="160" text-anchor="middle" fill="#60458C" font-size="23" font-weight="760">外部服务与副作用</text>

    <g filter="url(#shadow)">
      <rect x="72" y="198" width="200" height="84" rx="18" fill="#FFFFFF" stroke="#7A9FC8"/>
      <text x="172" y="230" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">一　用户目标</text>
      <text x="172" y="257" text-anchor="middle" fill="#50677D" font-size="16">运行命令，再回复</text>

      <rect x="370" y="198" width="280" height="84" rx="18" fill="#FFFFFF" stroke="#51A9A5"/>
      <text x="510" y="230" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">二　收件箱与会话边界</text>
      <text x="510" y="257" text-anchor="middle" fill="#50677D" font-size="16">开始轮次与第一个步骤</text>

      <rect x="706" y="198" width="320" height="84" rx="18" fill="#FFFFFF" stroke="#51A9A5"/>
      <text x="866" y="230" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">三　装配模型请求</text>
      <text x="866" y="257" text-anchor="middle" fill="#50677D" font-size="16">指令＋历史＋运行时消息＋工具</text>

      <rect x="1128" y="198" width="200" height="84" rx="18" fill="#FFFFFF" stroke="#9C83BF"/>
      <text x="1228" y="230" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">四　模型响应</text>
      <text x="1228" y="257" text-anchor="middle" fill="#50677D" font-size="16">提出 bash 调用</text>

      <rect x="706" y="344" width="320" height="100" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/>
      <text x="866" y="377" text-anchor="middle" fill="#955A00" font-size="19" font-weight="760">五　记录行动意图</text>
      <text x="866" y="405" text-anchor="middle" fill="#50677D" font-size="16">合成 assistant/message</text>
      <text x="866" y="429" text-anchor="middle" fill="#8A3D2F" font-size="15">此时副作用尚未发生</text>

      <rect x="370" y="344" width="280" height="100" rx="18" fill="#FFFFFF" stroke="#51A9A5"/>
      <text x="510" y="377" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">六　工具安全管线</text>
      <text x="510" y="405" text-anchor="middle" fill="#50677D" font-size="16">注册、参数、策略、审批</text>
      <text x="510" y="429" text-anchor="middle" fill="#50677D" font-size="15">再选择隔离与执行后端</text>

      <rect x="1128" y="344" width="200" height="100" rx="18" fill="#FCE9E5" stroke="#B34A3C" stroke-width="2.5"/>
      <text x="1228" y="377" text-anchor="middle" fill="#8A3D2F" font-size="19" font-weight="760">七　真实副作用</text>
      <text x="1228" y="405" text-anchor="middle" fill="#50677D" font-size="16">命令环境输出</text>
      <text x="1228" y="429" text-anchor="middle" fill="#17324D" font-size="15">SNAPSHOT_OK</text>

      <rect x="370" y="508" width="280" height="100" rx="18" fill="#FFFFFF" stroke="#51A9A5"/>
      <text x="510" y="541" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">八　提交工具结果</text>
      <text x="510" y="569" text-anchor="middle" fill="#50677D" font-size="16">保留相同调用标识</text>
      <text x="510" y="593" text-anchor="middle" fill="#50677D" font-size="15">结束第一个步骤</text>

      <rect x="706" y="508" width="320" height="100" rx="18" fill="#FFFFFF" stroke="#51A9A5"/>
      <text x="866" y="541" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">九　第二次模型请求</text>
      <text x="866" y="569" text-anchor="middle" fill="#50677D" font-size="16">历史中包含工具结果</text>
      <text x="866" y="593" text-anchor="middle" fill="#50677D" font-size="15">开始第二个步骤</text>

      <rect x="1128" y="508" width="200" height="100" rx="18" fill="#FFFFFF" stroke="#9C83BF"/>
      <text x="1228" y="541" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">十　最终响应</text>
      <text x="1228" y="569" text-anchor="middle" fill="#50677D" font-size="16">文本：DONE</text>
      <text x="1228" y="593" text-anchor="middle" fill="#50677D" font-size="15">没有新工具调用</text>

      <rect x="706" y="672" width="320" height="100" rx="18" fill="#17324D"/>
      <text x="866" y="705" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="760">十一　Harness 终止</text>
      <text x="866" y="733" text-anchor="middle" fill="#D3E1EA" font-size="16">结束步骤与轮次</text>
      <text x="866" y="757" text-anchor="middle" fill="#D3E1EA" font-size="15">原因：正常完成</text>

      <rect x="72" y="672" width="200" height="100" rx="18" fill="#FFFFFF" stroke="#7A9FC8"/>
      <text x="172" y="705" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">十二　协议输出</text>
      <text x="172" y="733" text-anchor="middle" fill="#50677D" font-size="16">文本更新：DONE</text>
      <text x="172" y="757" text-anchor="middle" fill="#50677D" font-size="15">停止原因：end_turn</text>

      <rect x="1128" y="672" width="200" height="100" rx="18" fill="#FFFFFF" stroke="#9C83BF"/>
      <text x="1228" y="705" text-anchor="middle" fill="#17324D" font-size="19" font-weight="760">十三　证据消费者</text>
      <text x="1228" y="733" text-anchor="middle" fill="#50677D" font-size="16">反馈、遥测、评测</text>
      <text x="1228" y="757" text-anchor="middle" fill="#8A3D2F" font-size="15">语义需分别定义</text>
    </g>

    <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#arrow)">
      <path d="M272 240h90"/><path d="M650 240h48"/><path d="M1026 240h94"/>
      <path d="M1228 282v30q0 32-32 32h-162"/>
      <path d="M706 394h-48"/>
      <path d="M650 558h48"/><path d="M1026 558h94"/>
      <path d="M1228 608v30q0 34-34 34h-160"/>
      <path d="M706 722H280"/><path d="M1026 722h94"/>
    </g>
    <path d="M510 444v32q0 32 32 32h558q28 0 28-28v-28" fill="none" stroke="#B34A3C" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#risk)"/>
    <text x="885" y="494" text-anchor="middle" fill="#8A3D2F" font-size="14">通过安全决策后才进入外部执行</text>

    <rect x="42" y="943" width="1316" height="42" rx="14" fill="#EAF0F5"/>
    <text x="700" y="970" text-anchor="middle" fill="#17324D" font-size="17">三个不同边界：工具成功 ≠ 轮次完成 ≠ 评测通过；必须用调用标识、事件顺序与任务产物逐层核对</text>
  </g>
</svg>
