<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Claude Python SDK 传输与双向控制协议</title><desc id="desc">入口选择默认或自定义 Transport，默认路径拥有 CLI 子进程；Query 同时路由 SDK 与 CLI 发起的控制请求，关闭阶段负责回收资源。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="920" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">Transport 拥有进程，Query 拥有控制配对</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">默认 Python 路径；自定义 Transport 必须按自己的实现重新核对</text>
  <g font-size="18" text-anchor="middle"><rect x="70" y="142" width="250" height="88" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="195" y="177" font-weight="740" fill="#285383">入口</text><text x="195" y="207" fill="#50677D">query／交互 Client</text><rect x="385" y="142" width="280" height="88" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="525" y="177" font-weight="740" fill="#076663">InternalClient</text><text x="525" y="207" fill="#50677D">配置、材料化与装配</text><rect x="730" y="142" width="280" height="88" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="870" y="177" font-weight="740" fill="#955A00">Transport 分支</text><text x="870" y="207" fill="#50677D">默认子进程／调用方自定义</text><rect x="1075" y="142" width="255" height="88" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="1202" y="177" font-weight="740" fill="#614482">Query</text><text x="1202" y="207" fill="#50677D">读取、配对与回调</text></g><g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M320 186h57"/><path d="M665 186h57"/><path d="M1010 186h57"/></g>
  <rect x="70" y="290" width="590" height="260" rx="24" fill="#E7F5F3" stroke="#087F7C" stroke-width="3" filter="url(#s)"/><text x="105" y="331" font-size="23" font-weight="760" fill="#076663">默认 Transport：资源所有权</text><g font-size="18"><text x="110" y="375" fill="#17324D">一　查找捆绑 CLI、系统命令与已知位置</text><text x="110" y="414" fill="#17324D">二　构造参数、环境、工作目录与错误流</text><text x="110" y="453" fill="#17324D">三　创建子进程并持有标准输入输出</text><text x="110" y="492" fill="#17324D">四　结束输入，等待 → 终止 → 强制结束</text><text x="110" y="528" fill="#50677D">取消期间仍屏蔽回收；失败子进程留给退出清理</text></g>
  <rect x="740" y="290" width="590" height="260" rx="24" fill="#F0EAF8" stroke="#76559B" stroke-width="3" filter="url(#s)"/><text x="775" y="331" font-size="23" font-weight="760" fill="#614482">Query：两个方向的控制面</text><g font-size="18"><text x="780" y="375" fill="#17324D">SDK → CLI：initialize、Interrupt、状态查询</text><text x="780" y="414" fill="#17324D">CLI → SDK：权限、Hook、进程内 MCP</text><text x="780" y="453" fill="#17324D">唯一 request_id → 等待事件 → 响应或超时</text><text x="780" y="492" fill="#17324D">取消只停止匹配的在途处理任务</text><text x="780" y="528" fill="#50677D">控制帧内部路由，不作为普通 Message 产出</text></g>
  <rect x="145" y="610" width="1110" height="130" rx="23" fill="#17324D" filter="url(#s)"/><text x="185" y="649" font-size="22" font-weight="760" fill="#fff">同一标准输入上的顺序约束</text><text x="185" y="686" font-size="18" fill="#DCE8F2">用户消息写入 → CLI 发权限请求 → SDK 执行回调 → 写回控制响应 → Assistant 与 Result 继续</text><text x="185" y="718" font-size="18" fill="#8EE1D8">提前关闭标准输入会让权限、Hook 或 MCP 响应无法到达 CLI</text>
  <g font-size="18" text-anchor="middle"><rect x="145" y="792" width="330" height="82" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="310" y="825" font-weight="740" fill="#285383">连接成功</text><text x="310" y="853" fill="#50677D">只证明协议通道可用</text><rect x="535" y="792" width="330" height="82" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="700" y="825" font-weight="740" fill="#955A00">控制成功</text><text x="700" y="853" fill="#50677D">只证明请求响应配对</text><rect x="925" y="792" width="330" height="82" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="1090" y="825" font-weight="740" fill="#9A3E24">Eval 通过</text><text x="1090" y="853" fill="#50677D">仍须检查目标产物与副作用</text></g></g>
</svg>
