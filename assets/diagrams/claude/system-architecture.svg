<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc">
  <title id="title">Claude Agent Harness 双边界系统架构</title><desc id="desc">应用通过 Python 或 TypeScript Agent SDK 连接 Claude Code 闭源产品边界，工具副作用、外部会话存储和独立评测保持分离。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="940" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">Claude Agent Harness：公开协议可核对，闭源内部不猜测</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">课程责任投影：Python 有主体源码；TypeScript 只按公开契约与真实示例分析</text>
  <rect x="55" y="122" width="1290" height="112" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="85" y="160" font-size="23" font-weight="760" fill="#285383">一　应用表面：目标、选项与结果消费</text><g font-size="18" text-anchor="middle" fill="#17324D"><rect x="105" y="181" width="260" height="38" rx="11" fill="#fff"/><text x="235" y="206">单次 query()</text><rect x="420" y="181" width="260" height="38" rx="11" fill="#fff"/><text x="550" y="206">交互 ClaudeSDKClient</text><rect x="735" y="181" width="260" height="38" rx="11" fill="#fff"/><text x="865" y="206">TypeScript 公开 API</text><rect x="1050" y="181" width="245" height="38" rx="11" fill="#fff"/><text x="1172" y="206">应用级评测适配器</text></g>
  <path d="M700 234v42" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <rect x="55" y="284" width="1290" height="198" rx="24" fill="#E7F5F3" stroke="#087F7C" stroke-width="3" filter="url(#s)"/><text x="85" y="323" font-size="24" font-weight="760" fill="#076663">二　Agent SDK 边界：应用进程中可见的协议适配</text>
  <rect x="92" y="348" width="750" height="108" rx="18" fill="#fff" stroke="#58AFA9" stroke-width="2"/><text x="122" y="380" font-size="21" font-weight="740" fill="#17324D">Python：锁定主体源码与测试</text><text x="122" y="411" font-size="17" fill="#50677D">入口 → InternalClient → Transport → Query</text><text x="122" y="439" font-size="17" fill="#50677D">消息数据面 + initialize／权限／Hook／MCP 控制面</text>
  <rect x="875" y="348" width="430" height="108" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="905" y="380" font-size="21" font-weight="740" fill="#955A00">TypeScript：主体源码不可用</text><text x="905" y="411" font-size="17" fill="#50677D">官方 API、README、CHANGELOG</text><text x="905" y="439" font-size="17" fill="#50677D">Session Store 示例；不推断 Runtime</text>
  <path d="M700 482v42" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <rect x="205" y="532" width="990" height="145" rx="25" fill="#F0EAF8" stroke="#76559B" stroke-width="3" stroke-dasharray="12 8" filter="url(#s)"/><text x="700" y="571" text-anchor="middle" font-size="24" font-weight="760" fill="#614482">三　Claude Code CLI：闭源产品边界</text><text x="700" y="608" text-anchor="middle" font-size="19" fill="#17324D">只描述官方公开能力、输入输出与可观察副作用</text><text x="700" y="640" text-anchor="middle" font-size="18" fill="#9A3E24">内部类、调度器、存储布局与注册算法：没有公开源码，不展开</text>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M420 677v64"/><path d="M700 677v64"/><path d="M980 677v64"/></g>
  <g font-size="18" text-anchor="middle"><rect x="140" y="750" width="370" height="100" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="325" y="785" font-weight="740" fill="#9A3E24">模型服务与外部 MCP</text><text x="325" y="817" fill="#50677D">请求、响应、远程工具与错误</text><rect x="535" y="750" width="330" height="100" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="700" y="785" font-weight="740" fill="#955A00">文件、进程与网络</text><text x="700" y="817" fill="#50677D">真实执行环境与副作用</text><rect x="890" y="750" width="370" height="100" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="1075" y="785" font-weight="740" fill="#285383">会话存储与独立评测</text><text x="1075" y="817" fill="#50677D">外部镜像 ≠ 运行时内存；评分另行完成</text></g>
  <rect x="55" y="885" width="1290" height="40" rx="12" fill="#17324D"/><text x="700" y="911" text-anchor="middle" font-size="17" fill="#fff">证据规则：官方文档约束产品契约；Python 源码约束 SDK 实现；TypeScript 公开材料不冒充主体源码</text></g>
</svg>
