<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Claude MCP、子智能体与技能能力装配</title><desc id="desc">应用把进程内 MCP、外部 MCP、子智能体定义和技能作为不同初始化输入；模型选择与权限通过后才进入各自运行路径，配置本身不证明执行。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="1000" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">配置描述能力，运行证据证明调用</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">MCP、子智能体与技能有不同的发现、进程、权限和生命周期</text>
  <rect x="55" y="130" width="1290" height="210" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="90" y="170" font-size="23" font-weight="760" fill="#285383">第一阶段：应用装配与初始化</text><g font-size="18" text-anchor="middle"><rect x="90" y="205" width="270" height="90" rx="17" fill="#fff" stroke="#7FA6D3"/><text x="225" y="240" font-weight="740" fill="#285383">MCP 服务端配置</text><text x="225" y="270" fill="#17324D">进程内／标准输入输出／网络</text><rect x="410" y="205" width="260" height="90" rx="17" fill="#fff" stroke="#7FA6D3"/><text x="540" y="240" font-weight="740" fill="#285383">子智能体定义</text><text x="540" y="270" fill="#17324D">提示／工具／模型／上限</text><rect x="720" y="205" width="260" height="90" rx="17" fill="#fff" stroke="#7FA6D3"/><text x="850" y="240" font-weight="740" fill="#285383">技能选择</text><text x="850" y="270" fill="#17324D">全部／名称列表／空列表</text><rect x="1030" y="205" width="275" height="90" rx="17" fill="#E7F5F3" stroke="#087F7C"/><text x="1167" y="240" font-weight="740" fill="#076663">初始化控制请求</text><text x="1167" y="270" fill="#17324D">只证明配置已发送</text></g><g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M360 250h42"/><path d="M670 250h42"/><path d="M980 250h42"/></g>
  <path d="M700 340v45" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><rect x="340" y="400" width="720" height="98" rx="22" fill="#17324D" filter="url(#s)"/><text x="700" y="438" text-anchor="middle" font-size="23" font-weight="760" fill="#fff">第二阶段：模型可见与运行决策</text><text x="700" y="473" text-anchor="middle" font-size="18" fill="#DCE8F2">发现／选择 → 钩子与权限 → 实际调用；任一步都可能不发生或失败</text>
  <g font-size="18"><rect x="55" y="555" width="395" height="255" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="90" y="595" font-size="22" font-weight="760" fill="#076663">进程内 SDK MCP</text><text x="90" y="634" fill="#17324D">CLI 控制协议／JSON-RPC</text><text x="90" y="670" fill="#17324D">内存桥／应用内处理器</text><text x="90" y="706" fill="#17324D">共享变量、凭据与故障域</text><text x="90" y="742" fill="#17324D">结果或错误回送模型循环</text><rect x="90" y="760" width="325" height="28" rx="10" fill="#D3EEE9"/><text x="252" y="780" text-anchor="middle" font-size="15" fill="#076663">不是独立工具进程</text>
  <rect x="502" y="555" width="395" height="255" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="537" y="595" font-size="22" font-weight="760" fill="#955A00">外部 MCP</text><text x="537" y="634" fill="#17324D">独立进程：标准输入输出</text><text x="537" y="670" fill="#17324D">远端服务：SSE／HTTP</text><text x="537" y="706" fill="#17324D">认证、网络、退出与清理</text><text x="537" y="742" fill="#17324D">连接成功不等于调用成功</text><rect x="537" y="760" width="325" height="28" rx="10" fill="#FBE6B7"/><text x="699" y="780" text-anchor="middle" font-size="15" fill="#955A00">工具名称仍需权限</text>
  <rect x="949" y="555" width="396" height="255" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5" filter="url(#s)"/><text x="984" y="595" font-size="22" font-weight="760" fill="#614482">子智能体与技能</text><text x="984" y="634" fill="#17324D">子智能体：独立子任务上下文</text><text x="984" y="670" fill="#17324D">技能：当前工作流加载指令</text><text x="984" y="706" fill="#17324D">工具、记忆、轮次与权限约束</text><text x="984" y="742" fill="#17324D">定义存在不等于已被选择</text><rect x="984" y="760" width="326" height="28" rx="10" fill="#E4D8F2"/><text x="1147" y="780" text-anchor="middle" font-size="15" fill="#614482">终态也不等于任务正确</text></g>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M500 498l-220 50"/><path d="M700 498v50"/><path d="M900 498l220 50"/></g>
  <rect x="140" y="865" width="1120" height="92" rx="20" fill="#17324D"/><text x="700" y="902" text-anchor="middle" font-size="21" font-weight="760" fill="#fff">完整证据链</text><text x="700" y="935" text-anchor="middle" font-size="18" fill="#DCE8F2">配置 → 初始化 → 模型可见 → 选择 → 权限 → 处理器／子任务 → 结果与副作用 → 独立评测</text>
  <text x="700" y="985" text-anchor="middle" font-size="20" font-weight="760" fill="#17324D">已注册 ≠ 已选择　已选择 ≠ 已执行　已执行 ≠ 已通过</text></g>
</svg>
