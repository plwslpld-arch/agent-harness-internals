<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" role="img" aria-labelledby="title desc">
  <title id="title">Claude 会话、镜像与恢复的数据权威边界</title><desc id="desc">当前主机先写本地会话转录，再批量镜像到外部存储；另一主机恢复时先把外部条目材料化到临时本地目录，分叉只改变对话历史而不复制工作树。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><marker id="o" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#C57A0B"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="1020" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">会话镜像是恢复副本，不是运行世界的快照</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">对话历史、工作树、模型上下文与外部存储分别拥有状态</text>
  <rect x="55" y="125" width="1290" height="300" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="90" y="165" font-size="23" font-weight="760" fill="#285383">主机甲：本地优先的运行与双写</text>
  <g font-size="18" text-anchor="middle"><rect x="90" y="205" width="230" height="86" rx="17" fill="#fff" stroke="#7FA6D3"/><text x="205" y="239" font-weight="740" fill="#285383">Claude Code CLI</text><text x="205" y="270" fill="#17324D">运行 Session</text><rect x="375" y="205" width="240" height="86" rx="17" fill="#fff" stroke="#7FA6D3"/><text x="495" y="239" font-weight="740" fill="#285383">本地 JSONL</text><text x="495" y="270" fill="#17324D">先成功写入</text><rect x="670" y="205" width="280" height="86" rx="17" fill="#E7F5F3" stroke="#087F7C"/><text x="810" y="239" font-weight="740" fill="#076663">转录镜像批处理器</text><text x="810" y="270" fill="#17324D">按文件合并／串行刷新</text><rect x="1005" y="205" width="300" height="86" rx="17" fill="#F0EAF8" stroke="#76559B"/><text x="1155" y="239" font-weight="740" fill="#614482">外部 Session Store</text><text x="1155" y="270" fill="#17324D">次级副本／可跨主机</text></g>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M320 248h47"/><path d="M615 248h47"/><path d="M950 248h47"/></g><text x="350" y="232" text-anchor="middle" font-size="15" fill="#50677D">本地写</text><text x="642" y="232" text-anchor="middle" font-size="15" fill="#50677D">镜像帧</text><text x="977" y="232" text-anchor="middle" font-size="15" fill="#50677D">批量追加</text>
  <rect x="90" y="330" width="360" height="62" rx="15" fill="#FFF2D4"/><text x="270" y="368" text-anchor="middle" font-size="17" fill="#955A00">Session 不包含工作树快照</text><rect x="505" y="330" width="370" height="62" rx="15" fill="#FFECE5"/><text x="690" y="368" text-anchor="middle" font-size="17" fill="#9A3E24">失败可缺批，运行仍继续</text><rect x="930" y="330" width="375" height="62" rx="15" fill="#E7F5F3"/><text x="1117" y="368" text-anchor="middle" font-size="17" fill="#076663">跨进程并发由适配器治理</text>
  <path d="M1155 425v58H202v89" stroke="#C57A0B" stroke-width="4" fill="none" marker-end="url(#o)"/><text x="680" y="466" text-anchor="middle" font-size="17" fill="#955A00">另一主机加载恢复副本</text>
  <rect x="55" y="500" width="1290" height="280" rx="24" fill="#17324D" filter="url(#s)"/><text x="90" y="542" font-size="23" font-weight="760" fill="#fff">主机乙：恢复材料化，不是远端直读</text>
  <g font-size="18" text-anchor="middle"><rect x="90" y="580" width="225" height="88" rx="17" fill="#F0EAF8"/><text x="202" y="615" font-weight="740" fill="#614482">外部条目</text><text x="202" y="646" fill="#17324D">主转录／子路径</text><rect x="365" y="580" width="260" height="88" rx="17" fill="#FFF2D4"/><text x="495" y="615" font-weight="740" fill="#955A00">父进程材料化</text><text x="495" y="646" fill="#17324D">校验 UUID／超时</text><rect x="675" y="580" width="300" height="88" rx="17" fill="#E7F5F3"/><text x="825" y="615" font-weight="740" fill="#076663">临时配置目录</text><text x="825" y="646" fill="#17324D">JSONL／受限认证副本</text><rect x="1025" y="580" width="280" height="88" rx="17" fill="#E9F2FF"/><text x="1165" y="615" font-weight="740" fill="#285383">本地 CLI 恢复</text><text x="1165" y="646" fill="#17324D">指定 ID／继续运行</text></g><g stroke="#8EE1D8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M315 624h42"/><path d="M625 624h42"/><path d="M975 624h42"/></g>
  <rect x="90" y="705" width="375" height="48" rx="13" fill="#FFECE5"/><text x="277" y="736" text-anchor="middle" font-size="17" fill="#9A3E24">临时目录结束后尽力清理</text><rect x="512" y="705" width="376" height="48" rx="13" fill="#FFF2D4"/><text x="700" y="736" text-anchor="middle" font-size="17" fill="#955A00">恢复对话，不恢复文件系统</text><rect x="935" y="705" width="370" height="48" rx="13" fill="#E7F5F3"/><text x="1120" y="736" text-anchor="middle" font-size="17" fill="#076663">新条目再次本地写后镜像</text>
  <g font-size="18"><rect x="55" y="830" width="395" height="135" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="90" y="869" font-size="22" font-weight="760" fill="#285383">会话选择</text><text x="90" y="905" fill="#17324D">最近会话／指定 ID／分叉点</text><text x="90" y="937" fill="#17324D">分叉只产生独立对话历史</text><rect x="502" y="830" width="395" height="135" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="537" y="869" font-size="22" font-weight="760" fill="#955A00">适配器责任</text><text x="537" y="905" fill="#17324D">幂等／事务或 CAS／保留</text><text x="537" y="937" fill="#17324D">租户隔离／加密／错误告警</text><rect x="949" y="830" width="396" height="135" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="984" y="869" font-size="22" font-weight="760" fill="#614482">独立 Eval</text><text x="984" y="905" fill="#17324D">绑定 Session、分叉点、文件哈希</text><text x="984" y="937" fill="#17324D">恢复成功不等于环境一致</text></g>
  <text x="700" y="998" text-anchor="middle" font-size="20" font-weight="760" fill="#17324D">本地转录 ≠ 外部镜像 ≠ 当前 Context ≠ 工作树</text></g>
</svg>
