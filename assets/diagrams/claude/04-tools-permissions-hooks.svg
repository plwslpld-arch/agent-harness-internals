<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Claude 工具、权限与 Hook 分层架构</title><desc id="desc">工具定义先决定模型可见性，工具请求再经过 Hook、拒绝与询问规则、权限模式、允许规则和回调，最后进入执行与系统隔离；审批不等于执行成功。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="980" rx="34" fill="#F6F9FC"/>
  <g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">工具存在、权限批准与安全执行是三条边界</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">越过前一层不代表越过后一层；每层都要保留决定与证据</text>
  <rect x="55" y="130" width="1290" height="150" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="90" y="168" font-size="23" font-weight="760" fill="#285383">第一层：工具定义与模型可见性</text><g font-size="18" text-anchor="middle"><rect x="95" y="194" width="280" height="58" rx="15" fill="#fff" stroke="#7FA6D3"/><text x="235" y="230" fill="#17324D">内置工具／MCP 工具</text><rect x="430" y="194" width="320" height="58" rx="15" fill="#fff" stroke="#7FA6D3"/><text x="590" y="230" fill="#17324D">裸名拒绝：移除定义</text><rect x="805" y="194" width="470" height="58" rx="15" fill="#fff" stroke="#7FA6D3"/><text x="1040" y="230" fill="#17324D">范围拒绝：工具仍可见，匹配调用阻止</text></g>
  <text x="700" y="322" text-anchor="middle" font-size="22" font-weight="760" fill="#17324D">模型生成工具名与完整参数</text><path d="M700 280v28" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <rect x="55" y="350" width="1290" height="310" rx="24" fill="#17324D" filter="url(#s)"/><text x="90" y="390" font-size="23" font-weight="760" fill="#fff">第二层：公开权限判定顺序</text>
  <g font-size="17" text-anchor="middle"><rect x="90" y="430" width="175" height="86" rx="16" fill="#E7F5F3"/><text x="177" y="463" font-weight="740" fill="#076663">① PreToolUse</text><text x="177" y="492" fill="#17324D">拒绝／询问／改写</text><rect x="300" y="430" width="150" height="86" rx="16" fill="#FFECE5"/><text x="375" y="463" font-weight="740" fill="#9A3E24">② 拒绝</text><text x="375" y="492" fill="#17324D">命中即阻止</text><rect x="485" y="430" width="150" height="86" rx="16" fill="#FFF2D4"/><text x="560" y="463" font-weight="740" fill="#955A00">③ 询问</text><text x="560" y="492" fill="#17324D">导向确认</text><rect x="670" y="430" width="200" height="86" rx="16" fill="#F0EAF8"/><text x="770" y="463" font-weight="740" fill="#614482">④ 权限模式</text><text x="770" y="492" fill="#17324D">自动批准或继续</text><rect x="905" y="430" width="150" height="86" rx="16" fill="#E7F5F3"/><text x="980" y="463" font-weight="740" fill="#076663">⑤ 允许</text><text x="980" y="492" fill="#17324D">匹配才批准</text><rect x="1090" y="430" width="220" height="86" rx="16" fill="#E9F2FF"/><text x="1200" y="463" font-weight="740" fill="#285383">⑥ can_use_tool</text><text x="1200" y="492" fill="#17324D">只处理未决调用</text></g>
  <g stroke="#8EE1D8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M265 473h27"/><path d="M450 473h27"/><path d="M635 473h27"/><path d="M870 473h27"/><path d="M1055 473h27"/></g>
  <rect x="90" y="552" width="585" height="76" rx="16" fill="#FFF2D4"/><text x="382" y="582" text-anchor="middle" font-size="18" font-weight="740" fill="#955A00">自动批准会绕过回调</text><text x="382" y="610" text-anchor="middle" font-size="17" fill="#17324D">bypassPermissions 不受 allowed_tools 收口</text><rect x="725" y="552" width="585" height="76" rx="16" fill="#FFECE5"/><text x="1017" y="582" text-anchor="middle" font-size="18" font-weight="740" fill="#9A3E24">Hook 放行不是最终许可</text><text x="1017" y="610" text-anchor="middle" font-size="17" fill="#17324D">后续拒绝、询问与关键路径保护仍执行</text>
  <path d="M700 660v35" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <g font-size="18"><rect x="55" y="715" width="395" height="175" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="90" y="754" font-size="22" font-weight="760" fill="#076663">第三层：控制响应</text><text x="90" y="792" fill="#17324D">允许：可替换完整输入</text><text x="90" y="826" fill="#17324D">更新：规则／模式／目录建议</text><text x="90" y="860" fill="#17324D">拒绝：原因／可选 Interrupt</text>
  <rect x="502" y="715" width="395" height="175" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="537" y="754" font-size="22" font-weight="760" fill="#955A00">第四层：隔离执行</text><text x="537" y="792" fill="#17324D">Sandbox／系统权限／网络</text><text x="537" y="826" fill="#17324D">工具实现／外部服务／进程</text><text x="537" y="860" fill="#17324D">仍可能返回错误或部分副作用</text>
  <rect x="949" y="715" width="396" height="175" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5" filter="url(#s)"/><text x="984" y="754" font-size="22" font-weight="760" fill="#614482">第五层：证据与 Eval</text><text x="984" y="792" fill="#17324D">Artifact 保存决定与副作用</text><text x="984" y="826" fill="#17324D">Scorer 独立判断目标与安全</text><text x="984" y="860" fill="#17324D">审批结果不直接充当评分</text></g>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M450 802h44"/><path d="M897 802h44"/></g>
  <text x="700" y="940" text-anchor="middle" font-size="21" font-weight="760" fill="#17324D">批准 ≠ 隔离　允许 ≠ 已执行　零退出 ≠ Eval 通过</text></g>
</svg>
