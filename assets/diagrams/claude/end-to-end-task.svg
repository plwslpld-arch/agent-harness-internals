<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude Python SDK 端到端任务协议流程</title><desc id="desc">应用输入经过会话材料化、Transport 连接、控制初始化、用户消息、闭源 CLI 和双向控制，最终产出消息并清理，再进入独立评测。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">一次 Python SDK 任务：消息流与控制流必须同时活着</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">默认子进程路径；自定义 Transport 和真实 CLI 版本必须另行记录</text>
  <rect x="65" y="122" width="1270" height="92" rx="21" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="95" y="157" font-size="21" font-weight="760" fill="#285383">输入目标</text><text x="230" y="157" font-size="20" fill="#17324D">检查项目并说明测试失败原因</text><text x="95" y="190" font-size="17" fill="#50677D">同时固定 cwd、权限模式、Session 选项、MCP、Hook 与实际 CLI 版本</text>
  <g font-size="17" text-anchor="middle"><rect x="55" y="274" width="160" height="86" rx="17" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="135" y="306" font-weight="740" fill="#17324D">一　入口</text><text x="135" y="335" fill="#50677D">query／Client</text><rect x="245" y="274" width="180" height="86" rx="17" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="335" y="306" font-weight="740" fill="#955A00">二　恢复材料化</text><text x="335" y="335" fill="#50677D">可选临时目录</text><rect x="455" y="274" width="180" height="86" rx="17" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="545" y="306" font-weight="740" fill="#076663">三　连接</text><text x="545" y="335" fill="#50677D">Transport／CLI</text><rect x="665" y="274" width="180" height="86" rx="17" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="755" y="306" font-weight="740" fill="#076663">四　初始化</text><text x="755" y="335" fill="#50677D">control_request</text><rect x="875" y="274" width="180" height="86" rx="17" fill="#F0EAF8" stroke="#76559B" stroke-width="2"/><text x="965" y="306" font-weight="740" fill="#614482">五　用户消息</text><text x="965" y="335" fill="#50677D">NDJSON 写入</text><rect x="1085" y="274" width="260" height="86" rx="17" fill="#FFECE5" stroke="#C96138" stroke-width="2" stroke-dasharray="9 6"/><text x="1215" y="306" font-weight="740" fill="#9A3E24">六　闭源 CLI 运行</text><text x="1215" y="335" fill="#50677D">模型、工具、Session</text></g>
  <g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M215 317h22"/><path d="M425 317h22"/><path d="M635 317h22"/><path d="M845 317h22"/><path d="M1055 317h22"/></g>
  <rect x="155" y="424" width="1090" height="150" rx="23" fill="#17324D" filter="url(#s)"/><text x="195" y="461" font-size="22" font-weight="760" fill="#fff">运行期间的双向协议</text><text x="195" y="496" font-size="18" fill="#DCE8F2">消息数据面：系统消息、Assistant 内容、流事件、工具活动、Result</text><text x="195" y="531" font-size="18" fill="#8EE1D8">控制面：权限、Hook、进程内 MCP、Interrupt　CLI 请求 → SDK 回调 → 匹配响应</text><path d="M1185 480H930" stroke="#8EE1D8" stroke-width="4" marker-end="url(#a)"/><path d="M930 538h255" stroke="#DCE8F2" stroke-width="4" marker-end="url(#a)"/>
  <g font-size="18" text-anchor="middle"><rect x="155" y="630" width="320" height="108" rx="20" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="315" y="669" font-weight="740" fill="#076663">七　解析并产出 Message</text><text x="315" y="701" fill="#50677D">已知帧转换；未知类型跳过</text><rect x="540" y="630" width="320" height="108" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="700" y="669" font-weight="740" fill="#955A00">八　关闭与凭据清理</text><text x="700" y="701" fill="#50677D">先关 Query／进程，再删临时目录</text><rect x="925" y="630" width="320" height="108" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1085" y="669" font-weight="740" fill="#9A3E24">九　独立 Eval</text><text x="1085" y="701" fill="#50677D">目标产物、约束与副作用评分</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M475 684h57"/><path d="M860 684h57"/></g>
  <rect x="155" y="785" width="1090" height="72" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2"/><text x="700" y="816" text-anchor="middle" font-size="19" font-weight="740" fill="#614482">关键终态不能合并</text><text x="700" y="844" text-anchor="middle" font-size="17" fill="#50677D">Result ≠ 输入结束 ≠ 迭代器结束 ≠ 进程退出 ≠ 任务正确 ≠ Eval 通过</text>
  </g>
</svg>
