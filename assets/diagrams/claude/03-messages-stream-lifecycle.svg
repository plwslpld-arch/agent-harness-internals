<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Claude 消息流与生命周期状态</title><desc id="desc">CLI 原始帧经过内部路由和消息解析；Result、输入结束、迭代结束、Interrupt、关闭、进程退出与独立评测保持不同边界。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="930" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">Result 是协议观察点，不是整条任务的质量判决</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">每个结束动作都要写清对象、方向与仍然存活的资源</text>
  <g font-size="18" text-anchor="middle"><rect x="65" y="140" width="220" height="92" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="175" y="176" font-weight="740" fill="#285383">CLI 原始帧</text><text x="175" y="206" fill="#50677D">消息／控制／镜像</text><rect x="340" y="140" width="250" height="92" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="465" y="176" font-weight="740" fill="#076663">Query 内部路由</text><text x="465" y="206" fill="#50677D">控制配对、任务、错误</text><rect x="645" y="140" width="250" height="92" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="770" y="176" font-weight="740" fill="#076663">消息解析</text><text x="770" y="206" fill="#50677D">已知类型／未知跳过</text><rect x="950" y="140" width="385" height="92" rx="18" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="1142" y="176" font-weight="740" fill="#614482">应用消息流</text><text x="1142" y="206" fill="#50677D">User／Assistant／System／Result／事件</text></g><g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M285 186h47"/><path d="M590 186h47"/><path d="M895 186h47"/></g>
  <rect x="65" y="292" width="1270" height="180" rx="24" fill="#17324D" filter="url(#s)"/><text x="100" y="333" font-size="23" font-weight="760" fill="#fff">包含后台任务的两个 Result</text><g font-size="18" text-anchor="middle"><text x="155" y="390" fill="#DCE8F2">任务开始</text><text x="425" y="390" fill="#DCE8F2">中间 Result</text><text x="700" y="390" fill="#8EE1D8">任务终态</text><text x="970" y="390" fill="#DCE8F2">最终 Result</text><text x="1240" y="390" fill="#DCE8F2">结束输入</text></g><g stroke="#8EE1D8" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M225 404h125"/><path d="M500 404h125"/><path d="M775 404h125"/><path d="M1045 404h125"/></g><text x="425" y="446" text-anchor="middle" font-size="17" fill="#FFCA70">仍有任务：标准输入保持打开</text><text x="970" y="446" text-anchor="middle" font-size="17" fill="#8EE1D8">无在途任务：等待者才被唤醒</text>
  <g font-size="18"><rect x="65" y="530" width="400" height="210" rx="22" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="100" y="570" font-size="22" font-weight="760" fill="#285383">消息类型回答“看到了什么”</text><text x="100" y="610" fill="#17324D">AssistantMessage：内容与模型响应</text><text x="100" y="646" fill="#17324D">SystemMessage：任务与生命周期</text><text x="100" y="682" fill="#17324D">StreamEvent：增量投影</text><text x="100" y="718" fill="#17324D">RateLimitEvent：配额状态变化</text>
  <rect x="500" y="530" width="400" height="210" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="535" y="570" font-size="22" font-weight="760" fill="#955A00">生命周期回答“结束了什么”</text><text x="535" y="610" fill="#17324D">Result：回合或运行协议边界</text><text x="535" y="646" fill="#17324D">结束输入：不再发送用户帧</text><text x="535" y="682" fill="#17324D">迭代结束：接收流已排空</text><text x="535" y="718" fill="#17324D">关闭：释放连接级资源</text>
  <rect x="935" y="530" width="400" height="210" rx="22" fill="#FFECE5" stroke="#C96138" stroke-width="2.5" filter="url(#s)"/><text x="970" y="570" font-size="22" font-weight="760" fill="#9A3E24">动作与判决不能混用</text><text x="970" y="610" fill="#17324D">Interrupt：取消当前运行</text><text x="970" y="646" fill="#17324D">进程退出：Transport 终态</text><text x="970" y="682" fill="#17324D">Result success：协议字段</text><text x="970" y="718" fill="#17324D">Eval 通过：独立 Scorer 判决</text></g>
  <rect x="140" y="790" width="1120" height="92" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="700" y="827" text-anchor="middle" font-size="21" font-weight="760" fill="#614482">必须保存的证据链</text><text x="700" y="860" text-anchor="middle" font-size="18" fill="#50677D">原始类型序列 → Result 全字段 → Interrupt／异常／退出 → 目标产物与副作用 → 独立评分</text></g>
</svg>
