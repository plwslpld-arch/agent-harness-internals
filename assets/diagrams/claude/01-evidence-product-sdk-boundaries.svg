<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Claude 产品与双 SDK 证据边界</title><desc id="desc">官方文档、Python 源码、TypeScript 公开材料、树清单和许可证分别约束不同结论，课程推断不能跨越闭源边界。</desc>
  <defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17324D" flood-opacity=".13"/></filter></defs>
  <rect width="1400" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="700" y="54" text-anchor="middle" font-size="36" font-weight="760" fill="#17324D">先问证据属于哪一层，再问结论能写多远</text><text x="700" y="88" text-anchor="middle" font-size="18" fill="#50677D">公开可读、源码可见、行为可测与许可证可用是四个不同问题</text>
  <g font-size="18"><rect x="55" y="132" width="400" height="160" rx="22" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5" filter="url(#s)"/><text x="85" y="170" font-size="22" font-weight="760" fill="#614482">一　Claude Code 官方文档</text><text x="85" y="206" fill="#17324D">证明：产品定位、公开能力、使用约束</text><text x="85" y="239" fill="#9A3E24">不证明：闭源内部类、算法、存储布局</text><text x="85" y="270" fill="#50677D">记录页面标题、链接与访问日期</text>
  <rect x="500" y="132" width="400" height="160" rx="22" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5" filter="url(#s)"/><text x="530" y="170" font-size="22" font-weight="760" fill="#076663">二　Python SDK 锁定源码</text><text x="530" y="206" fill="#17324D">证明：入口、传输、控制协议与测试</text><text x="530" y="239" fill="#9A3E24">不证明：Claude Code 或 TypeScript 内部</text><text x="530" y="270" fill="#50677D">MIT 只覆盖该仓库对应内容</text>
  <rect x="945" y="132" width="400" height="160" rx="22" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5" filter="url(#s)"/><text x="975" y="170" font-size="22" font-weight="760" fill="#955A00">三　TypeScript 公开材料</text><text x="975" y="206" fill="#17324D">证明：API、变更记录、条款与示例</text><text x="975" y="239" fill="#9A3E24">主体源码：该锁定树中不可用</text><text x="975" y="270" fill="#50677D">商业条款不能被 Python MIT 替代</text></g>
  <g stroke="#087F7C" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M255 292v72"/><path d="M700 292v72"/><path d="M1145 292v72"/></g>
  <rect x="110" y="372" width="1180" height="138" rx="24" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5" filter="url(#s)"/><text x="145" y="410" font-size="22" font-weight="760" fill="#285383">四　证据登记：句子、版本、表面、平台、模式与限制</text><text x="145" y="448" font-size="18" fill="#17324D">源码锚点 + 上游测试 + 官方文档 + 锁定树清单；缺失项明确标为不可用或未知</text><text x="145" y="482" font-size="18" fill="#50677D">树清单只约束当前提交；测试只约束夹具；文档只约束公开契约</text>
  <path d="M700 510v62" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/>
  <rect x="205" y="580" width="990" height="138" rx="24" fill="#17324D" filter="url(#s)"/><text x="700" y="621" text-anchor="middle" font-size="23" font-weight="760" fill="#fff">五　课程结论与架构投影</text><text x="700" y="659" text-anchor="middle" font-size="18" fill="#DCE8F2">直接事实写所属层；跨层组合写推断桥梁；无证据机制保持未知</text><text x="700" y="692" text-anchor="middle" font-size="18" fill="#8EE1D8">同名 API ≠ 实现同构　公开能力 ≠ 内部源码　许可证 ≠ 质量证明</text>
  <g font-size="18" text-anchor="middle"><rect x="110" y="770" width="360" height="82" rx="18" fill="#E7F5F3" stroke="#087F7C" stroke-width="2"/><text x="290" y="803" font-weight="740" fill="#076663">可发布</text><text x="290" y="831" fill="#50677D">有版本、有锚点、有边界</text><rect x="520" y="770" width="360" height="82" rx="18" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2"/><text x="700" y="803" font-weight="740" fill="#955A00">需要降级</text><text x="700" y="831" fill="#50677D">只有间接材料或平台未验证</text><rect x="930" y="770" width="360" height="82" rx="18" fill="#FFECE5" stroke="#C96138" stroke-width="2"/><text x="1110" y="803" font-weight="740" fill="#9A3E24">禁止发布</text><text x="1110" y="831" fill="#50677D">SDK 反推产品或文档冒充源码</text></g></g>
</svg>
