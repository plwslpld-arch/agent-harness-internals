<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Agent harness and eval harness coupling</title>
  <desc id="desc">A model is controlled by an agent harness inside an environment, while an eval harness defines trials, captures artifacts, and scores outcomes</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="520" rx="28" fill="#f8fafc"/>
  <text x="60" y="62" fill="#0f172a" font-size="28" font-family="Arial, sans-serif" font-weight="700">Two harnesses jointly produce one score</text>
  <rect x="70" y="110" width="650" height="330" rx="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/>
  <text x="105" y="150" fill="#075985" font-size="22" font-family="Arial, sans-serif" font-weight="700">AGENT HARNESS · execution controller</text>
  <rect x="120" y="195" width="190" height="110" rx="18" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
  <text x="215" y="240" text-anchor="middle" fill="#0f172a" font-size="22" font-family="Arial, sans-serif" font-weight="700">MODEL</text>
  <text x="215" y="270" text-anchor="middle" fill="#475569" font-size="15" font-family="Arial, sans-serif">stochastic policy</text>
  <rect x="455" y="195" width="210" height="110" rx="18" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
  <text x="560" y="240" text-anchor="middle" fill="#0f172a" font-size="22" font-family="Arial, sans-serif" font-weight="700">ENVIRONMENT</text>
  <text x="560" y="270" text-anchor="middle" fill="#475569" font-size="15" font-family="Arial, sans-serif">tools · files · services</text>
  <path d="M310 228H450" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="380" y="216" text-anchor="middle" fill="#475569" font-size="14" font-family="Arial, sans-serif">action</text>
  <path d="M455 280H315" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="385" y="301" text-anchor="middle" fill="#475569" font-size="14" font-family="Arial, sans-serif">observation</text>
  <text x="120" y="365" fill="#075985" font-size="17" font-family="Arial, sans-serif">context · tools · permissions · retry · session · stop</text>
  <rect x="775" y="110" width="355" height="330" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="3" filter="url(#shadow)"/>
  <text x="810" y="150" fill="#9a3412" font-size="22" font-family="Arial, sans-serif" font-weight="700">EVAL HARNESS · evidence contract</text>
  <g font-family="Arial, sans-serif" font-size="17">
    <rect x="820" y="190" width="265" height="50" rx="12" fill="#fff" stroke="#fb923c"/><text x="952" y="222" text-anchor="middle" fill="#0f172a">Task + environment</text>
    <rect x="820" y="260" width="265" height="50" rx="12" fill="#fff" stroke="#fb923c"/><text x="952" y="292" text-anchor="middle" fill="#0f172a">Trial + Attempt policy</text>
    <rect x="820" y="330" width="265" height="50" rx="12" fill="#fff" stroke="#fb923c"/><text x="952" y="362" text-anchor="middle" fill="#0f172a">Artifacts + scorer</text>
  </g>
  <path d="M775 215H727" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M727 360H775" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="750" y="198" text-anchor="middle" fill="#475569" font-size="14" font-family="Arial, sans-serif">spec</text>
  <text x="750" y="388" text-anchor="middle" fill="#475569" font-size="14" font-family="Arial, sans-serif">trace</text>
  <rect x="330" y="465" width="540" height="40" rx="20" fill="#0f172a"/>
  <text x="600" y="491" text-anchor="middle" fill="#fff" font-size="18" font-family="Arial, sans-serif" font-weight="700">SCORE = f(model, both harnesses, env)</text>
</svg>
