name: 上游漂移检查

# 结论绑在固定 commit 上，上游怎么变都不会让 Verify 变红。代价是漂移无声。
# 这个 workflow 每周量一次差距，超过阈值就让 job 失败，把「该重新锁定了」
# 变成一件收得到通知的事。它不参与 PR 门禁，只做体检。
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      maxAnchorRatio:
        description: 锚点受影响比例上限，超过即失败
        required: false
        default: '0.25'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
      - name: 配置 Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: 准备锁定来源
        run: npm run bootstrap
      - name: 测量上游漂移
        run: node scripts/check-drift.mjs --fetch --write
      - name: 写入任务摘要
        if: always()
        run: cat research/drift/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: 检查漂移阈值
        run: node scripts/check-drift.mjs --max-anchor-ratio "${{ inputs.maxAnchorRatio || '0.25' }}"
