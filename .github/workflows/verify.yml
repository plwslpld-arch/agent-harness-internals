name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Bootstrap fixed source checkouts
        run: npm run bootstrap
      - name: Verify sources and generated evidence
        run: npm run sources:verify
      - name: Run repository checks
        run: npm run check

  publish-index:
    # 源码索引不入主干：合并到 main 后重新生成并强推到 gh-pages 孤儿分支，
    # 避免 16.9MB 的 symbols.md 每次刷新都在主干历史里留一个新 blob。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Bootstrap fixed source checkouts
        run: npm run bootstrap
      - name: Generate source index
        run: npm run catalogs:generate
      - name: Publish source index to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages
          mkdir .pages
          cp .generated/*.md .pages/
          printf '%s\n' '*.md linguist-generated=true' > .pages/.gitattributes
          {
            printf '# DeepSeek Harness 源码索引\n\n'
            printf '由 `npm run catalogs:generate` 从锁定的上游 checkout 生成，对应主干 commit `%s`。\n\n' "$GITHUB_SHA"
            printf '索引范围只含分析对象 `deepseek-harness` 与它 vendored 的 `cordis`。'
            printf '其余 13 个对照仓库的 commit 记录在主干 `sources/sources.lock.yml`，不做文件级索引。\n\n'
            printf '人工深度分析在主干分支 [`docs/`](https://github.com/%s/tree/main/docs)，本分支只放机器索引。\n\n' "$GITHUB_REPOSITORY"
            printf '## 文件\n\n'
            printf '| 索引 | 体积 | 浏览器可读 |\n|---|---:|---|\n'
            for file in .pages/*.md; do
              name="$(basename "$file")"
              [ "$name" = 'index.md' ] && continue
              bytes="$(wc -c < "$file" | tr -d ' ')"
              mb="$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')"
              if [ "$bytes" -gt 1048576 ]; then
                note="否，用 [raw](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/gh-pages/$name) 或 clone 后 grep"
              else
                note="[是]($name)"
              fi
              printf -- '| `%s` | %s MB | %s |\n' "$name" "$mb" "$note"
            done
            printf '\n> 全部索引都控制在 GitHub 的 1MB Markdown 渲染阈值以内：路径以纯文本给出（链接构造规则见每份索引开头），'
            printf '文件卡片按顶层目录分区。它们仍是机器索引，主要用途是 grep 与程序消费。\n\n'
            printf '```bash\n'
            printf '# 全量拉下来 grep\n'
            printf 'git clone --branch gh-pages --depth 1 https://github.com/%s.git dsh-index\n' "$GITHUB_REPOSITORY"
            printf 'grep -n "ReactLoopAgent" dsh-index/symbols.md\n'
            printf '```\n'
          } > .pages/index.md
          cd .pages
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "chore(index): publish source index for ${GITHUB_SHA}"
          # 凭据走 header 而不是 URL：URL 内嵌凭据会被 scan-secrets 正确拦下。
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${AUTH}" \
            push -q --force "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages
