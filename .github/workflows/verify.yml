name: 仓库验证

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: 配置 Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: 准备锁定来源
        run: npm run bootstrap -- --profile all
      - name: 运行仓库检查
        run: npm run check
      - name: 核对论断台账
        run: npm run check:claims
      - name: 正文节奏门禁（仅本次改动的文档）
        run: python3 scripts/check_prose.py --changed
      - name: 配置 Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei
      - name: 安装文档站依赖
        run: |
          python -m pip install "mkdocs-material>=9.6,<10"
          python -m pip install -r scripts/requirements-pdf.txt
      - name: 构建离线 PDF
        run: python scripts/build_pdf.py --output docs/downloads/agent-harness-internals-cn.pdf
      - name: 严格构建中文站点
        run: mkdocs build --strict
      - name: 配置 GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: 上传站点产物
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
