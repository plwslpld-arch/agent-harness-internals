name: 仓库验证

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - name: 配置 Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: 准备锁定来源
        run: npm run bootstrap -- --profile all
      - name: 运行仓库检查
        run: npm run check
      - name: 正文节奏门禁（仅本次改动的文档）
        run: python3 scripts/check_prose.py --changed
