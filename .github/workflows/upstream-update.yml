name: Check upstream sources

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: upstream-source-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - name: Bootstrap current fixed sources
        run: npm run bootstrap
      - name: Resolve upstream heads and build impact report
        run: npm run sources:update
      - name: Detect updates
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- sources/sources.lock.yml; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh updated checkouts, licenses, and catalogs
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run bootstrap
          node scripts/verify-licenses.mjs --update-lock
          npm run catalogs:generate
          npm run sources:verify
          npm run check
      - name: Create or update review-only pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/upstream-sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$UPDATE_BRANCH"
          git add sources/checkouts sources/sources.lock.yml sources/upstream-update.json sources/upstream-update.md sources/stale-documents.md docs
          git commit -m 'chore(sources): propose upstream baseline update'
          git push --force-with-lease origin "$UPDATE_BRANCH"
          UPDATE_SHA="$(git rev-parse HEAD)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${UPDATE_SHA}" \
            -f state=success \
            -f context=verify \
            -f description='full repository checks passed in upstream updater' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh pr view "$UPDATE_BRANCH" >/dev/null 2>&1; then
            gh pr edit "$UPDATE_BRANCH" --title 'chore(sources): review upstream baseline update' --body-file sources/upstream-update.md
          else
            gh pr create --base main --head "$UPDATE_BRANCH" --title 'chore(sources): review upstream baseline update' --body-file sources/upstream-update.md
          fi
          for attempt in {1..12}; do
            PR_RUN="$(gh run list --branch "$UPDATE_BRANCH" --event pull_request --limit 10 \
              --json databaseId,headSha,conclusion \
              --jq ".[] | select(.headSha == \"$UPDATE_SHA\") | [.databaseId, .conclusion] | @tsv" | head -n 1)"
            if [[ -n "$PR_RUN" ]]; then
              IFS=$'\t' read -r PR_RUN_ID PR_RUN_CONCLUSION <<< "$PR_RUN"
              if [[ "$PR_RUN_CONCLUSION" == 'action_required' ]]; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${PR_RUN_ID}/approve"
              fi
              break
            fi
            sleep 5
          done
