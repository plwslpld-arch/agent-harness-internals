<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">OpenCode 服务核心与多表面架构</title><desc id="desc">项目配置与模型服务进入会话循环，工具权限、存储恢复和事件作为共享核心；终端、服务器、开发包、桌面网页和编辑器协议是不同投影表面。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker></defs><rect width="1500" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">共享服务核心负责行动，多种客户端只投影不同表面</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">包存在不等于路径被调用，界面完成也不等于任务正确</text>
<g font-size="19" text-anchor="middle"><rect x="55" y="145" width="260" height="100" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="185" y="184" font-weight="760" fill="#244F81">项目与实例上下文</text><text x="185" y="218" fill="#17324D">目录、数据库、运行作用域</text><rect x="370" y="145" width="260" height="100" rx="20" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="500" y="184" font-weight="760" fill="#244F81">配置与智能体</text><text x="500" y="218" fill="#17324D">指令、模型、权限、扩展</text><rect x="685" y="145" width="260" height="100" rx="20" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="815" y="184" font-weight="760" fill="#955A00">模型服务</text><text x="815" y="218" fill="#17324D">目录、认证、接口适配</text><rect x="1000" y="145" width="445" height="100" rx="20" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1222" y="184" font-weight="760" fill="#9A3E24">默认执行边界</text><text x="1222" y="218" fill="#17324D">权限决策后仍继承宿主进程能力</text></g>
<g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M315 195h47"/><path d="M630 195h47"/><path d="M945 195h47"/></g>
<rect x="185" y="325" width="1130" height="245" rx="28" fill="#E7F5F3" stroke="#087F7C" stroke-width="3"/><text x="750" y="366" text-anchor="middle" font-size="25" font-weight="760" fill="#076663">共享会话服务核心</text><g font-size="18" text-anchor="middle"><rect x="225" y="405" width="220" height="105" rx="18" fill="#FFFFFF"/><text x="335" y="442" font-weight="760" fill="#17324D">会话提示装配</text><text x="335" y="475" fill="#50677D">消息、系统信息、工具</text><rect x="505" y="405" width="220" height="105" rx="18" fill="#FFFFFF"/><text x="615" y="442" font-weight="760" fill="#17324D">模型流</text><text x="615" y="475" fill="#50677D">文本、推理、调用、用量</text><rect x="785" y="405" width="220" height="105" rx="18" fill="#FFFFFF"/><text x="895" y="442" font-weight="760" fill="#17324D">流处理器</text><text x="895" y="475" fill="#50677D">继续、压缩、停止</text><rect x="1065" y="405" width="210" height="105" rx="18" fill="#FFFFFF"/><text x="1170" y="442" font-weight="760" fill="#17324D">工具与权限</text><text x="1170" y="475" fill="#50677D">询问、执行、副作用</text></g><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M445 458h52"/><path d="M725 458h52"/><path d="M1005 458h52"/></g>
<rect x="185" y="620" width="1130" height="82" rx="20" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="750" y="654" text-anchor="middle" font-size="21" font-weight="760" fill="#5B3D7D">横切状态：数据库消息　压缩摘要　文件快照与回退　事件桥接　遥测</text><text x="750" y="683" text-anchor="middle" font-size="16" fill="#50677D">它们互相引用，但不是同一份任务真相</text>
<g font-size="17" text-anchor="middle"><rect x="55" y="775" width="220" height="72" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="165" y="819" fill="#17324D">命令行与终端</text><rect x="335" y="775" width="220" height="72" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="445" y="819" fill="#17324D">服务器与事件流</text><rect x="615" y="775" width="220" height="72" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="725" y="819" fill="#17324D">类型化开发包</text><rect x="895" y="775" width="220" height="72" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="1005" y="819" fill="#17324D">桌面与网页</text><rect x="1175" y="775" width="270" height="72" rx="18" fill="#E9F2FF" stroke="#3569A8" stroke-width="2"/><text x="1310" y="819" fill="#17324D">编辑器智能体协议</text></g><g fill="none" stroke="#087F7C" stroke-width="3" marker-end="url(#a)"><path d="M300 708v45h-135v14"/><path d="M520 708v45h-75v14"/><path d="M750 708v59"/><path d="M980 708v45h25v14"/><path d="M1200 708v45h110v14"/></g></g></svg>

