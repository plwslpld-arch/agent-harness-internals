<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">OpenCode 端到端任务循环</title><desc id="desc">项目和配置选择模型与会话，模型流经处理器产生文本或工具调用，权限决定是否执行，工具结果回送模型；消息、文件和轨迹最终交给独立评分。</desc><defs><marker id="a" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#087F7C"/></marker><marker id="b" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0 0l14 7-14 7z" fill="#C96138"/></marker></defs><rect width="1500" height="900" rx="34" fill="#F6F9FC"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="750" y="55" text-anchor="middle" font-size="34" font-weight="760" fill="#17324D">工具结果必须回送模型，任务结果必须再交给独立评分</text><text x="750" y="91" text-anchor="middle" font-size="18" fill="#50677D">停止字段、会话空闲和客户端完成都只是不同控制层的状态</text>
<g font-size="18" text-anchor="middle"><rect x="50" y="155" width="190" height="100" rx="19" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="145" y="193" font-weight="760" fill="#244F81">一　固定上下文</text><text x="145" y="225" fill="#17324D">项目、配置、会话</text><rect x="290" y="155" width="190" height="100" rx="19" fill="#E9F2FF" stroke="#3569A8" stroke-width="2.5"/><text x="385" y="193" font-weight="760" fill="#244F81">二　装配请求</text><text x="385" y="225" fill="#17324D">消息、指令、工具</text><rect x="530" y="155" width="190" height="100" rx="19" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="625" y="193" font-weight="760" fill="#955A00">三　模型流</text><text x="625" y="225" fill="#17324D">文本或工具调用</text><rect x="770" y="155" width="190" height="100" rx="19" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="865" y="193" font-weight="760" fill="#5B3D7D">四　处理事件</text><text x="865" y="225" fill="#17324D">写入消息分片</text><rect x="1010" y="155" width="190" height="100" rx="19" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1105" y="193" font-weight="760" fill="#9A3E24">五　权限决策</text><text x="1105" y="225" fill="#17324D">允许、询问、拒绝</text><rect x="1250" y="155" width="200" height="100" rx="19" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="1350" y="193" font-weight="760" fill="#076663">六　执行工具</text><text x="1350" y="225" fill="#17324D">结果或错误</text></g><g fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"><path d="M240 205h42"/><path d="M480 205h42"/><path d="M720 205h42"/><path d="M960 205h42"/><path d="M1200 205h42"/></g>
<path d="M1350 260v105H625v-102" fill="none" stroke="#087F7C" stroke-width="4" marker-end="url(#a)"/><text x="985" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#076663">工具结果写回消息，下一轮再交给模型</text>
<rect x="100" y="445" width="380" height="155" rx="23" fill="#E7F5F3" stroke="#087F7C" stroke-width="2.5"/><text x="290" y="487" text-anchor="middle" font-size="22" font-weight="760" fill="#076663">继续</text><text x="290" y="526" text-anchor="middle" font-size="18" fill="#17324D">还有工具结果或后续消息</text><text x="290" y="558" text-anchor="middle" font-size="16" fill="#50677D">重新装配并再次采样</text><rect x="560" y="445" width="380" height="155" rx="23" fill="#FFF2D4" stroke="#C57A0B" stroke-width="2.5"/><text x="750" y="487" text-anchor="middle" font-size="22" font-weight="760" fill="#955A00">压缩</text><text x="750" y="526" text-anchor="middle" font-size="18" fill="#17324D">上下文溢出或策略触发</text><text x="750" y="558" text-anchor="middle" font-size="16" fill="#50677D">创建摘要后继续，不删除原始任务事实</text><rect x="1020" y="445" width="380" height="155" rx="23" fill="#FFECE5" stroke="#C96138" stroke-width="2.5"/><text x="1210" y="487" text-anchor="middle" font-size="22" font-weight="760" fill="#9A3E24">停止</text><text x="1210" y="526" text-anchor="middle" font-size="18" fill="#17324D">拒绝、错误或正常终止</text><text x="1210" y="558" text-anchor="middle" font-size="16" fill="#50677D">只代表循环控制结果</text><g fill="none" stroke="#087F7C" stroke-width="3.5" marker-end="url(#a)"><path d="M865 260v130H290v47"/><path d="M865 260v130H750v47"/></g><path d="M865 260v130h345v47" fill="none" stroke="#C96138" stroke-width="3.5" marker-end="url(#b)"/>
<rect x="100" y="690" width="1300" height="135" rx="25" fill="#F0EAF8" stroke="#76559B" stroke-width="2.5"/><text x="750" y="730" text-anchor="middle" font-size="23" font-weight="760" fill="#5B3D7D">独立质量判定</text><text x="750" y="767" text-anchor="middle" font-size="18" fill="#17324D">冻结输入　最终文件　测试结果　消息与工具轨迹　资源消耗　禁止副作用</text><text x="750" y="799" text-anchor="middle" font-size="16" fill="#50677D">固定试验与版本化评分器决定正确性；训练、模型选择和发布留出集分别治理</text><path d="M1210 605v72" fill="none" stroke="#C96138" stroke-width="4" marker-end="url(#b)"/></g></svg>

