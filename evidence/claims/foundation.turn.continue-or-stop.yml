  "inference": "pi 的锁定源码根据工具批次是否要求 terminate 更新 hasMoreToolCalls，并在无后续工具后检查排队消息；对应测试构造首次 toolUse、执行工具、第二次 stop 的完整链。Gemini CLI 的 Turn 则分别产生工具调用请求，并只在响应含 finishReason 时产生 Finished 事件，测试覆盖 STOP、MAX_TOKENS 与 SAFETY。由此可推断继续或终止是 Harness 对多类事件的解释，而不是一个跨项目统一的单字段规则；各项目对 Turn、Finished 和 stopReason 的命名范围不同。",
