  "inference": "Gemini CLI 的 PolicyEngine 产生 ALLOW、DENY 或 ASK_USER 等决策，而独立的 LinuxSandboxManager 使用 Bubblewrap 准备命令，上游测试分别验证策略默认值和 bwrap 包装。Codex 的 SandboxAttempt 更直接区分 policy requested sandboxing 与主机 concrete wrapper，其 Windows 测试在后端无法强制 deny-read 时拒绝无沙箱运行。由此可推断授权与隔离是不同安全边界；具体默认策略、隔离强度、平台覆盖和回退行为仍必须按项目核对。",
