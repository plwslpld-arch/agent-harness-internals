  "inference": "Claude 公共 Python SDK 的参考 SessionStore 以 project_key/session_id 保存并追加条目，pi 从 Session 路径条目构造 Context，并在存在 compaction 条目时用摘要与保留尾部生成消息；Gemini CLI 则将摘要和保留历史组成 newHistory。三组锁定证据共同支持持久 Session 记录与单次模型可见 Context 是不同状态表面。具体项目是否保留全部原始事件、摘要怎样落盘、恢复点如何提交以及外部 Memory 是否存在，仍须逐项目核对。",
