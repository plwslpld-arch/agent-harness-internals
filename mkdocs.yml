site_name: Agent Harness 源码内核
site_description: 面向开发者的中文 Agent Harness 源码教材：从一次工具调用开始，读懂六套编程智能体的运行系统
site_url: https://plwslpld-arch.github.io/agent-harness-internals/
repo_url: https://github.com/plwslpld-arch/agent-harness-internals
repo_name: plwslpld-arch/agent-harness-internals
edit_uri: ""
copyright: 原创文档采用 CC BY 4.0；原创代码采用 MIT

theme:
  name: material
  language: zh
  logo: assets/brand/favicon.svg
  favicon: assets/brand/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.suggest

not_in_nav: |
  assets/diagrams/README.md

plugins:
  - search:
      lang: [zh, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - "首页": README.md
  - 开始学习:
      - "学习入口：先跟完一次任务": 00-start-here.md
      - "按经验选择阅读路线": learning-paths.md
  - 基础导读:
      - "Model、Harness 与 Environment：先分清谁在做什么": foundations/01-model-harness-environment.md
      - "一次任务怎样形成 Agent Loop": foundations/02-one-agent-loop.md
      - "工具、权限与执行边界：模型提出动作之后发生什么": foundations/03-tools-permissions-execution.md
      - "Session、Context、Memory 与恢复：状态究竟保存在哪里": foundations/04-session-context-memory.md
      - "Trace、Eval 与结果核对：运行结束不等于任务正确": foundations/05-trace-eval.md
  - 源码课程:
